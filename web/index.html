        </div>
      </div>
    </section>

    <aside class="ul-side">
      <div class="ul-players" id="ul-players"></div>
      <div class="ul-handbar" id="ul-handbar"></div>
      <div class="ul-logbox">
        <div class="ul-stationhead">行动日志 · 按玩家着色</div>
        <div class="ul-log" id="ul-log"></div>
      </div>
    </aside>
  </main>
</div>

<div class="ul-modal" id="ul-modal" hidden><div class="ul-modal-box" id="ul-modal-box"></div></div>
`;
    const $ = (id) => this.root.querySelector('#ul-' + id);
    // 注意：所有 id 均以 ul- 前缀声明，查询时统一补前缀。
    // 曾经把 'modal-box' 直接拼成 '#modal-box'，与骨架里的 'ul-modal-box' 不匹配，
    // 导致该节点为 null 而在下一行抛错，掩盖了真正的初始化问题。
    for (const id of ['turn', 'board', 'boardimg', 'overlay', 'dice', 'phase', 'players',
      'stabar', 'log', 'handbar', 'toast', 'modal', 'modal-box']) {
      const el = $(id);
      if (!el) throw new Error(`骨架缺少 #ul-${id} —— buildSkeleton 与查询列表不一致`);
      this.el[id] = el;
    }

    this.el.overlay.addEventListener('click', (e) => this.onBoardClick(e));
    this.root.querySelector('#ul-new').addEventListener('click', () => this.newGame());
    this.root.querySelector('#ul-auto').addEventListener('click', (e) => {
      this.autoPlay = !this.autoPlay;
      e.target.classList.toggle('ul-on', this.autoPlay);
      if (this.autoPlay) this.tick();
    });
    this.root.querySelector('#ul-help').addEventListener('click', () => this.showHelp());
    this.root.querySelector('#ul-setup').addEventListener('click', () => this.showSetup());
    this.root.querySelector('#ul-side').addEventListener('click', (e) => {
      const shell = this.root.querySelector('.ul-shell');
      const hidden = shell.classList.toggle('side-hidden');
      e.target.classList.toggle('ul-on', hidden);
      e.target.textContent = hidden ? '侧栏●' : '侧栏';
    });
  }

  /**
   * 开局设置：玩家数 / 模式 / 人类座位（AI 为唯一且固定的策略，不再分档）
   * 【为什么需要】实测经典 4 子平均 43 轮、极速单子仅 6.8 轮，
   * 两者节奏差 6 倍，若不给选择，玩家打开就是默认极速局，
   * 体验到的只是单局 6 分钟的短局，无法体会 4 子版的策略深度。
   */
  showSetup() {
    const opts = (arr, cur, attr = 'val') => arr.map((v) =>
      `<button class="ul-setup-opt ${v === cur ? 'ul-setup-on' : ''}" onclick="window.__ulApp.applySetup('${attr}',${typeof v === 'string' ? `'${v}'` : v})">${v}</button>`).join('');
    this.showModal(`
      <h2 class="ul-modal-h">开局设置</h2>
      <div class="ul-setup">
        <div class="ul-setup-row">
          <div class="ul-setup-label">玩家数</div>
          <div class="ul-setup-opts" id="ul-s-players">${opts([2, 3, 4], this.players)}</div>
        </div>
        <div class="ul-setup-row">
          <div class="ul-setup-label">模式</div>
          <div class="ul-setup-opts" id="ul-s-quick">${opts(['极速单子', '经典 4 子'], this.quick ? '极速单子' : '经典 4 子', 'str')}</div>
        </div>
        <div class="ul-setup-row">
          <div class="ul-setup-label">人类座位</div>
          <div class="ul-setup-opts" id="ul-s-human">${this.humanBtns()}</div>
        </div>
        <div class="ul-setup-note">人类座位可<b>多选</b>（同一台设备轮流操作的热座模式），点击切换「你 / AI」；
          未选中的座位由 AI 接管，全不选则进入自动演示。选 2–3 人时，n−1 张工位队列会自动缩减。</div>
      </div>
      <button class="ul-btn ul-modal-close" onclick="window.__ulApp.closeModal()">继续当前对局</button>
    `);
  }

  /** 人类座位多选按钮（热座模式：同一台设备上多个座位由真人轮流操作） */
  humanBtns() {
    return Array.from({ length: this.players }, (_, i) => {
      const on = this.human.includes(i);
      return `<button class="ul-setup-opt ${on ? 'ul-setup-on' : ''}" onclick="window.__ulApp.applySetup('human',${i})">P${i} ${on ? '你' : 'AI'}</button>`;
    }).join('');
  }

  applySetup(key, value) {
    if (key === 'players') {
      this.players = value;
      // 缩座时必须裁掉已不存在的座位，否则 isHuman 会命中越界玩家
      this.human = this.human.filter((h) => h < value);
    } else if (key === 'quick') this.quick = value === '极速单子';
    else if (key === 'human') {
      // 多选切换：已选中则取消，未选中则加入（保持升序，顺位播报更稳定）
      this.human = this.human.includes(value)
        ? this.human.filter((h) => h !== value)
        : [...this.human, value].sort((a, b) => a - b);
    }
    this.el.modal.hidden = true;
    this.newGame();          // 配置变更后重开一局
  }

  /**
   * 载入静态棋盘（由外部注入 board.svg 文本，避免运行时 fetch，file:// 下也能工作）
   *
   * 【为什么不用 innerHTML】直接把含 `<?xml ...?>` 之外的大段 SVG 塞进 innerHTML 时，
   * 浏览器按 HTML 解析器处理，viewBox / path 的命名空间处理与 XML 解析器不同，
   * 实测会出现「DOM 有内容但 path 数为 0」的黑屏。
   * 改为 DOMParser 走 XML 解析器，与 board.py 输出的 SVG 语义一致。
   */
  setBoardSvg(svgText) {
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const svg = doc.documentElement;
    if (!svg || svg.nodeName === 'parsererror' || svg.nodeName === 'html') {
      // 兜底：XML 解析失败时退回 HTML 解析
      this.el.boardimg.textContent = '';
      this.el.boardimg.insertAdjacentHTML('afterbegin', svgText);
      return;
    }
    const imported = document.importNode(svg, true);
    this.el.boardimg.textContent = '';
    this.el.boardimg.appendChild(imported);
  }

  newGame() {
    const seed = 'ui-' + Math.floor(Math.random() * 1e9);
    this.game = new Game({ players: this.players, quick: this.quick, seed });
    this.phase = PH.CARD;
    this.cursor = 0;
    this.flow = null;
    this.sixers = [];
    this.bonusQueue = [];
    this.extraChain = {};
    this.stationTaken = 0;
    this.stationPicks = [];
    this.log = [];
    this.lastAction = null;
    this.dice = null;
    this.lastMove = null;
    this.pendingActions = null;
    this.stationChoice = null;
    this.render();
    this.beginCardPhase();
  }

  pushLog(msg) {
    this.log.push(msg);
    if (this.log.length > 120) this.log.shift();
  }

  // ------------------------------------------------------------ 阶段推进
  beginCardPhase() {
    this.phase = PH.CARD;
    this.cursor = 0;
    this.render();
    this.tick();
  }

  /**
   * 推进当前阶段 —— 整个流程的唯一驱动点
   * 遇到需要人类决策的环节就停下并返回，由 UI 收集输入后再次调用
   */
  tick() {
    if (this.game.over) { this.render(); this.showWinner(); return; }

    switch (this.phase) {
      case PH.CARD: return this.tickCard();
      case PH.ACT: return this.tickAct();
      case PH.BONUS: return this.tickBonus();
    }
  }

  /** 暗牌选牌：按起始玩家顺时针依次选 */
  tickCard() {
    const order = this.game.order;
    if (this.cursor >= order.length) {
      // 全员亮牌完毕 → 公布顺位，并建立本轮的行动步骤序列
      const order2 = this.game.resolveOrder();
      this.sixers = this.game.players.filter((p) => p.points === 6).map((p) => p.id);
      this.pushLog(`— 第 ${this.game.turn + 1} 轮 · 行动顺位 ${order2.map((p) => 'P' + p).join(' → ')} —`);
      for (const p of order2) {
        const pl = this.game.players[p];
        this.pushLog(`P${p} 亮牌 ${pl.playedCard === 'DICE' ? '骰子行动牌' : pl.playedCard}${pl.playedCard === 'DICE' ? ` → ${pl.points} 点` : ''}`);
      }
      if (this.sixers.length) this.pushLog(`${this.sixers.map((p) => 'P' + p).join('、')} 掷出 6：获得额外回合，本轮禁选工位`);
      // 【流程改造 · 2026-10-06】行动顺序由 RoundFlow 统一生成，
      // 每名玩家连续完成「移动 →（若掷 6）额外回合 →（若有资格）工位」，
      // 不再是「全员移动完再统一取工位」的两阶段结构。
      this.flow = RoundFlow.start(this.game);
      this.stationTaken = 0;
      this.stationPicks = [];
      // 人类本轮无抢工位资格时，提前告知原因，避免轮到时才发现「没让我选」
      const elig = this.flow.eligible;
      const banned = order2.filter((q) => this.game.players[q].points === 6);
      this.pushLog(`工位选取：${elig.map((q) => 'P' + q).join('、') || '无人'}有资格`
        + (banned.length ? ` · ${banned.map((q) => 'P' + q).join('、')} 掷 6 禁选` : ''));
      this.phase = PH.ACT;
      this.render();
      return this.tick();
    }

    const p = order[this.cursor];
    if (this.isHuman(p) && !this.autoPlay) {
      this.render();       // 停在等待玩家选牌
      return;
    }
    const card = chooseCard(this.game, p);
    this.game.chooseCard(p, card);
    // 【暗牌保密】亮牌前不得泄露 AI 选了哪张牌 —— toast 是常驻公开信息，
    // 若在此写出「选了 3 行动牌」就等于把暗牌信息公开，属规则违规。
    this.lastAction = { player: p, text: '已暗选一张行动牌（亮牌前保密）' };
    this.cursor++;
    this.render();
    this.schedule();
  }

  /**
   * ACT 阶段 —— 逐玩家连续行动
   *
   * 【流程改造 · 2026-10-06】本方法取代原先的 tickMove / tickStation / tickExtra 三个方法。
   * 旧结构是「全员移动 → 全员工位 → 全员额外回合」的批量流水线，
   * 导致一名玩家移动完要空等到全队动完才轮到自己取工位，
   * 且工位效果在后续玩家已经动完之后才生效。
   * 新结构按 RoundFlow 的步骤序列消费，每名玩家连续完成自己的全部动作。
   */
  tickAct() {
    if (!this.flow || this.flow.done) return this.closeRound();

    const step = this.flow.current();
    const p = step.player;

    if (step.type === FLOW_STEP.MOVE) return this.actMove(p);
    if (step.type === FLOW_STEP.EXTRA) return this.actExtra(p);
    return this.actStation(p);
  }

  /** 移动步骤：人类停下等点棋子，AI 直接决策 */
  actMove(p) {
    const acts = this.game.legalActions(p);

    if (!acts.length) {
      // 规则书 1.3 唯一豁免：无任何可移动棋子时视为走 0 步
      this.pushLog(`P${p} 无可移动棋子，跳过（规则 1.3 豁免）`);
      if (this.game.players[p].points === 6) this.game.endSixMove(p);
      this.flow.next();
      this.render();
      return this.schedule();
    }

    if (this.isHuman(p) && !this.autoPlay) {
      this.pendingActions = { player: p, acts };
      this.render();
      return;   // 等待 UI 回调（onBoardClick → applyChosenMove）
    }

    const pick = chooseMove(this.game, p, acts, 'move');
    this.applyChosenMove(p, pick);
    // 【决斗】AI 踩到真人时也要挂起等真人暗扣出牌，不能直接推进给下一位
    this.afterDuelable(() => {
      this.flow.next();
      this.render();
      this.schedule();
    });
  }

  applyChosenMove(p, act) {
    if (!act) return;
    const gr = this.game.players[p].groups[act.groupIndex];
    const key = `p${p}g${act.groupIndex}`;
    // 【规则 1.3 补】免费出击显式传 free 标记：它走的是同一条物理路径（出场 1 枚），
    // 但**不消耗点数、不触发 6 点二选一/额外回合/禁选工位**。
    // 若不传，默认分支会读 pl.points / pl.playedCard，
    // 在「玩家点数是 6」的局面下会把一次免费救济误判成 6 点特权。
    // 【决斗 · 2026-10-09】真人移动时不自动结算决斗（autoDuel:false），
    // 以便弹出「暗扣出牌」界面让本人亲自选牌；AI 方由 autoDuelAI() 自动补齐。
    const ev = this.game.doMove(p, act.groupIndex, Object.assign(
      act.kind === 'free-deploy' ? { free: true } : {},
      { autoDuel: false },
    ));
    if (!ev) return;

    // 先让所有 AI 方自动出牌，再看是否还需要真人出牌
    this.autoDuelAI();

    let msg = `P${p} ${act.label}`;
    this.lastAction = { player: p, text: act.label };
    if (ev.jumped) msg += `（跳跃至 ${ev.to}）`;
    if (ev.duelLost) msg += ` 决斗败北，自己的棋子回基地`;
    else if (ev.captured && ev.captured.length) msg += ` 决斗胜：击退 ${ev.captured.map((c) => 'P' + c.player).join('、')}`;
    if (ev.enteredHome) msg += ` 进入终点航道第 ${act.mv.lanePos} 格`;
    if (ev.finished) msg += ` 抵达终点格`;
    this.pushLog(msg);

    this.lastMove = { key, player: p, jumped: !!ev.jumped, captured: ev.captured || [], finished: !!ev.finished, enteredHome: !!act.mv?.enteredHome };
    this.dice = this.game.players[p].playedCard === 'DICE' ? this.game.players[p].points : null;
    this.pendingAnims = { moved: this.lastMove, captured: ev.captured || [] };

    // 【规则 7.2/7.3】本回合点数 6 的玩家：主回合结束后标记「已用 6」并挂起额外回合，
    //   同时本轮失去工位选取资格。endSixMove 幂等，AI 与人类共用此路径。
    //   注：原实现从未调用 endSixMove，导致额外回合被吞、且 6 点玩家错误进入工位队列。
    //   【规则 1.3 补】免费出击不是 6 点行动，故跳过此标记。
    if (this.game.players[p].points === 6 && act.kind !== 'free-deploy') this.game.endSixMove(p);

    // 【决斗】若还需真人出牌，弹出暗扣界面（此时流程暂停，等 submitDuelCard 继续）
    if (this.game.isDuelPending()) this.openDuelChoice();
    void gr;
  }

  /**
   * 【决斗】为所有 AI 方自动暗扣出牌，直到只剩真人需要决策
   *
   * 决斗要求双方同时出牌。AI 不经过 UI，故在这里用与核心一致的
   * pickDuelCard 策略代它出牌；真人那一方留空，由 renderDuelPanel 弹界面收牌。
   *
   * @returns {boolean} 是否仍在等待真人出牌
   */
  autoDuelAI() {
    let guard = 0;
    while (this.game.isDuelPending() && guard++ < 32) {
      const d = this.game.duel;
      const needAtk = d.attackerCard === null;
      const p = needAtk ? d.attacker : d.defender;
      if (this.isHuman(p) && !this.autoPlay) break;   // 轮到真人 → 停下等输入
      const card = pickDuelCard(this.game.players[p]);
      if (card === null) {                            // 极端：无牌可出，跳过该场
        this.game.submitDuelCard(p, DUEL_DICE);
        continue;
      }
      this.game.submitDuelCard(p, card);
    }
    return this.game.isDuelPending();
  }

  /**
   * 【决斗 · 2026-10-10 修复】提交「可能触发决斗的动作」之后的统一收尾
   *
   * 【为什么必须有这一步】决斗要求双方各暗扣一张牌。此前只有主移动
   * （applyChosenMove）会走 UI 收尾，而额外回合 / 赏骰 / 工位三条路径
   * 都沿用 core 的默认 autoDuel=true —— 双方被 AI 策略静默代打后立即结算，
   * 真人既看不到暗扣界面也没机会出牌。表现正是用户报告的
   * 「我攻击了却没触发过决斗，电脑直接回去了」。
   *
   * 【统一口径】任何一次可能踩到敌子的提交，都先由本方法补齐 AI 方的牌；
   * 若真人的牌仍空缺，就把收尾动作 cont 暂存并原地等待，
   * 由 submitDuelCard 在全部场次结算完毕后（或本就没有决斗时立即）续跑。
   *
   * @param {Function} cont 决斗全部结束后的收尾动作（推进流程 / 处理 6 点连锁 / 滚动队列）
   * @returns {boolean} true=已挂起等待真人出牌；false=无需等待，已直接执行 cont
   */
  afterDuelable(cont) {
    this.autoDuelAI();
    if (this.game.isDuelPending()) {
      this.openDuelChoice();
      this._duelCont = cont;
      this.render();
      return true;
    }
    cont();
    return false;
  }

  /**
   * 【决斗】真人提交暗扣牌
   * @param {number|string} card 数字牌 1–6 或 'DICE'
   */
  submitDuelCard(card) {
    if (!this.duelChoice) return;
    const p = this.duelChoice.player;
    this.duelChoice = null;
    this.game.submitDuelCard(p, card);
    this.pushLog(`你暗扣出 ${card === DUEL_DICE ? '骰子行动牌' : card + ' 点'}`);
    // 结算后可能还有下一场（逐一决斗），继续为 AI 补齐或等真人
    if (this.autoDuelAI()) {
      this.openDuelChoice();
      this.render();
      return;   // 还有一场等真人出牌 —— 保持挂起，不推进流程
    }
    this.pushLog(this.game.duelLost ? '决斗败北，你的棋子回基地' : '决斗胜利');
    // 全部场次打完 → 续跑此前被挂起的收尾动作（推进流程 / 6 点连锁 / 工位队列滚动）
    const cont = this._duelCont;
    this._duelCont = null;
    if (cont) cont();
    else { this.render(); this.schedule(); }
  }

  /** 【决斗】为当前等待中的真人准备出牌选项 */
  openDuelChoice() {
    const d = this.game.duel;
    if (!d) { this.duelChoice = null; return; }
    const needAtk = d.attackerCard === null;
    const p = needAtk ? d.attacker : d.defender;
    if (!this.isHuman(p) || this.autoPlay) { this.duelChoice = null; return; }
    this.duelChoice = {
      player: p,
      role: needAtk ? 'attacker' : 'defender',
      foe: needAtk ? d.defender : d.attacker,
      options: duelCardOptions(this.game.players[p]),
    };
  }

  /**
   * 播报一次移动的动画
   *
   * 【实现要点】动画不能挂在棋子 <g> 上：棋子每次 render 都被 innerHTML 重建，
   * 元素引用当场失效，CSS 类无处附着。正确做法是发一条一次性 CSS 规则到
   * <style> 里，用选择器命中新渲染出来的节点，动画播完自动清空。
   * 这样动画与渲染解耦，render 频率多高都不影响。
   *
   * @param {object} mv {key, player, jumped, finished}
   */
  animateMove(mv) {
    if (!mv || !mv.key) return;
    const sel = `[data-key="${mv.key}"]`;
    const rules = [];
    if (mv.jumped) rules.push(`${sel} { animation: ptjump .5s ease-out; }`);
    // 抵达终点的棋子会在本次 render 中被移出 groups（Bug A 修复后的语义），
    // 因此不存在对应的 DOM 节点可附着动画。
    // 改用中央指令盘的一次性闪光来传达「完成」，视觉落点也合理。
    if (mv.finished) rules.push('#center-status { animation: ptfin .7s ease-out; }');
    if (rules.length) this.injectAnim(rules.join('\n'));
  }

  /**
 * 被吃掉的敌子：淡出缩小
 *
 * 【为什么用玩家级选择器而不是棋子 key】棋子被吃后立刻退回基地，
 * 其 data-key 中的 groupIndex 会在下一次 render 里被另一个棋子复用，
 * 用 key 定位可能淡出错误的棋子。改用 data-player 定位整组，
 * 视觉上更接近「这一家的棋子被清掉了」的语义，且不会误伤。
 */
  animateCaptured(list) {
    if (!list || !list.length) return;
    const pids = [...new Set(list.map((c) => c.player))];
    const sels = pids.map((p) => `[data-player="${p}"]`).join(',');
    this.injectAnim(`${sels} { animation: ptcap .5s ease-in forwards; }`);
  }

  /** 一次性注入 CSS 规则，播完自动清空，避免样式表无限膨胀 */
  injectAnim(css) {
    if (!this.animStyle) {
      this.animStyle = document.createElement('style');
      this.animStyle.id = 'ul-anim';
      document.head.appendChild(this.animStyle);
    }
    this.animStyle.textContent = css;
    if (this.animTimer) clearTimeout(this.animTimer);
    this.animTimer = setTimeout(() => { this.animStyle.textContent = ''; }, 900);
  }

  /**
   * 工位步骤：在该玩家自己的回合内立刻执行
   * 【流程改造】旧结构下这里是一个独立的「全员工位阶段」，
   * 现在改成「P_k 移动完马上取工位并生效」，影响在后续玩家行动之前。
   */
  actStation(p) {
    // 【裁定 1】四人工位队列仅 3 张，第 4 名空转（正常不会走到这里，资格已过滤）
    if (!this.game.queue.length) {
      this.pushLog(`P${p} 无工位可取，本轮空转（裁定 1）`);
      this.flow.next();
      this.render();
      return this.schedule();
    }

    if (this.isHuman(p) && !this.autoPlay) {
      this.stationChoice = { player: p, mode: 'pick' };
      this.render();
      return;   // 等待 UI 选定工位
    }

    const idx = chooseStationIndex(this.game, p, this.game.queue);
    this.runStation(p, idx);
    // 【决斗 · 2026-10-10 修复】工位推进若引发决斗，等结算完再推进给下一家
    this.afterDuelable(() => {
      this.flow.next();
      this.render();
      this.schedule();
    });
  }

  /** 执行某玩家选取的第 index 张工位 */
  runStation(p, index) {
    const st = this.game.takeStation(index);
    if (!st) return;
    this.game.markUsed(st.id);
    this.stationTaken++;
    this.stationPicks.push({ player: p, station: st });
    this.pushLog(`P${p} 取得工位「${st.name}」`);
    this.lastAction = { player: p, text: `抢到工位「${st.name}」` };

    const opts = stationOptions(this.game, p, st);
    if (!opts.length) {
      this.pushLog(`P${p} 工位「${st.name}」当前无可执行效果，空转`);
      return;
    }

    if (this.isHuman(p) && !this.autoPlay) {
      // 【8.3 #7】赏骰只登记、不结算 —— 登记发生在工位生效的<b>当场</b>（谁拿到记谁），
      // 真正的掷骰与移动仍延后到全员行动结束。flow.addBonus 会去重。
      if (opts.length === 1 && opts[0].kind === 'bonusDice') {
        this.flow.addBonus(p);
        this.pushLog(`P${p} 获得赏骰奖励轮（全员行动结束后执行）`);
        return;
      }
      this.stationChoice = { player: p, mode: 'effect', station: st, opts };
      return;
    }
    const opt = chooseStationOption(this.game, p, st, opts);
    // 【决斗 · 2026-10-10 修复】工位推进踩到敌子时挂起等真人出牌（AI 之间仍由 autoDuelAI 代打）
    const ev = applyStationAction(this.game, p, st, Object.assign({}, opt, { autoDuel: false }));
    this.afterStation(p, st, opt, ev);
  }

  afterStation(p, st, opt, ev) {
    if (!ev) return;
    if (ev.type === 'move') {
      let m = `P${p} 工位推进${ev.jumped ? '（跳跃）' : ''}`;
      if (ev.captured && ev.captured.length) m += ` 吃子：击退 ${ev.captured.map((c) => 'P' + c.player).join('、')}`;
      if (ev.finished) m += ` 抵达终点格`;
      this.pushLog(m);
      this.lastMove = { key: `p${p}g${opt.groupIndex}`, player: p, jumped: !!ev.jumped, captured: ev.captured || [], finished: !!ev.finished };
      this.pendingAnims = { moved: this.lastMove, captured: ev.captured || [] };
    } else if (ev.type === 'bonusDice') {
      // 【8.3 #7】登记发生在当场；结算延后到全员行动结束（见 runStation 内的同类分支）
      this.flow.addBonus(p);
      this.pushLog(`P${p} 获得赏骰奖励轮（全员行动结束后执行）`);
    }
  }

  /**
   * 额外回合步骤（6 点玩家，只能掷骰，可连锁）
   *
   * 【流程改造】旧结构下额外回合是「全员工位之后」的独立阶段，
   * 现在归属于掷 6 的该玩家自己的连续动作 —— 紧接在他本人的移动之后，
   * 不会被别的玩家插进来。
   */
  actExtra(p) {
    if (this.isHuman(p) && !this.autoPlay) {
      this.stationChoice = { player: p, mode: 'extra' };
      this.render();
      return;   // 等待 UI 掷骰
    }

    const pts = this.game.rollExtra(p);
    this.dice = pts;
    this.pushLog(`P${p} 额外回合掷出 ${pts}`);
    this.lastAction = { player: p, text: `额外回合 · 掷出 ${pts} 点` };
    const opts = this.game.extraTurnOptions(p, pts);
    if (!opts.length) {
      this.pushLog(`P${p} 额外回合无可执行动作`);
      this.game.endExtraTurn(p);
      this.afterExtraStep(p, pts);
      this.render();
      return this.schedule();
    }
    const pick = chooseMove(this.game, p, opts, 'extra');
    // 【决斗 · 2026-10-10 修复】AI 的额外回合踩到真人同样要挂起，不能静默代打
    const ev = this.game.commitExtraTurn(p, pick.groupIndex, { autoDuel: false });
    // AI 的额外回合也必须写清「掷了几点、走了哪步」，否则玩家只看到棋子瞬移
    this.pushLog(`P${p} 额外回合（${pts} 点）：${pick.label}`);
    this.lastAction = { player: p, text: `额外回合 ${pts} 点 · ${pick.label}` };
    if (ev && ev.finished) this.pushLog(`P${p} 额外回合抵达终点格`);
    this.pendingAnims = {
      moved: { key: `p${p}g${pick.groupIndex}`, player: p, jumped: !!ev?.jumped, captured: ev?.captured || [], finished: !!ev?.finished },
      captured: (ev && ev.captured) || [],
    };
    this.game.endExtraTurn(p);
    this.afterDuelable(() => {
      this.afterExtraStep(p, pts);
      this.render();
      this.schedule();
    });
  }

  /**
   * 额外回合收尾：处理 6 点连锁（规则 7.3）
   *
   * 【连锁归属】再次掷出 6 → 重复触发全部 6 点规则 → 再来一次额外回合。
   * 必须同时 reopenExtraTurn：endExtraTurn 刚把 pendingExtra 清成 false，
   * 若不重新置起，下一轮 commitExtraTurn 会被守卫早退，棋子不动（实测 8 局 7 次）。
   *
   * 【与游标的配合】flow.afterExtra(true) 会让游标停在同一步（不推进），
   * 于是连锁自然表现为「同一个人继续行动」，无需任何队列插拔。
   */
  afterExtraStep(p, pts) {
    if (pts === 6 && this.extraGuard(p) < EXTRA_CHAIN_CAP) {
      this.game.reopenExtraTurn(p);
      this.flow.afterExtra(true);
      this.pushLog(`P${p} 额外回合再次掷出 6：重复触发 6 点规则`);
    } else {
      this.flow.afterExtra(false);
    }
  }

  /** 同一玩家的额外回合连锁次数（防御性上限，概率 (1/6)^10 ≈ 1.7e-8） */
  extraGuard(p) {
    this.extraChain = this.extraChain || {};
    this.extraChain[p] = (this.extraChain[p] || 0) + 1;
    return this.extraChain[p];
  }

  /** 赏骰奖励轮（流程第九步：起始玩家轮转之后执行） */
  tickBonus() {
    if (!this.bonusQueue.length) {
      this.phase = PH.CARD;
      this.cursor = 0;
      this.render();
      return this.tick();
    }    const p = this.bonusQueue[0];
    if (this.isHuman(p) && !this.autoPlay) {
      this.stationChoice = { player: p, mode: 'bonus' };
      this.render();
      return;   // 等待玩家掷骰
    }
    this.runBonus(p);
    // 【决斗 · 2026-10-10 修复】AI 赏骰踩到真人也要等真人出牌后再滚动到下一家
    this.afterDuelable(() => {
      this.bonusQueue.shift();
      this.render();
      this.schedule();
    });
  }

  /** 人类赏骰 · 第 1 步：掷骰 */
  playerRollBonus() {
    if (!this.stationChoice || this.stationChoice.mode !== 'bonus') return;
    const p = this.stationChoice.player;
    const pts = this.game.rollBonus(p);
    this.dice = pts;
    this.pushLog(`P${p} 赏骰奖励轮掷出 ${pts}`);
    this.lastAction = { player: p, text: `赏骰奖励 · 掷出 ${pts} 点` };
    const opts = this.game.bonusOptions(p, pts);
    if (!opts.length) {
      this.pushLog(`P${p} 赏骰奖励轮无可移动棋子，空转`);
      this.bonusQueue.shift();
      this.stationChoice = null;
      this.pickActions = null;
      this.render();
      this.schedule(320);
      return;
    }
    this.stationChoice = { player: p, mode: 'bonus-move', pts, opts };
    this.pickActions = { player: p, acts: opts, kind: 'bonus' };
    this.render();
  }

  /** 人类赏骰 · 第 2 步：选棋子并提交 */
  pickBonusMove(i) {
    if (!this.stationChoice || this.stationChoice.mode !== 'bonus-move') return;
    const { player, opts, pts } = this.stationChoice;
    const opt = opts[i];
    if (!opt) return;
    // 【决斗 · 2026-10-10 修复】autoDuel:false —— 赏骰奖励轮踩到敌子同样要挂起等真人出牌
    const ev = this.game.commitBonus(player, pts, opt.groupIndex, { autoDuel: false });
    this.pushLog(`P${player} 赏骰奖励轮（${pts} 点）：${opt.label}`);
    this.lastAction = { player, text: `赏骰奖励 ${pts} 点 · ${opt.label}` };
    this.pendingAnims = {
      moved: { key: `p${player}g${opt.groupIndex}`, player, jumped: !!ev?.jumped, captured: ev?.captured || [], finished: !!ev?.finished },
      captured: (ev && ev.captured) || [],
    };
    this.afterDuelable(() => {
      this.bonusQueue.shift();
      this.stationChoice = null;
      this.pickActions = null;
      this.render();
      this.schedule(320);
    });
  }

  /** AI 赏骰奖励轮 */
  runBonus(p) {
    const pts = this.game.rollBonus(p);
    this.dice = pts;
    const opts = this.game.bonusOptions(p, pts);
    if (!opts.length) {
      this.pushLog(`P${p} 赏骰奖励轮掷出 ${pts}，无可移动棋子，空转`);
      return;
    }
    const pick = chooseMove(this.game, p, opts, 'bonus');
    const ev = this.game.commitBonus(p, pts, pick.groupIndex);
    this.pushLog(`P${p} 赏骰奖励轮（${pts} 点）：${pick.label}`);
    this.lastAction = { player: p, text: `赏骰奖励 ${pts} 点 · ${pick.label}` };
    this.pendingAnims = {
      moved: { key: `p${p}g${pick.groupIndex}`, player: p, jumped: !!ev?.jumped, captured: ev?.captured || [], finished: !!ev?.finished },
      captured: (ev && ev.captured) || [],
    };
  }

  /**
   * 本轮行动全部走完 → 队列滚动刷新 + 轮转起始玩家 → 赏骰奖励轮
   *
   * 【流程改造 · 2026-10-06】取代原先的 tickEnd。
   * 收尾三件事的顺序由规则书第三章末段决定，不可颠倒：
   *   ① 工位队列滚动刷新（取走几张就补入几张）
   *   ② 确定下一轮起始玩家（nextTurn）
   *   ③ 执行赏骰奖励轮
   * 其中 ①② 封装在 RoundFlow.finish 里，③ 延后到 BONUS 阶段。
   */
  closeRound() {
    if (this.game.over) { this.render(); this.showWinner(); return; }
    // 【规则 4.3 时序修正 2026-10-10】回收延后到本轮工位阶段之后：
    // 先 flushRecycle 让读弃牌区的工位能读到本回合弃牌，再做队列刷新/轮转。
    this.game.flushRecycle();
    if (this.stationTaken) this.pushLog(`工位队列滚动刷新：补入 ${this.stationTaken} 张`);
    const bonus = this.flow.finish(this.stationTaken);
    this.bonusQueue = bonus;
    this.sixers = [];
    this.extraChain = {};
    this.pendingActions = null;
    this.stationChoice = null;
    this.flow = null;
    this.phase = bonus.length ? PH.BONUS : PH.CARD;
    this.cursor = 0;
    this.render();
    this.tick();
  }

  /** 非阻塞推进（AI 自动时用定时器，避免一次性递归爆栈） */
  schedule(ms = 420) {
    if (this.timer) return;
    this.timer = setTimeout(() => {
      this.timer = null;
      this.tick();
    }, ms);
  }

  isHuman(p) {
    return this.human.includes(p);
  }

  // ------------------------------------------------------------ UI 事件

  /** 玩家点击棋子 → 提交移动 */
  onBoardClick(e) {
    const g = e.target.closest('.pt');
    if (!g) return;
    const gi = parseInt(g.dataset.gi, 10);
    const pl = parseInt(g.dataset.player, 10);

    // 移动阶段：选棋子
    if (this.pendingActions && this.pendingActions.player === pl) {
      const act = this.pendingActions.acts.find((a) => a.groupIndex === gi);
      if (act) {
        this.pendingActions = null;
        this.applyChosenMove(pl, act);
        // 【决斗 · 2026-10-10 修复】决斗未结算前不得推进流程：
        //   旧写法无条件 flow.next()，流程立刻走到下一位（往往是 AI），
        //   renderHand 随即把正在等待的暗扣面板覆盖掉 —— 决斗永远等不到回应。
        this.afterDuelable(() => {
          this.flow.next();
          this.render();
          this.schedule(300);
        });
      }
      return;
    }

    // 额外回合 / 赏骰奖励轮：同样支持在棋盘上直接点棋子（与手牌区按钮等价）
    if (this.pickActions && this.pickActions.player === pl) {
      const i = this.pickActions.acts.findIndex((a) => a.groupIndex === gi);
      if (i >= 0) {
        if (this.pickActions.kind === 'extra') this.pickExtraMove(i);
        else if (this.pickActions.kind === 'bonus') this.pickBonusMove(i);
      }
      return;
    }

    // 暗牌阶段：点自己的棋子 = 无意义，给出提示
    if (this.phase === PH.CARD && this.isHuman(this.game.order[this.cursor])) {
      const pl2 = this.game.players[pl];
      if (pl2 && !pl2.playedCard) this.flash('请从下方手牌中选择行动牌');
    }
  }

  /** 玩家选牌 */
  playerChooseCard(card) {
    const p = this.game.order[this.cursor];
    if (!this.isHuman(p)) return;
    try {
      this.game.chooseCard(p, card);
      this.cursor++;
      this.render();
      this.schedule(240);
    } catch (err) {
      this.flash(err.message);
    }
  }

  /** 玩家选定工位效果 */
  playerChooseStationEffect(station, opt) {
    const { player } = this.stationChoice;
    // 【决斗 · 2026-10-10 修复】autoDuel:false —— 工位效果踩到敌子必须走 UI 暗扣，
    //   旧写法沿用默认 true，双方被 AI 策略静默代打后立刻结算，真人全程无感。
    const ev = applyStationAction(this.game, player, station, Object.assign({}, opt, { autoDuel: false }));
    this.stationChoice = null;
    this.afterStation(player, station, opt, ev);
    this.afterDuelable(() => {
      this.flow.next();
      this.render();
      this.schedule(320);
    });
  }

  /**
   * 人类额外回合 · 第 1 步：掷骰
   *
   * 【为什么拆两步】原实现把「掷骰 → 列选项 → 直接替玩家挑一个 → 执行」写成一坨，
   * 人类的额外回合实际上由 AI 代选，玩家点完「掷骰」就看不见自己走了哪步。
   * 拆成 掷骰(playerRollExtra) / 选动作(pickExtraMove) 两步后，
   * 人机与 AI 走完全相同的规则路径，差别只在第 2 步由谁做选择。
   */
  playerRollExtra() {
    if (!this.stationChoice || this.stationChoice.mode !== 'extra') return;
    const p = this.stationChoice.player;
    const pts = this.game.rollExtra(p);
    this.dice = pts;
    this.pushLog(`P${p} 额外回合掷出 ${pts}`);
    this.lastAction = { player: p, text: `额外回合 · 掷出 ${pts} 点` };

    const opts = this.game.extraTurnOptions(p, pts);
    if (!opts.length) {
      this.pushLog(`P${p} 额外回合无可执行动作`);
      this.game.endExtraTurn(p);
      this.afterExtraStep(p, pts);
      this.stationChoice = null;
      this.pickActions = null;
      this.render();
      this.schedule(320);
      return;
    }
    // 停在「选动作」：棋盘棋子与手牌区按钮两种入口都能提交
    this.stationChoice = { player: p, mode: 'extra-move', pts, opts };
    this.pickActions = { player: p, acts: opts, kind: 'extra' };
    this.render();
  }

  /** 人类额外回合 · 第 2 步：选动作并提交 */
  pickExtraMove(i) {
    if (!this.stationChoice || this.stationChoice.mode !== 'extra-move') return;
    const { player, opts, pts } = this.stationChoice;
    const opt = opts[i];
    if (!opt) return;
    // 【决斗 · 2026-10-10 修复】autoDuel:false —— 额外回合踩到敌子时也必须挂起等真人出牌
    const ev = this.game.commitExtraTurn(player, opt.groupIndex, { autoDuel: false });
    this.pushLog(`P${player} 额外回合（${pts} 点）：${opt.label}`);
    this.lastAction = { player, text: `额外回合 ${pts} 点 · ${opt.label}` };
    this.pendingAnims = {
      moved: { key: `p${player}g${opt.groupIndex}`, player, jumped: !!ev?.jumped, captured: ev?.captured || [], finished: !!ev?.finished },
      captured: (ev && ev.captured) || [],
    };
    this.game.endExtraTurn(player);
    this.stationChoice = null;
    this.pickActions = null;
    this.afterDuelable(() => {
      // 【规则 7.3】再次掷出 6 → 重复触发全部 6 点规则（再掷一次额外回合）。
      // 走与AI 完全相同的 afterExtraStep，连锁由游标停在同一步实现，
      // 不需要任何队列插拔 —— 人机在此处必然一致。
      this.afterExtraStep(player, pts);
      this.render();
      this.schedule(320);
    });
  }

  flash(msg) {
    const el = this.el.phase;
    el.dataset.flash = msg;
    el.classList.add('ul-flash');
    setTimeout(() => el.classList.remove('ul-flash'), 1600);
  }

  showWinner() {
    const w = this.game.winner;
    this.pushLog(`★ 对局结束：P${w} ${pc(w,'code')} 获胜`);
    this.showModal(`

  showModal(html) {
    this.el['modal-box'].innerHTML = html;
    this.el.modal.hidden = false;
  }

  /** 关闭弹窗并重新渲染：若有未完成的工位选取/效果选择，会重新弹出，避免丢失进度 */
  closeModal() {
    this.el.modal.hidden = true;
    this.render();
  }

  // ------------------------------------------------------------ 渲染
  render() {
    this.el.turn.textContent = this.game.turn + 1;

    // 棋盘覆盖层：棋子 + 可选落点 + 中央状态
    // 【额外回合 / 赏骰奖励轮也要能在棋盘上点】pickActions 与 pendingActions 共用同一套
    // 「落点预览 + 棋子高亮」渲染，玩家因此看得出这一步动的是哪枚棋子，
    // 而不是只在手牌区点一个写着「4 格」的按钮（用户反馈：不知道移动了哪个棋子）。
    const pa = this.pendingActions || this.pickActions;
    const cur = this.pendingActions ? this.pendingActions.player
      : (this.phase === PH.CARD ? this.game.order[this.cursor] : this.currentActor());
    let overlay = '';
    if (pa && (this.phase === PH.ACT || this.phase === PH.BONUS)) {
      overlay += renderTargets(this.game, pa.player, pa.acts);
    }
    // 可点棋子高亮：必须包含 mv === null 的动作（6 点「出击」/ 工位出击对应基地棋子），
    // 否则基地棋子会被 dimOthers 置灰，玩家既看不出能点、点了也没反馈 —— 表现为「不能出击」。
    const activeKeys = pa ? pa.acts.map((a) => `p${pa.player}g${a.groupIndex}`) : [];
    overlay += renderPieces(this.game, { activeKeys, dimOthers: !!pa });
    overlay += renderCenterStatus(this.game, this.phaseLabel(), cur);
    this.el.overlay.innerHTML = overlay;

    // 骰子
    // 状态条只有 30px 高，骰子缩到 26px，避免把棋盘往上挤
    this.el.dice.innerHTML = this.dice ? die3d(26, this.dice) : '';

    // 阶段提示
    this.el.phase.dataset.flash = this.el.phase.dataset.flash || '';
    this.el.phase.innerHTML = this.phaseBanner();
    this.el.phase.classList.toggle('ul-phase-act', this.humanMustAct());

    // 实时动作提示（toast）：常驻显示最近一次动作，独立于侧栏 —— 隐藏侧栏也能看清谁做了什么
    const la = this.lastAction;
    if (la && la.text) {
      this.el.toast.innerHTML =
        '<span class="t-dot"></span>'
        + `<span class="t-who" style="--c:${pcolor(la.player)}">P${la.player} ${pcn(la.player)}</span>`
        + `<span class="t-txt">${escapeXml(la.text)}</span>`;
      this.el.toast.style.setProperty('--c', pcolor(la.player));
      this.el.toast.hidden = false;
    } else {
      this.el.toast.hidden = true;
    }

    this.renderPlayers();
    this.renderStationBar();
    this.renderHand();
    this.renderLog();

    // 动画必须在 innerHTML 重建之后注入，否则选择器命中的是已被替换的旧节点
    if (this.pendingAnims) {
      const a = this.pendingAnims;
      this.pendingAnims = null;
      this.animateMove(a.moved);
      this.animateCaptured(a.captured);
    }
  }

  currentActor() {
    if (this.phase === PH.ACT) return this.flow && !this.flow.done ? this.flow.current().player : null;
    if (this.phase === PH.BONUS) return this.bonusQueue[0] ?? null;
    return null;
  }

  /**
   * 当前步骤的阶段名
   * 【流程改造】ACT 是一个阶段，但内部有三类步骤（移动/额外回合/工位），
   * 提示条需要分别告知玩家此刻在做什么，否则又会出现「不知道该干什么」。
   */
  phaseLabel() {
    switch (this.phase) {
      case PH.CARD: return '暗牌选行动';
      case PH.BONUS: return '赏骰奖励轮';
      default: {
        const st = this.flow && !this.flow.done ? this.flow.current() : null;
        if (!st) return '轮转收尾';
        if (st.type === FLOW_STEP.MOVE) return '移动';
        if (st.type === FLOW_STEP.EXTRA) return '额外回合';
        return '工位选取';
      }
    }
  }

  phaseBanner() {
    const cur = this.pendingActions ? this.pendingActions.player : this.currentActor();
    const act = (txt) => `<span class="ul-tag ul-tag-act">${txt}</span>`;
    if (this.phase === PH.CARD) {
      const p = this.game.order[this.cursor];
      if (p === undefined) return '';
      const pl = this.game.players[p];
      if (pl.playedCard !== null) return `<span class="ul-tag" style="--c:${pcolor(p)}">P${p} ${pcn(p)} 已选 ${pl.playedCard === 'DICE' ? '骰子牌' : pl.playedCard}</span>`;
      if (this.isHuman(p)) return act(`轮到你了 · 从底部手牌选一张行动牌`);
      return `<span class="ul-tag" style="--c:${pcolor(p)}">P${p} ${pcn(p)}（AI）暗选中…</span>`;
    }
    if (this.pendingActions) {
      return act(`轮到你了 · 点击棋盘上高亮的棋子移动`);
    }
    if (this.stationChoice) {
      const p = this.stationChoice.player;
      if (this.stationChoice.mode === 'pick') return act(`P${p} ${pcn(p)} · 从右侧队列选一张工位`);
      if (this.stationChoice.mode === 'effect') return act(`P${p} · 选择「${this.stationChoice.station.name}」的效果`);
      if (this.stationChoice.mode === 'extra-move') return act(`P${p} · 额外回合 ${this.stationChoice.pts} 点：选一个动作`);
      return act(`P${p} · 点底部「掷骰」执行额外回合`);
    }
    if (cur !== null && cur !== undefined) {
      return `<span class="ul-dim">${this.phaseLabel()} · P${cur} ${pcn(cur)} ${this.isHuman(cur) ? '' : 'AI 思考中'}</span>`;
    }
    return `<span class="ul-dim">${this.phaseLabel()}</span>`;
  }

  /** 当前是否轮到人类做必须点击的决策（用于点亮阶段提示条 / 手牌脉冲） */
  humanMustAct() {
    if (this.game.over) return false;
    // 【决斗】暗扣出牌是当前唯一允许的操作，优先级最高
    if (this.duelChoice) return true;
    if (this.phase === PH.CARD) {
      const p = this.game.order[this.cursor];
      return p !== undefined && this.isHuman(p) && this.game.players[p].playedCard === null;
    }
    if (this.pendingActions) return true;
    if (this.stationChoice) return this.isHuman(this.stationChoice.player);
    return false;
  }

  renderPlayers() {
    const html = this.game.players.map((pl) => {
      const s = playerSummary(this.game, pl.id);
      const cur = this.pendingActions ? this.pendingActions.player : this.currentActor();
      const inCard = this.phase === PH.CARD && this.game.order[this.cursor] === pl.id;
      const active = cur === pl.id || inCard;
      const chips = [];
      for (let i = 0; i < s.total; i++) {
        const cls = i < s.finished ? 'ul-chip ul-chip-fin' : 'ul-chip';
        chips.push(`<span class="${cls}" style="--c:${pcolor(pl.id)}" title="${i < s.finished ? '已抵达终点' : '在局中'}"></span>`);
      }
      // 【规则 5.5】无敌徽标：剩余轮数 > 0 时显示，让玩家看得见自己受保护的状态。
      // 不可省略 —— 免疫是**对敌方可见**的规则事实，隐藏它会让玩家
      // 「白挨打却不知道为何没被吃」，也会让对手误判该不该继续进攻。
      const inv = s.invincible > 0
        ? `<span class="ul-tag-inv" title="规则 5.5无敌：免疫吃子，剩余 ${s.invincible} 轮；敌子踩到你的棋子会被弹回基地">无敌 ${s.invincible}</span>`
        : '';
      return `<div class="ul-pcard ${active ? 'ul-pcard-on' : ''}" style="--c:${pcolor(pl.id)}">
        <div class="ul-phead">
          <span class="ul-pdot"></span>
          <span class="ul-pname">P${pl.id} ${pcn(pl.id)}</span>
          <span class="ul-pcode">${pc(pl.id,'code')}</span>
          <span class="ul-ptag">${this.isHuman(pl.id) ? '人类' : 'AI'}</span>
          ${inv}
        </div>
        <div class="ul-pchips">${chips.join('')}</div>
        <div class="ul-pmeta">
          <span>航道 ${s.track}</span><span>基地 ${s.base}</span><span>终点 ${s.finished}/${s.total}</span>
        </div>
        <div class="ul-pcard2">手牌 ${s.hand.length} 张 · 弃 ${s.discard} 张</div>
      </div>`;
    }).join('');
    this.el.players.innerHTML = html;
  }

  /**
   * 工位栏（棋盘上方独立一条，不覆盖棋盘格）—— 解决「看不到工位」
   *
   * 【为什么独立成条】工位队列最早放在侧栏，侧栏可被「侧栏」按钮隐藏，
   *   一旦隐藏就彻底看不到工位；做成弹窗又会遮住棋盘格。
   *   独立一条位于棋盘上方：既常驻可见，又不占用/遮挡棋盘。
   *
   * 内容三段：① 当前可见队列（你的抢牌回合可点）② 本轮资格名单 ③ 本轮已抢记录
   */
  renderStationBar() {
    const canPick = this.stationChoice && this.stationChoice.mode === 'pick';
    const items = this.game.queue.map((id, i) => {
      const st = ST_BY_ID.get(id);
      if (!st) return '';
      const on = canPick ? ' ul-sb-on' : '';
      const click = canPick ? ` onclick="window.__ulApp.pickStation(${i})"` : '';
      return `<div class="ul-sb-item${on}"${click}>
        <span class="ul-sb-no">${id}</span>
        <span class="ul-sb-txt"><b>${escapeXml(st.name)}</b><i>${escapeXml(stationKindText(st))}</i></span>
      </div>`;
    }).join('') || '<span class="ul-dim">队列空</span>';

    // 资格名单：6 点玩家禁选（规则 7.3），其余按顺位取前 STATION_PICK_LIMIT 名。
    // 【流程改造 · 2026-10-06】亮牌后资格即已确定（RoundFlow 在生成步骤序列时就判定），
    // 不再依赖「移动阶段结束」这个时机 —— 旧结构下资格要等到全员动完才成立，
    // 现在从亮牌那一刻起就能如实显示，玩家不会看到「本轮可抢：待亮牌」的中间态。
    const live = !!(this.flow && !this.flow.done);
    const elig = live ? this.flow.eligible : [];
    const banned = live ? this.flow.order.filter((q) => this.game.players[q].points === 6) : [];
    const chip = (q) => `<span class="ul-sb-chip" style="--c:${pcolor(q)}">P${q}</span>`;
    const right =
      `<div class="ul-sb-row"><span class="ul-sb-k">本轮可抢</span>`
      + (elig.length ? elig.map(chip).join('') : '<span class="ul-dim">待亮牌</span>') + `</div>`
      + `<div class="ul-sb-row"><span class="ul-sb-k">掷6禁选</span>`
      + (banned.length ? banned.map(chip).join('') : '<span class="ul-dim">无</span>') + `</div>`
      + (this.stationPicks.length
        ? `<div class="ul-sb-row"><span class="ul-sb-k">已抢</span>`
          + this.stationPicks.map((t) => `<span class="ul-sb-chip" style="--c:${pcolor(t.player)}">P${t.player}→#${t.station.id}</span>`).join('')
          + `</div>`
        : '');

    const head = canPick
      ? `<span class="ul-sb-label ul-sb-hot">工位队列 · 轮到你抢（点卡片）</span>`
      : `<span class="ul-sb-label">工位队列 <span class="ul-dim">n−1 张 · 全员对称可见</span></span>`;

    this.el.stabar.innerHTML =
      `<div class="ul-sb-left">${head}<div class="ul-sb-items">${items}</div></div>`
      + `<div class="ul-sb-right">${right}</div>`;
  }

  renderHand() {
    // 【决斗 · 2026-10-10 修复】决斗等待中的真人优先于流程游标。
    //   currentActor() 在 ACT 阶段返回 flow.current().player —— 移动提交后游标
    //   常常已经指向下一位（往往是 AI），旧逻辑随即走进下面的
    //   「非真人 → 渲染「AI 行动中」并提前 return」分支，
    //   暗扣出牌按钮**永远渲染不出来**：表现正是「攻击了却毫无决斗提示」。
    //   故只要还有一场决斗在等真人出牌，就以该真人为手牌区的主人。
    const duelP = this.duelChoice ? this.duelChoice.player : null;
    const p = duelP !== null
      ? duelP
      : (this.phase === PH.CARD ? this.game.order[this.cursor] : this.currentActor());
    if (p === undefined || p === null || !this.isHuman(p)) {
      const cur = p;
      this.el.handbar.innerHTML = cur !== null && cur !== undefined && cur !== undefined
        ? `<div class="ul-hand-idle">当前由 <b style="color:${pcolor(cur)}">P${cur} ${pcn(cur)}</b> 行动（${this.isHuman(cur) ? '你' : 'AI'}）</div>`
        : '<div class="ul-hand-idle">等待中</div>';
      return;
    }

    const pl = this.game.players[p];
    const inCard = this.phase === PH.CARD && pl.playedCard === null;
    const waitCls = inCard ? ' ul-hcard-wait' : '';
    const cards = [];
    if (inCard) {
      if (pl.hasDice) cards.push(`<button class="ul-hcard ul-hcard-dice${waitCls}" onclick="window.__ulApp.chooseCard('DICE')">
        <span class="ul-hc-top">骰子行动牌</span><span class="ul-hc-bot">万能 · 可入航道</span></button>`);
      for (const c of pl.hand) {
        cards.push(`<button class="ul-hcard ul-hcard-${c===6?'six':''}${waitCls}" onclick="window.__ulApp.chooseCard(${c})">
          <span class="ul-hc-top">${c}</span><span class="ul-hc-bot">${c===6?'二选一 + 额外回合':'精准前进 '+c+' 格'}</span></button>`);
      }
    }

    // 额外回合 · 第 1 步：掷骰
    if (this.stationChoice && this.stationChoice.mode === 'extra') {
      cards.push(`<button class="ul-hcard ul-hcard-extra ul-hcard-wait" onclick="window.__ulApp.playerRollExtra()">
        <span class="ul-hc-top">掷骰</span><span class="ul-hc-bot">执行 6 点额外回合</span></button>`);
    }

    // 额外回合 · 第 2 步：掷出点数后，由玩家自己选动作（原来由 AI 代选，玩家看不到自己走了哪步）
    if (this.stationChoice && this.stationChoice.mode === 'extra-move') {
      const { pts } = this.stationChoice;
      this.stationChoice.opts.forEach((o, i) => {
        const top = o.kind === 'six-deploy' ? '出击' : (o.kind === 'six-advance' ? '前进6' : `${pts} 格`);
        cards.push(`<button class="ul-hcard ul-hcard-extra ul-hcard-wait" onclick="window.__ulApp.pickExtraMove(${i})">
          <span class="ul-hc-top">${top}</span><span class="ul-hc-bot">第 ${o.groupIndex + 1} 枚 · ${escapeXml(o.label)}</span></button>`);
      });
    }

    // 赏骰奖励轮 · 第 1 步：掷骰（流程第九步，本轮最后执行）
    if (this.stationChoice && this.stationChoice.mode === 'bonus') {
      cards.push(`<button class="ul-hcard ul-hcard-extra ul-hcard-wait" onclick="window.__ulApp.playerRollBonus()">
        <span class="ul-hc-top">掷骰</span><span class="ul-hc-bot">赏骰奖励轮</span></button>`);
    }

    // 赏骰奖励轮 · 第 2 步：选棋子（只动普通航道棋子，不触发 6 点特权）
    if (this.stationChoice && this.stationChoice.mode === 'bonus-move') {
      const { pts } = this.stationChoice;
      this.stationChoice.opts.forEach((o, i) => {
        cards.push(`<button class="ul-hcard ul-hcard-extra ul-hcard-wait" onclick="window.__ulApp.pickBonusMove(${i})">
          <span class="ul-hc-top">${pts} 格</span><span class="ul-hc-bot">第 ${o.groupIndex + 1} 枚 · ${escapeXml(o.label)}</span></button>`);
      });
    }

    // 【决斗 · 2026-10-09】真人暗扣出牌：双方同时出牌比点数，平手攻击方胜
    if (this.duelChoice) {
      const dc = this.duelChoice;
      const asTxt = dc.role === 'attacker' ? '你主动吃子（攻击方）' : `P${dc.foe} 来吃你的子（防守方）`;
      cards.push(`<div class="ul-hcard ul-hcard-duel" style="cursor:default;">
        <span class="ul-hc-top">决斗 · ${asTxt}</span>
        <span class="ul-hc-bot">暗扣一张牌，比点数：平手也算你赢（攻击方）/ 你须更大才赢（防守方）</span></div>`);
      for (const c of dc.options) {
        const isDice = c === DUEL_DICE;
        const top = isDice ? '骰子牌' : `${c} 点`;
        const bot = isDice ? '揭示时投骰 1–6，且不被消耗' : '打出后进入弃牌区';
        const arg = isDice ? `'${DUEL_DICE}'` : String(c);
        cards.push(`<button class="ul-hcard ul-hcard-wait" onclick="window.__ulApp.submitDuelCard(${arg})">
          <span class="ul-hc-top">${top}</span><span class="ul-hc-bot">${bot}</span></button>`);
      }
    }

    // 工位已选中时展示效果按钮
    if (this.stationChoice && this.stationChoice.mode === 'effect') {
      this.stationChoice.opts.forEach((o, i) => {
        cards.push(`<button class="ul-hcard ul-hcard-wait" onclick="window.__ulApp.pickStationEffect(${i})">
          <span class="ul-hc-top">${escapeXml(stationOptionTop(o))}</span><span class="ul-hc-bot">${escapeXml(o.label)}</span></button>`);
      });
    }

    // 【规则 1.3 补 · 免费出击】全员在基地时额外获得的救济动作。
    // 【为什么必须单独渲染而不是并入 6 点分支】
    //   6 点分支的判断是 `points === 6`，而免费出击在**任何点数**下都可能出现
    //   （点数是 1 时玩家照样可能全场在基地）。若复用6 点的按钮组，
    //   玩家在最需要这个救济的「点数很小」的局面下反而看不到它。
    //   另外它不消耗点数、不触发 6 点特权，按钮文案必须写清，避免与 6 点出击混淆。
    if (this.pendingActions && this.pendingActions.player === p
        && this.game.players[p].points !== 6) {
      this.pendingActions.acts.forEach((a, i) => {
        if (a.kind !== 'free-deploy') {
          cards.push(`<button class="ul-hcard ul-hcard-wait" onclick="window.__ulApp.pickMove(${i})">
            <span class="ul-hc-top">${this.game.players[p].points} 格</span><span class="ul-hc-bot">${escapeXml(a.label)}</span></button>`);
        } else {
          cards.push(`<button class="ul-hcard ul-hcard-extra ul-hcard-wait" onclick="window.__ulApp.pickMove(${i})">
            <span class="ul-hc-top">免费出击</span><span class="ul-hc-bot">全员在基地 · 不消耗点数</span></button>`);
        }
      });
    }

    // 【6 点二选一】「出击」对应的棋子在基地，棋盘上点不到 —— 必须给具名按钮，
    // 否则玩家只能选「前进 6」。出击按钮去重（多枚基地棋子等价）。
    let sixHasDeploy = false;
    if (this.pendingActions && this.pendingActions.player === p
        && this.game.players[p].points === 6) {
      let deployAdded = false;
      this.pendingActions.acts.forEach((a, i) => {
        if (a.kind === 'six-deploy') {
          sixHasDeploy = true;
          if (deployAdded) return;
          deployAdded = true;
          cards.push(`<button class="ul-hcard ul-hcard-dice ul-hcard-wait" onclick="window.__ulApp.pickMove(${i})">
            <span class="ul-hc-top">出击</span><span class="ul-hc-bot">基地 → 起点同色格</span></button>`);
        } else {
          cards.push(`<button class="ul-hcard ul-hcard-six ul-hcard-wait" onclick="window.__ulApp.pickMove(${i})">
            <span class="ul-hc-top">前进6</span><span class="ul-hc-bot">棋子${a.groupIndex + 1} 前进 6 格</span></button>`);
        }
      });
    }
    // 极速单子默认开局棋子已在场上 → 基地无待命棋子时本就无「出击」可选，
    // 明确说明原因，避免玩家以为是 bug（被吃回基地后此选项会自动出现）。
    const sixNote = (this.pendingActions && this.pendingActions.player === p
      && this.game.players[p].points === 6 && !sixHasDeploy)
      ? '（基地无待命棋子：6 点只能前进 6 格）' : '';

    // 抢工位的卡片已移到棋盘上方常驻工位栏（不遮挡棋盘格），此处不再重复渲染

    const hint = this.duelChoice
      ? `决斗！点下方按钮暗扣一张牌（${this.duelChoice.role === 'attacker' ? '你主动吃子，平手也算你赢' : '对方来吃你，你须点数更大才赢'}）`
      : inCard ? '请选择一张行动牌（暗选，全员同时亮牌）'
      : (this.stationChoice && this.stationChoice.mode === 'pick') ? '抢工位：点棋盘上方「工位队列」里的卡片'
      : (this.stationChoice && this.stationChoice.mode === 'effect') ? '点下方按钮选择工位效果'
      : (this.stationChoice && this.stationChoice.mode === 'extra') ? '点下方「掷骰」执行额外回合'
      : (this.stationChoice && this.stationChoice.mode === 'extra-move') ? `额外回合掷出 ${this.stationChoice.pts} 点：点棋盘上高亮跳动的棋子，或点下方按钮（第几枚已标注）`
      : (this.stationChoice && this.stationChoice.mode === 'bonus') ? '赏骰奖励轮：点下方「掷骰」'
      : (this.stationChoice && this.stationChoice.mode === 'bonus-move') ? `赏骰掷出 ${this.stationChoice.pts} 点：直接点棋盘上高亮跳动的棋子（或下方按钮，已标第几枚，只动普通航道）`
      : this.pendingActions ? `点棋盘棋子或用下方按钮选择移动${sixNote}`
      : this.phase === PH.ACT ? '请在棋盘上点击要移动的棋子'
      : '等待流程推进';

    this.el.handbar.innerHTML =
      `<div class="ul-handinfo" style="--c:${pcolor(p)}">
         <div class="ul-hi-name">P${p} ${pcn(p)} ${pc(p,'code')}</div>
         <div class="ul-hi-meta">手牌 ${pl.hand.map((c) => `<i>${c}</i>`).join('')} · 弃牌区 ${pl.discard.length} 张 · 已完成 ${pl.finished}</div>
         <div class="ul-hi-hint">${hint}</div>
       </div>
       <div class="ul-hcards">${cards.join('')}</div>`;
  }

  renderLog() {
    const line = (l) => {
      if (l.startsWith('—')) return `<div class="ul-log-turn">${l}</div>`;
      if (l.startsWith('★')) return `<div class="ul-log-win">${l}</div>`;
      // 按「P{n}」前缀给每行行动日志着上对应玩家色，便于区分各家动作
      const m = l.match(/^P(\d+)/);
      if (m) {
        const c = pcolor(parseInt(m[1], 10));
        return `<div class="ul-log-l" style="border-left:2px solid ${c}; padding-left:6px; color:${c}">${l}</div>`;
      }
      return `<div class="ul-log-l">${l}</div>`;
    };
    // 日志只放侧栏（用户明确要求：日志不要压在棋盘上）
    this.el.log.innerHTML = this.log.slice(-40).reverse().map(line).join('');
  }

  /** 供 HTML 内联 onclick 调用 */
  chooseCard(card) {
    const v = card === 'DICE' ? 'DICE' : parseInt(card, 10);
    this.playerChooseCard(v);
  }
  pickStation(i) {
    if (!this.stationChoice || this.stationChoice.mode !== 'pick') return;
    const p = this.stationChoice.player;
    this.stationChoice = null;
    this.runStation(p, i);
    // runStation 对「有可执行效果」的工位会重新进入 effect 模式等待选效果，
    // 此时不能提前推进队列，否则会跳过效果选择甚至提前终段。
    if (this.stationChoice && this.stationChoice.mode === 'effect') {
      this.render();
      return;   // 等效果选择回调再推进
    }
    this.flow.next();
    this.render();
    this.schedule(300);
  }
  pickStationEffect(i) {
    if (!this.stationChoice || this.stationChoice.mode !== 'effect') return;
    const { station, opts } = this.stationChoice;
    if (!opts[i]) return;
    this.playerChooseStationEffect(station, opts[i]);
  }
  /** 人类点击「移动选择」按钮（含 6 点二选一）—— 与点棋盘棋子走同一条路径 */
  pickMove(i) {
    if (!this.pendingActions) return;
    const { player, acts } = this.pendingActions;
    const act = acts[i];
    if (!act) return;
    this.pendingActions = null;
    this.applyChosenMove(player, act);
    // applyChosenMove 内部已对 6 点调用 endSixMove（标记额外回合 + 禁选工位）
    // 【决斗】与点棋盘棋子同一口径：决斗待决时挂起，不推进流程
    this.afterDuelable(() => {
      this.flow.next();
      this.render();
      this.schedule(300);
    });
  }
}

/**
 * 安全取玩家样式 —— 玩家下标在多个流程阶段都可能是 undefined 或越界
 * （对局结束、等待态、异常中断后重渲染）。
 * 早期版本直接写 pcolor(i)，一旦越界就抛 TypeError 并中断整个 render()，
 * 表现为「终局画面一片空白」。统一走这里即可根除这类故障。
 */
function pc(i, field) {
  return (Number.isInteger(i) && i >= 0 && i < PLAYERS.length) ? PLAYERS[i][field] : null;
}
/** 取玩家色，越界时回退到骨白 */
function pcolor(i) {
  return pc(i, 'color') || BONE;
}
/** 取玩家中文代号，越界时返回空串 */
function pcn(i) {
  return pc(i, 'cn') || '';
}

/** 工位效果按钮的短标题（按钮上方大字，下方仍显示完整说明） */
function stationOptionTop(o) {
  const t = String((o && o.label) || '');
  // 【规则 5.5】无敌：必须在「出击」之前判断 ——
  //   重复取牌时的 label 是「无敌延长（本已在免疫中）」，不含「出击」，
  //   但首次取牌 label 是「本回合与下回合免疫吃子」也不含。
  //   这里按 kind 判而不是按文案，避免将来改文案时静默退化成「执行」。
  if (o && o.kind === 'invincible') return '无敌';
  if (t.includes('出击')) return '出击';
  if (t.includes('绑定')) return '绑定';
  if (t.includes('取回') || t.includes('回收')) return '取回';
  if (t.includes('弃')) return '弃牌';
  if (t.includes('调整') || t.includes('调牌')) return '调牌';
  if (t.includes('前进') || t.includes('推进') || t.includes('突进')) return '前进';
  return '执行';
}

function stationKindText(st) {
  if (st.kind === 'move') {
    if (st.fixed) return `前进 ${st.fixed} 格`;
    return `前进 ${st.min}–${st.max} 格`;
  }
  if (st.kind === 'deployOrBind') return '出击 或 绑定';
  if (st.kind === 'tune') return `调整 ${st.count || 1} 张牌`;
  if (st.kind === 'discard') return `弃 ${st.count || 1} 张牌`;
  if (st.kind === 'retrieve') return `取回 ${st.count || 1} 张牌`;
  if (st.kind === 'bonusDice') return '专属骰子奖励轮';
  // 【规则 5.5】无敌：与卡面名称一致，且写明持续窗口，
  // 否则玩家会误以为是「永久无敌」而改变对敌方的进攻节奏。
  if (st.kind === 'invincible') return '免疫吃子（这回合 + 下回合）';
  return st.kind;
}


/* ==================== 启动 ==================== */
window.__ulApp = new App(document.getElementById('app'), {
  players: 4,
  // 默认经典 4 子：每人在基地有 3 枚待命棋子，6 点的「二选一」才有意义
  quick: false,
  human: [0],
  seed: 'web-' + Math.floor(Math.random() * 1e9),
});
window.__ulApp.setBoardSvg(BOARD_SVG);
window.__ulApp.render();
</script>
