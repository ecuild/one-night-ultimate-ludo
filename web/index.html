      s += pl.id === me ? best : -best;
    }
    return s;
  }

  /** 叶子评估 + 置换表查询 */
  leaf(me) {
    this.nodes++;
    if (this.nodes > this.nodeBudget) { this.aborted = true; return this.evalNow(me); }
    const key = positionKey(this.g, me);
    const cached = this.tt.get(key);
    if (cached !== undefined) return cached;
    // 终局局面不缓存：over/winner 不在 positionKey 里（它是全局的），
    // 但 evalState 会读它，故直接返回、不写入缓存，避免跨局污染。
    if (this.g.over) return this.evalNow(me);
    const v = this.evalNow(me);
    this.tt.set(key, v);
    return v;
  }

  evalNow(me) {
    if (this.leafEval === 'quick') return this.leafQuick(me);
    return evalState(this.g, me, null, this.evalOpts);
  }
}

/* ---------------------------------------------------------- 对手快速决策
 *
 * 搜索的 MIN 层需要「对手会选什么」。这里不能用真正的搜索（会指数爆炸），
 * 也不能用真AI（递归调用搜索 → 无限套娃）。
 * 故用一个**浅层启发式**：与旧AI 同口径的即时评分，但改用新的 worth()。
 *
 * 【重要】对手模型的质量决定了 MIN 层的可信度。
 * 若对手模型太弱，MIN 层会低估威胁 → AI 过于冒进；
 * 若太强，MIN 层会高估威胁 → AI 过于保守。
 * 取「与自身同口径的贪心」是最中性的选择。
 */
function opponentPickMove(g, pIdx, acts) {
  let best = acts[0];
  let bestScore = -Infinity;
  for (const a of acts) {
    const s = quickMoveScore(g, pIdx, a);
    if (s > bestScore) { bestScore = s; best = a; }
  }
  return best;
}

/** 浅层即时评分（与新 worth 同口径），供对手模型与走法排序使用 */function quickMoveScore(g, me, act) {
  const pl = g.players[me];
  if (!act.mv) {
    // 出场：规则 7.1 新增——若敌子蹲在自家起点同色格，出场即吃掉它；
    //   若蹲着的是无敌敌子，则我方被弹回基地（规则 5.5 新作用），属陷阱。
    const myCell = cellNo(me, 0);
    let dep = 60;
    let trap = false;
    for (const other of g.players) {
      if (other.id === me) continue;
      for (const og of other.groups) {
        if (og.pos < 0 || inHomeLane(og.pos)) continue;
        if (cellNo(other.id, og.pos) !== myCell) continue;
        if (isInvincible(other)) { trap = true; continue; }
        // 【决斗 · 2026-10-09】出场踩敌子同样要决斗：赢则吃掉，输则出场的那枚白回基地。
        //   用 duelExpectNet 精确计胜率 + 扣出牌成本，不再用悲观 0/1 兜底。
        dep += duelExpectNet(pl, other, worthOf(og.pos, og.size) * 1.4, 70);
      }
    }
    if (trap) dep -= 120;                 // 起点是无敌「刺」→ 出场即弹回，纯亏
    return dep;
  }
  const gr = pl.groups[act.groupIndex];
  let s = worthOf(act.mv.to, gr.size) - worthOf(gr.pos, gr.size);
  if (act.mv.jumped) s += 60;
  if (act.mv.enteredHome) s += 260;
  // 吃子收益（规则 5.3）/ 无敌弹回（规则 5.5）
  // 【决斗 · 2026-10-09】主动吃子不再是「稳吃」，而是双方暗扣对决：
  //   赢 → 敌子回家（收益）；输 → **自己**回基地（纯亏，且白走这一步）。
  //   duelExpectNet 已内嵌精确胜率（双方真实手牌）与出牌成本（数字牌面值），
  //   不会再出现「踩上去估值正、实则负」的系统性高估。
  if (act.mv.landedCell !== null && act.mv.landedCell !== undefined) {
    let bounceRisk = false;
    for (const other of g.players) {
      if (other.id === me) continue;
      for (const og of other.groups) {
        if (og.pos < 0 || inHomeLane(og.pos)) continue;
        if (cellNo(other.id, og.pos) !== act.mv.landedCell) continue;
        if (isInvincible(other)) { bounceRisk = true; continue; }   // 踩到无敌 → 我方弹回，不进入决斗
        // forgoesSix:true —— 攻击方把 6 拿去决斗即放弃出场/走 6，计入机会成本
        s += duelExpectNet(pl, other, worthOf(og.pos, og.size) * 1.4, worthOf(act.mv.to, gr.size) * 2.0, { forgoesSix: true });
      }
    }
    if (bounceRisk) s -= worthOf(act.mv.to, gr.size) * 2.0;         // 踩中无敌：落子被弹回基地，整步作废
  }
  // 暴露折价（期望口径）
  // 【性能】这里**不重建威胁表**：走法排序会对每个动作调用本函数，
  // 若每个动作都建一次 4×52 的表，排序开销会放大到 O(走法数 × 全盘扫描)。
  // 落点格号已知，直接问「有多少敌子够得着它」即可，代价是 O(敌子数 × 6)。
  if (act.mv.to !== FINISH && !inHomeLane(act.mv.to)
      && act.mv.landedCell !== null && act.mv.landedCell !== undefined) {
    const target = act.mv.landedCell;
    let chance = 0;
    for (const other of g.players) {
      if (other.id === me) continue;
      if (isInvincible(other)) continue;   // 无敌敌子踩到我方会自弹（规则 5.5 新作用），不构成威胁
      // 【决斗】敌方踩中我方也不再是稳吃 —— 我方作为防守方仍有存活机会，
      //   故「够得着」的概率要再乘以敌方的决斗胜率，才是真实被吃概率。
      const foeWin = duelExpectWin(other, pl);
      for (const og of other.groups) {
        if (og.pos < 0 || inHomeLane(og.pos)) continue;
        for (let step = 1; step <= 6; step++) {
          const raw = og.pos + step;
          if (raw > FINISH) break;
          let to = raw;
          if (isOwnCell(to)) to = Math.min(to + 4, FINISH);
          if (to === og.pos || inHomeLane(to)) continue;
          if (cellNo(other.id, to) === target) { chance += (1 - chance) / 6 * foeWin; break; }
        }
      }
    }
    if (chance > 0) s -= worthOf(act.mv.to, gr.size) * chance * 0.85;
  }
  return s;
}

/* --------------------------------------------------------------- 走法生成 */

/**
 * 我方移动阶段的走法枚举
 *
 * 【关键】必须用规则层接口（legalActions / extraTurnOptions / bonusOptions），
 * 绝不在搜索里自己实现移动逻辑。否则规则与搜索各行其是，
 * 搜出来的「最优走法」在真实对局里根本不可执行。
 */
function myMoves(g, me, phase, pts) {
  if (phase === 'extra') return g.extraTurnOptions(me, pts);
  if (phase === 'bonus') return g.bonusOptions(me, pts);
  return g.legalActions(me);
}

/**
 * 执行一个动作（三种阶段统一入口）
 *
 * 【bug 防护· 阶段必须显式传入 · 2026-10-13】
 * searchMove 同时服务三个调用点（移动阶段 / 额外回合 / 赏骰奖励轮），
 * 而三者的**点数来源与权限**都不同：
 *   · move  → g.doMove，点数=pl.points（本回合行动牌）
 *   · extra → g.commitExtraTurn，点数=pl.extraPoints（单独掷的骰）
 *   · bonus → g.commitBonus，点数=pl.bonusPoints（赏骰），且禁入航道
 * 旧实现把 phase 写死 'move'，于是额外回合/赏骰的选项被按「行动牌点数」试走：
 * 掷出 3 点却按 6 格评估、赏骰还拿到了不该有的入航道权限 ——
 * 这两类决策实际上退化成「用错误点数估一遍再按贪心选」。
 *
 * 【bug 防护· pts 必须显式传入】
 * 赏骰阶段的点数**不在动作对象上**（bonusOptions 返回的动作只有
 * groupIndex/mv/kind/label），而在调用方的 bonusPoints 上。
 * 若写成 `act.extraPoints ?? act.pts`，两者皆 undefined →
 * doMove 收到 pts=undefined → computeMove 的整数守卫会拒绝 → 动作静默失败。
 * 故点数由调用方显式传入；缺省时从玩家状态上取（runner/UI 都已由
 * rollExtra/rollBonus 写好，搜索直接读即可）。
 */
function applyAction(g, me, act, phase, pts) {
  if (phase === 'extra') return g.commitExtraTurn(me, act.groupIndex);
  if (phase === 'bonus') {
    const p = pts !== undefined ? pts : g.players[me].bonusPoints;
    return g.commitBonus(me, p, act.groupIndex);
  }
  return g.doMove(me, act.groupIndex);
}

/* ------------------------------------------ 决斗期望（CHANCE 节点）评估
 *
 * 【为什么需要这一层 · 2026-10-14】
 * doMove 触发决斗时默认自动结算（autoDuel:true），其中骰子牌揭示是一次
 * **随机采样**（rollDie(this.rand)）。搜索若直接采用这个采样值，
 * 同一走法的价值就取决于随机流当前恰好处在哪 —— 探针实测
 * （probe_duel_noise.mjs，30 局）：
 *   候选含决斗的决策点   不稳定率 17.9%（14336 个决策点）
 *   候选不含决斗的决策点 不稳定率  1.9%（37363 个决策点）
 * 采样偏差的量级是 ±1400 分（吃子收益 vs 被反杀），而普通走法的
 * 分差只有 100~300 —— 噪声足以淹没真实差异，且真实对局中
 * 26% 的移动决策点含决斗候选，绝非边角情形。
 *
 * 【正确结构】决斗结果不是任何一方的选择，是 CHANCE 节点：
 * 「攻击胜 / 攻击败」两支各完整评估一次，按 duelExpectWin 加权合成期望。
 * quickMoveScore 的吃子分支早已按精确期望建模（duelExpectNet，
 * 2026-10-09/10 裁定），评估层 threatTables 亦同源；
 * 搜索层此前是唯一的漏网之鱼 —— 这就是「搜索与贪心同档」的残余缺口。
 *
 * 【实现入口】game.js 的 duelForce 开关：强制本次决斗按指定方胜利结算，
 * 其余逻辑（暗扣牌选择、弃牌消耗、逐一决斗）完全走真实路径。
 */

/**
 * 预判「该动作执行后会不会触发决斗、跟哪些玩家决斗」
 *
 * 与 movement.resolveLanding 同口径（只预判、不执行）：
 *   · 移动类：落点绝对格上站着非无敌敌子 → 决斗；
 *   · 出场类（6 点出场 / 免费出击 / 工位出击）：落点是自家起点同色格；
 *   · 航道内 / 终点格 / 工位的非落子选项：不触发。
 *
 * @param {object} g 对局
 * @param {number} actor 行动方序号
 * @param {object} act 动作（移动阶段动作或工位选项，二者字段同构）
 * @returns {number[]} 防守方玩家序号列表（空 = 不触发决斗）
 */
function duelTargetsOf(g, actor, act) {
  let cell;
  if (act.mv) {
    // 航道内 / 终点格：规则免疫，不触发落点结算
    if (act.mv.landedCell === null || act.mv.landedCell === undefined) return [];
    cell = act.mv.landedCell;
  } else if (act.kind === 'free-deploy' || act.kind === 'six-deploy' || act.kind === 'deploy') {
    cell = cellNo(actor, 0);          // 出场类：落点是自家起点同色格
  } else {
    return [];                        // 工位的 bind/tune/discard/... 不落子，无决斗
  }
  const out = [];
  for (const other of g.players) {
    if (other.id === actor) continue;
    if (isInvincible(other)) continue;   // 无敌 → 踩者被弹回，不进决斗（与 resolveLanding 同）
    for (const og of other.groups) {
      if (og.pos < 0 || inHomeLane(og.pos)) continue;
      if (cellNo(other.id, og.pos) === cell) { out.push(other.id); break; }
    }
  }
  return out;
}

/**
 * 按「决斗期望」评估一个动作（不触发决斗时与直接执行等价）
 *
 * 【做法】触发决斗时：
 *   EV = p·v(攻击胜) + (1−p)·v(攻击败)，p = duelExpectWin(攻击方, 防守方)
 * 两支都完整执行 + 完整评估子树，再用 g.duelForce 固定胜负。
 *
 * 【为什么 p 用 duelExpectWin 而不是再采样】
 * duelExpectWin 基于双方**真实手牌**的 pickDuelCard 选择算解析胜率
 * （平手攻击方胜、骰子牌 1–6 均匀），与 resolveAllDuels 实际出牌同口径；
 * 且调用方（searchCard / opponentTurn）已先行消耗打出牌，
 * 手牌状态与结算时一致，p 是精确值而非估计。
 *
 * 【多场决斗的近似 · 有界误差】落点同时站着多名敌对玩家时会逐一决斗、
 * 输任意一场即中止。此处以第一场的胜率近似整组（赢→全场皆赢、输→第一场即
 * 回家）：单场决斗（绝大多数局面）为**精确值**；多敌同格属罕见情形，
 * 且两支的叶评估仍完整，误差仅来自聚合权重。
 *
 * @param {object} g 对局（函数返回后状态与进入时一致）
 * @param {number} actor 行动方序号（决斗的攻击方）
 * @param {object} act 动作（用于预判决斗；工位选项同构）
 * @param {function} applyFn 执行动作的闭包，返回 falsy = 执行失败
 * @param {function} evalAfter 执行后评估局面的闭包
 * @returns {number|null} 期望分值；两支都执行失败返回 null
 */
function applyEv(g, actor, act, applyFn, evalAfter) {
  const targets = DUEL_EV ? duelTargetsOf(g, actor, act) : [];
  if (!targets.length) {
    // 不触发决斗：与旧路径一致（单次执行 + 评估）
    const snap = snapshot(g);
    const r = applyFn();
    const v = r ? evalAfter() : null;
    restore(g, snap);
    return v;
  }
  const p = duelExpectWin(g.players[actor], g.players[targets[0]]);
  const snap = snapshot(g);
  let vWin = null;
  let vLose = null;
  g.duelForce = 'attacker';
  try {
    if (applyFn()) vWin = evalAfter();
  } finally {
    restore(g, snap);
  }
  g.duelForce = 'defender';
  try {
    if (applyFn()) vLose = evalAfter();
  } finally {
    restore(g, snap);
    g.duelForce = null;      // 必须清除：真实对局与 UI 恒不启用强制
  }
  if (vWin === null && vLose === null) return null;
  if (vWin === null) return vLose;
  if (vLose === null) return vWin;
  return p * vWin + (1 - p) * vLose;
}

/**
 * 写入「本回合打出这张牌」的状态
 *
 * 【为什么不消耗手牌 · 2026-10-14 实验结论】
 * 曾按「与真实对局同口径」加入 playCard 消耗（牌进弃牌区），
 * 竞技场实测（arena_layer.js，basic 档 40 seed）：
 *   不消耗：选牌层 53.8% · 加消耗：选牌层 41.3%（−12.5pp）
 * 全量对打（arena2，strong 档 60 seed）：54.2% → 34.2%（z=-3.47 显著恶化）。
 * 行为探针显示攻击数反而上升（决斗胜 16.15 vs 15.60），即退化不来自
 * 「变保守」，而来自选牌比较的口径失真 —— 最可能是消耗后
 * 「数字牌 +88（回收进度 106 − 手牌 18）vs 骰子牌 0」的系统性偏号，
 * 以及踩子牌的决斗胜率被己方刚打出的那张牌拉低后、选牌层
 * 对「能吃子的牌」的定价整体下移。两项都使选牌决策偏离最优。
 * 故维持旧口径（只写 playedCard/points），决斗胜率的偏差由
 * quickMoveScore 的 duelExpectNet 在走法层吸收。
 *
 * @param {object} pl 玩家状态
 * @param {number|string} card 'DICE' 或数字牌
 */
function setPlayedCard(pl, card) {
  pl.playedCard = card;
}

/* --------------------------------------------------------------- 核心搜索 */

/**
 * 下降一层：从我方决策过渡到「对手依次行动 → 我的局面」
 *
 * 【模型 · 2026-10-13 重做 —— 旧实现把搜索做成了「越深越弱」】
 * 旧实现有两个结构性错误，实测（arena2，经典 4 子，40 seed × 双向）：
 *   贪心 50% · d1 18.8% · d2 31.3% · d3 60% —— 深度增加并未单调变强，
 *   且 d1/d2 都**显著低于**贪心。分层隔离实验（arena_layer.js）进一步定位：
 *   病灶全在选牌层（23.8%），根因是 doMove 与 legalActions 的航道口径不一致
 *   （已修复）；此外对手层还有两个建模错误：
 *   ① **把骰子当对手**：opponentWorst 对 (点数 × 走法) 取 min，
 *      等于假设「对手总能掷出对他最有利的那个点数」。骰子是 CHANCE 节点，
 *      必须按 1/6 取**期望**。这个悲观假设随深度线性放大。
 *   ② **对手全体结盟专打我**：minAll 对 3 个对手逐个取最差，
 *      而本游戏对手之间不博弈、各打各的 —— 该假设把对手攻击性放大约 3 倍，
 *      AI 于是「宁可不出击也不冒被吃的风险」，在赛跑型规则里等于慢性自杀。
 *
 * 新模型（顺位链 + 骰子取期望 + 对手自利选走法）：
 *   · 对手按**顺位依次**行动（actor 队列），每人只动一次，
 *     后手看到前手行动后的局面 —— 这才是「本轮全员都会行动」的正确建模；
 *   · 骰子行动牌的点数按 1/6 等概率取**期望**（CHANCE）；
 *   · 数字牌点数确定（权重 1）；
 *   · 对手按**自利口径**选走法（quickMoveScore 最大，与贪心 AI 同口径）——
 *     他们确实想打压我，但只在「对自己也有利」时，不会为了坑我而自残。
 *
 * 【为什么没有 alpha-beta —— 这是与棋类引擎最重要的结构差异】
 * 国际象棋的 alpha-beta 成立前提是「搜索结果是一个可取反的确定值」。
 * 本引擎的对手层是 **CHANCE（骰子）→ 对手决策** 的复合节点，
 * 其返回值是「若干期望的聚合」，聚合结果无法在中途被剪掉：
 * 你必须遍历全部 6 个骰点才能知道期望，无法因为「前 3 个点已经够好了」
 * 就停止（它们可能都是坏点）。
 * 若强行套用 alpha-beta，结果是**静默的错误剪枝** ——
 * 搜索会漏掉「对手其实拿不到好牌」的分支，进而选出过于冒险的走法。
 * 故本模块只用置换表 + 走法排序 + 节点预算三类**安全**剪枝，不用 alpha-beta。
 *
 * 【深度语义 · 2026-10-13】depth = 「模拟几轮对手行动」：
 *   depth=1 → 不模拟对手（纯局面评估，等价于换评估函数的贪心）
 *   depth=2 → 全部对手各行动一次（看到「本轮结束后我处于什么位置」）
 *   depth=3 → 全部对手行动两轮
 * 旧实现的 depth 是「 Ply 层数」，一层只对一个对手取 MIN，口径与零和分
 * （对全部对手求和）不匹配；新口径按「轮」计，与 evalState 的分母一致。
 *
 * 【对手回合的简化 —— fast rollout】
 * 真实的一轮还包括：对手的工位竞抢 → 工位效果 → 额外回合 → 赏骰。
 * 若全部精确模拟，宽度会爆炸（手牌 6 张 × 骰子 6 点 × 工位 3 张 × 多个选项）。
 * 故只精确模拟**对手的选牌 + 移动阶段**（最直接伤害我的部分），
 * 工位与额外回合的效果通过「继续往下走一层评估」隐式计入。
 * 这是国际象棋里「静态搜索（quiescence）」的思想：
 * 在可能还有战术变化的深度上继续搜，而不是立刻用评估函数截断。
 *
 * @param {object} eng 引擎
 * @param {number} me 我方 id
 * @param {string} phase 当前阶段（move/extra/bonus，仅用于继续下传）
 * @param {number} pts 当前阶段的点数（仅用于继续下传）
 * @param {number} rounds 还要模拟几轮对手行动（0 = 立即评估）
 * @param {number[]} [actors] 尚未行动的对手队列；缺省 = 顺位上的全部对手
 */
function descend(eng, me, phase, pts, rounds, actors) {
  const g = eng.g;
  const queue = actors || nextActors(g, me);
  if (!queue.length || rounds <= 0) return eng.leaf(me);
  return opponentTurn(eng, me, queue[0], phase, pts, rounds, queue.slice(1));
}

/**
 * 顺位上的全部对手（尚未行动者队列的初始值）
 *
 * 【为什么必须返回全体而不是一个】4 人局里另外 3 个对手本轮同样会行动并推进，
 * 只看一个等于把「其他对手也在变强」从评估里抹掉。
 * 新模型（2026-10-13）让这些对手在 descend 的顺位链里**依次**行动，
 * 每人只动一次，后手看到前手行动后的局面。
 *
 * @returns {number[]} 对手 id 列表（已排除自己）
 */
function nextActors(g, me) {
  // 真实规则里顺位由点数决定（resolveOrder），但搜索内部不必完全复刻：
  // descend 的目的只是让搜索「看到对手的下一步」。
  // 用 g.order（起始玩家顺时针）作为「还有谁没动」的近似即可。
  const order = g.order;
  return order.filter((p) => p !== me);
}

/**
 * 单个对手的一整个行动：选牌 → 点数(CHANCE) → 走法(自利)
 *
 * 【与旧 opponentWorst 的本质差异 · 2026-10-13】
 * 旧实现对 (牌 × 点数 × 走法) 三维取 min，把骰子点数也当成对手的选择，
 * 等价于假设「对手总能掷出最坑我的点数」—— 这是把随机当对手的典型错误，
 * 也是「搜索越深越弱」的直接原因之一。
 *
 * 新实现按 expectimax 的正确结构分层：
 *   · **走法**：对手按自利口径选（quickMoveScore 最大）—— 与贪心 AI 同口径，
 *     不会出现「为了坑我而放弃自己推进」的自残走法；
 *   · **点数**：骰子行动牌按 1/6 等概率取**期望**；数字牌点数确定；
 *   · **选牌**：'self' 口径按自利选一张牌（quickCardPick，默认）；
 *     遗留口径枚举多张再聚合（昂贵，仅对照，见 MIN_SEMANTICS 注释）。
 * * @param {object} eng 引擎
 * @param {number} me 我方 id
 * @param {number} next 对手 id
 * @param {string} phase 当前阶段（仅用于继续下传）
 * @param {number} pts 当前阶段点数（仅用于继续下传）
 * @param {number} rounds 剩余模拟轮数
 * @param {number[]} rest 该对手行动后、尚未行动的其余对手
 * @returns {number} 该对手行动后 me 的局面分（期望口径）
 */
function opponentTurn(eng, me, next, phase, pts, rounds, rest) {
  const g = eng.g;
  const pl = g.players[next];

  // 对手的候选牌：手牌 + 骰子行动牌（与 ai.js chooseCard 的候选集同口径）
  const cards = [];
  if (pl.hasDice) cards.push('DICE');
  for (const c of pl.hand) cards.push(c);
  if (!cards.length) cards.push(3);        // 无牌可用：兜底（此时多半只能空过）

  /**
   * 选牌口径（见 MIN_SEMANTICS 注释）：
   *   'self'（默认）→ 对手按自利选一张牌（quickCardPick），只展开它的点数分支；
   *   遗留口径 → 枚举多张牌再聚合（昂贵，仅对照实验）。
   */
  const mode = MIN_SEMANTICS;
  let useCards;
  if (mode === 'self') {
    useCards = [quickCardPick(g, next, cards)];
  } else if (mode === 'single') {
    useCards = cards.slice(0, 1);
  } else {
    useCards = cards;                       // 'all'（minAll）/ 'avg'
  }

  let worst = Infinity;
  let avgSum = 0, avgN = 0;
  for (const card of useCards) {
    if (eng.aborted) break;
    const isDice = card === 'DICE';
    // CHANCE：骰子牌 6 个点数等概率；数字牌点数确定（权重 1）
    const variants = isDice
      ? [1, 2, 3, 4, 5, 6].map((d) => ({ pts: d, w: 1 / 6 }))
      : [{ pts: card, w: 1 }];

    let ev = 0;
    let wSum = 0;
    for (const v of variants) {
      if (eng.aborted) break;
      const snap = snapshot(g);

      // 【顺序铁则 · 2026-10-06】必须先写入牌与点数，再枚举走法。
      // legalActions() 读的是 pl.points 与 pl.playedCard：
      //   · 上一轮结束时 nextTurn() 把所有玩家的 points 清成 null
      //   · 对手尚未亮牌时 points 仍是 null → legalActions 直接返回 []
      //   · 若点数仍是上一轮的残值 → 走法集是「上轮那个点数」的，与本轮无关
      // 该顺序错误曾让整个 MIN 层被跳过（深度 2/3 等价于深度 1 且更差）。
      // 【为什么不消耗手牌】见 setPlayedCard 注释（2026-10-14 实验结论：
      // 消耗使选牌层 53.8%→41.3%，已回退）。
      setPlayedCard(pl, card);
      pl.points = v.pts;

      const acts = myMoves(g, next, 'move', v.pts);
      let val;
      if (acts.length) {
        // 对手按自利口径选走法：quickMoveScore 最大（纯函数，不改状态）
        let bestA = acts[0];
        let bestS = -Infinity;
        for (const a of acts) {
          const s = quickMoveScore(g, next, a);
          if (s > bestS) { bestS = s; bestA = a; }
        }
        eng.nodes++;
        // 【决斗期望 · 2026-10-14】对手的踩子走法同样按 CHANCE 节点评估：
        // 对手赢/输两支 × duelExpectWin 加权，不让单次采样决定对手行动的估值。
        val = applyEv(
          g, next, bestA,
          () => applyAction(g, next, bestA, 'move', v.pts),
          () => followUp(eng, me, phase, pts, rounds, rest),
        );
        // 执行失败（列得出却走不动，属规则层不自洽）→ 按空过处理，
        // 状态未变，后续 followUp 看到的就是「该对手这回合没动」的局面。
        if (val === null) val = followUp(eng, me, phase, pts, rounds, rest);
      } else {
        val = followUp(eng, me, phase, pts, rounds, rest);
      }
      restore(g, snap);
      ev += val * v.w;
      wSum += v.w;
    }

    const cardEv = wSum ? ev / wSum : eng.leaf(me);
    if (mode === 'avg') { avgSum += cardEv; avgN++; }
    else if (cardEv < worst) worst = cardEv;
  }

  if (mode === 'avg') return avgN ? avgSum / avgN : eng.leaf(me);
  return worst === Infinity ? eng.leaf(me) : worst;
}

/**
 * 对手行动之后的后续：本轮还有对手没动就继续顺位链，本轮耗尽才按剩余轮数
 * 开启新一轮（全部对手再次行动），轮数耗尽则评估叶子。
 *
 * 【bug 修复 · 2026-10-14】旧实现在 `rounds <= 1` 时直接返回叶子，
 * 于是 depth=2 只模拟了**顺位上第一个对手**的行动，另外两名对手完全冻结 ——
 * 与「depth = 模拟几轮对手行动」的文档语义和 evalState 的零和结构
 * （对全部对手求和）都不一致：叶子里有两家的进度停留在行动前。
 * 更糟的是被模拟的那一个按座位顺序取，与「谁真正能威胁到我」无关，
 * 等于系统性地建模了一个任意对手的响应。
 *
 * 修复后同轮内先走完顺位链（不消耗 depth），本轮全员行动完毕再开新一轮：
 *   depth=2 → 全部对手各行动一次（看到「本轮结束后我处于什么位置」）
 *   depth=3 → 全部对手行动两轮
 * 代价是同层节点数 ×对手数，故节点预算需同步上调（见 LEVELS）。
 */
function followUp(eng, me, phase, pts, rounds, rest) {
  // 本轮还有对手未行动 → 继续顺位链（同一轮内不消耗 depth）
  if (rest && rest.length) return descend(eng, me, phase, pts, rounds, rest);
  // 本轮全员行动完毕：轮数耗尽则评估叶子，否则开新一轮
  if (rounds <= 1) return eng.leaf(me);
  return descend(eng, me, phase, pts, rounds - 1, nextActors(eng.g, me));
}

/* --------------------------------------------------------------- 对外接口 */

/**
 * 搜索「移动阶段 / 额外回合 / 赏骰奖励轮」的最优走法
 *
 * 【phase 参数 · 2026-10-13】三个阶段的点数来源与权限不同
 * （见 applyAction 的注释），旧实现把 phase 写死 'move'，
 * 导致额外回合/赏骰的选项被按「行动牌点数」试走。调用方必须显式传入。
 *
 * @param {Game} g 真实对局（函数返回后其状态与调用前完全一致）
 * @param {number} me
 * @param {Array} acts 该阶段的合法动作（由规则层给出）
 * @param {object} opts {depth, nodes, deadline}
 * @param {string} [phase] 'move' | 'extra' | 'bonus'，缺省 'move'
 * @returns {{action: object, score: number, nodes: number, aborted: boolean}}
 */function searchMove(g, me, acts, opts, phase = 'move') {
  if (!acts || !acts.length) return { action: null, score: 0, nodes: 0, aborted: false };

  const level = opts || LEVELS.basic;
  if (!level.depth || !level.nodes) {
    // 未启用搜索：退化为浅层贪心（仍比旧 AI 的单步分更好，因为用的是新 worth）
    return { action: greedyPick(g, me, acts), score: 0, nodes: 0, aborted: false };
  }

  const eng = new Engine(g, {
    depth: level.depth,
    nodes: level.nodes,
    deadline: level.deadline || 0,
    leafEval: level.leafEval || 'state',
    evalOpts: level.evalOpts || null,
  });

  const snap = snapshot(g);
  const pts = phase === 'bonus' ? g.players[me].bonusPoints : g.players[me].points;
  let bestAct = null;
  let bestScore = -Infinity;
  /** 完整展开并参与比较的动作数（超预算时 < acts.length）。
   *  【为什么必须暴露】超预算后不得采用部分展开值，于是「被选中的动作
   *  必须落在这个前缀内」就是一条可断言的契约。缺了它，
   *  超预算污染只能靠胜率间接观察，回归测试写不出来。 */
  let evaluated = 0;

  /* 【基线相减 · 2026-10-14 实验档 passBase】
   * depth≥2 时先算一个反事实值：**我不走这步**，对手们从当前局面各自
   * 行动一轮后的叶值。候选动作的分值改为「实际值 − 基线」。
   *
   * 【为什么】probe_d2_delta 实测（25 局 1160 个多候选决策点）：
   *   我方项极差 199 · 对手响应项极差 114（= 0.57 倍我方项）
   *   d1 排序与 d2 排序的秩相关仅 0.717
   * 即 d2 相对 d1 多出来的那一项里，混着大量「对手本来就会推进」的
   * 准噪声 —— 它与我的走法质量无关，却足以在真实信号微弱时翻转排序。
   * 基线相减把「本来就会发生的推进」约掉，只留「对手对我这步的真实反应」。
   *
   * 【为什么基线对所有候选相同】基线在动作循环外算一次（同一决策点、
   * 同一 pts），候选间共享，故相减不改变「可比性」，只改变绝对量纲。
   *
   * 【失败兜底】基线自身超预算时当作没有基线（清 aborted 标志），
   * 不能让「反事实的开销」把真实候选全部判死。 */
  let base = 0;
  let hasBase = false;
  if (level.passBase && level.depth >= 2) {
    base = descend(eng, me, phase, pts, level.depth - 1);
    if (eng.aborted) { eng.aborted = false; base = 0; }
    else hasBase = true;
  }

  // 顶层不走 maxLayer（它需要 pts，而顶层要用传入的 acts），
  // 故在此手动遍历顶层动作，保证「列出的动作集合」与「被评估的动作集合」严格一致。
  const ordered = acts.slice().sort((a, b) => quickMoveScore(g, me, b) - quickMoveScore(g, me, a));
  try {
    for (const a of ordered) {
      restore(g, snap);
      eng.nodes++;
      // 【决斗期望 · 2026-10-14】踩子走法按 CHANCE 节点评估
      //（攻击胜/败两支 × duelExpectWin 加权），杜绝单次采样噪声。见 applyEv。
      const v = applyEv(
        g, me, a,
        () => applyAction(g, me, a, phase, pts),
        // depth=1 → 不模拟对手（纯局面评估）；depth≥2 → 模拟 depth-1 轮对手行动
        () => (level.depth <= 1 ? eng.leaf(me) : descend(eng, me, phase, pts, level.depth - 1)),
      );
      /* 【超预算即弃用 · 2026-10-14 —— 「搜索越深越差」的真正根因】
       * 旧实现在超预算后仍把该动作的**部分展开值**拿去比较。问题是
       * 期望值随模拟深度单调下降（模拟到的对手越多、我方分越低），
       * 于是一个只展开到深度 1 的动作会拿到虚高的分，把完整展开的动作挤掉。
       * 而「超预算点落在哪个动作上」由节点计数决定 —— 等价于**随机挑一个
       * 动作并给它加分**。这不是评估误差，是搜索框架的结构性缺陷。
       *
       * 实证对应（probe_budget.mjs + arena2 60 seed 双向）：
       *   max 档 41.7% 的移动搜索超预算   ↔ d3 胜率 41.7%（z=-1.83）
       *   strong 档 0.1% 超预算           ↔ d2 胜率 55%
       * 超预算率与胜率落差逐档对应，且 d3 显著差于 d1 —— 深度本身没错，
       * 错的是超预算动作的分值被纳入了比较。
       *
       * 修法：一旦超预算，当前动作的分值一律弃用并停止展开
       * （ordered 已按贪心序，未展开的都在其后）；只比较完整展开的动作。
       * 若连第一个动作都超预算，bestAct 保持 null → 退回 greedyPick，
       * 这是无偏的确定性兜底。 */
      if (eng.aborted) break;
      if (v === null) continue;
      // 基线相减：只保留「对手对我这步的真实反应」，约掉其本来就会发生的推进
      const dv = hasBase ? v - base : v;
      if (dv > bestScore) { bestScore = dv; bestAct = a; }
      evaluated++;
    }
  } finally {
    // 【韧性铁则 · 2026-10-13】搜索异常时必须还原对局状态。
    // 旧实现在函数末尾才 restore，一旦循环内抛错（如规则层某个边角返回异常值），
    // 真实对局将停留在「AI 假想走法」的状态上，且 ai.js 的 catch 会在
    // 被污染的状态上继续跑贪心兜底 → 决策全面失真且极难复现。
    restore(g, snap);
  }

  return {
    action: bestAct || greedyPick(g, me, acts),
    score: bestScore,
    nodes: eng.nodes,
    aborted: eng.aborted,
    evaluated,
  };
}

/** 退化路径：浅层贪心（保留旧 AI 的行为作为兜底，保证极端局面永不返回 null） */
function greedyPick(g, me, acts) {
  let best = acts[0];
  let bestScore = -Infinity;
  for (const a of acts) {
    const s = quickMoveScore(g, me, a);
    if (s > bestScore) { bestScore = s; best = a; }
  }
  return best;
}

/**
 * 搜索「选牌」：比较每个候选牌在期望下的收益
 *
 * 【与旧AI 的本质差异】旧AI 按「单步收益均值」选牌；
 * 本函数按「选这张牌 → 走完整个移动阶段 → 评估局面」选牌。
 * 于是「这张牌能推进但会让我被吃」与「这张牌推进少但局面更安全」
 * 会被正确区分 —— 单步分看不出这个区别。
 *
 * @param {Game} g
 * @param {number} me
 * @param {Array} cards 候选牌：'DICE' 或 1..6
 * @param {object} level
 */function searchCard(g, me, cards, level) {
  if (!cards.length) return { card: null, score: 0, nodes: 0 };
  if (!level || !level.depth || !level.nodes) {
    return { card: quickCardPick(g, me, cards), score: 0, nodes: 0 };
  }

  const eng = new Engine(g, {
    // 【选牌层独立深度 · 2026-10-14】cardDepth/cardNodes 缺省时与全层同参，
    // 老档位行为逐字节不变；仅在实验档（LEVELS.cardD2）生效。
    depth: level.cardDepth || level.depth,
    nodes: level.cardNodes || level.nodes,
    deadline: level.deadline || 0,
    leafEval: level.leafEval || 'state',
    evalOpts: level.evalOpts || null,
  });

  const snap = snapshot(g);
  const pl = g.players[me];

  let bestCard = null;
  let bestScore = -Infinity;
  let lastMoveScore = 0;
  /** 完整展开并参与比较的牌数（超预算时 < cards.length）。语义同 searchMove.evaluated */
  let evaluated = 0;

  /* 【候选牌按贪心优先级排序 · 2026-10-14】
   * 超预算即整牌弃用的纪律下，被丢弃的永远是「还没轮到的那几张」。
   * 若按调用方给的顺序（DICE 在前、手牌序在后）展开，超预算丢弃的
   * 就是一撮**任意牌** —— 实测 cardD2 档 41% 的选牌搜索超预算，
   * 等于四成决策在随机缩小比较集。改为按单牌自利分降序，
   * 未展开的都是贪心口径下最没希望的牌尾，与 searchMove 的 ordered 同思路：
   * 「先评最有希望的，预算花在刀刃上」。
   * cardPriority 是纯函数（内部改 playedCard/points 会还原），可安全预调用。 */
  const prio = new Map();
  for (const c of cards) prio.set(c, cardPriority(g, me, c));
  const cardOrder = cards.slice().sort((a, b) => prio.get(b) - prio.get(a));

  try {
  for (const card of cardOrder) {
    const isDice = card === 'DICE';
    // 骰子牌：按 1/6 枚举骰点求期望（CHANCE）
    // 数字牌：点数确定
    const variants = isDice ? [1, 2, 3, 4, 5, 6].map((d) => ({ pts: d, w: 1 / 6 })) : [{ pts: card, w: 1 }];

    let total = 0;
    let wSum = 0;
    let lastBonus = 0;
    /* 【超预算即整张牌弃用 · 2026-10-14】与 searchMove 同源的结构缺陷：
     * 超预算时 leaf() 返回的是「部分展开深度」的分值，而期望值随深度单调
     * 下降，故未展开完的牌会拿到虚高的期望分。选牌层的超预算率比移动层
     * 更高（probe_budget.mjs：strong 29.5% / max 73.4%），
     * 于是「随机挑一张牌加分」在选牌层是主要噪声源。
     * 修法：该牌任一变体超预算 → 整张牌的分值弃用，不参与比较。 */
    let cardAborted = false;
    for (const v of variants) {
      restore(g, snap);
      setPlayedCard(pl, card);
      pl.points = v.pts;

      const acts = g.legalActions(me);
      let cardScore;
      if (!acts.length) {
        // 无合法动作 → 这一手等于空过：**局面不变**。
        // 【量级铁律 · 2026-10-13 修复的评估级 BUG】这里必须用「不变局面的
        // 评估值」（eng.leaf），绝不能用固定 -300。cardScore 与其他牌同口径的
        // 量纲是**局面绝对值**：后局期对手已收子的局面可达 -25000，
        // 而 -300 是「单步收益」量纲的数。两者不可比 —— 固定 -300 会让
        // 「哑牌」在几乎所有真实局面下都排在能行动的牌前面（-820 > -24200），
        // AI 因此系统性打哑牌：该掷骰收官时偏去打 3，实测选牌层胜率仅 30%。
        // 探针实证（probe_finish_dice.mjs）：u=56 只差 1 格收官、仅骰子牌
        // 能进终点格，旧口径下 searchCard 选哑牌 3、quickCardPick 选 DICE。

        if (eng.aborted) { cardAborted = true; break; }
      } else {
        // 在该点数下取最优走法，再评估局面
        // 【选牌层独立深度 · 2026-10-14】cd 缺省 = level.depth（老档位行为不变）；
        // 实验档 cardD2 下选牌层单独看到「全员对手各行动一次」后的局面。
        const cd = level.cardDepth || level.depth;
        const ordered = acts.slice().sort((a, b) => quickMoveScore(g, me, b) - quickMoveScore(g, me, a));
        let bestAtPoint = -Infinity;
        for (const a of ordered) {
          restore(g, snap);
          setPlayedCard(pl, card);
          pl.points = v.pts;
          eng.nodes++;
          // 【决斗期望 · 2026-10-14】踩子走法按 CHANCE 节点评估，见 applyEv
          const sc = applyEv(
            g, me, a,
            () => g.doMove(me, a.groupIndex),
            () => (cd <= 1 ? eng.leaf(me) : descend(eng, me, 'move', v.pts, cd - 1)),
          );
          // 超预算 → 本走法的分值是部分展开的虚高分，弃用并停止本牌展开
          if (eng.aborted) { cardAborted = true; break; }
          if (sc === null) continue;
          if (sc > bestAtPoint) bestAtPoint = sc;
        }
        // 全部动作执行失败同样按「空过」计（量纲同上，不能用 -300）
        cardScore = bestAtPoint === -Infinity ? eng.leaf(me) : bestAtPoint;
        lastMoveScore = cardScore;
        if (cardAborted) break;
        if (eng.aborted) { cardAborted = true; break; }   // 兜底 leaf 也可能击穿预算
      }

      // 【6 点奖励必须条件兑现】规则 7.1 的额外回合与工位选取资格，
      //   只有在「真有动作」时才兑现；否则就是一张废牌。
      let bonus = 0;
      if (card === 6 && acts.length) bonus += 300;
      // 僵局规避：若这张牌打出后全场无子可动，重罚（旧 AI 已有此铁律，保留）。
      // 【量级说明】-520 ≈ 一轮对手推进的期望损失，与局面绝对值同量纲。
      if (card !== 'DICE' && acts.length === 0) bonus -= 520;
      lastBonus = bonus;

      total += (cardScore + bonus) * v.w;
      wSum += v.w;
      if (eng.aborted) break;
    }

    if (cardAborted) break;         // 后续牌同样无力完整展开，不必再算
    const s = wSum ? total / wSum : -Infinity;
    if (SEARCH_TRACE) {
      console.log(`[trace] card=${String(card).padEnd(5)} score=${s.toFixed(1).padStart(9)} bestMoveScore=${lastMoveScore.toFixed(1)} bonus=${lastBonus}`);
    }
    if (s > bestScore) { bestScore = s; bestCard = card; }
    evaluated++;
  }
  } finally {
    // 【韧性铁则 · 2026-10-13】异常路径也必须还原，理由同 searchMove
    restore(g, snap);
  }

  // order = 实际展开顺序（按贪心优先级降序）。超预算纪律的可断言契约：
  // 被选中的牌在 order 中的下标必须 < evaluated，否则就是采用了未展开完的分值。
  return {
    card: bestCard || quickCardPick(g, me, cards),
    score: bestScore,
    nodes: eng.nodes,
    aborted: eng.aborted,
    evaluated,
    order: cardOrder,
  };
}

/** 退化选牌：与旧AI 同口径的浅层启发式（搜索未启用或异常时的兜底） */
/** 对手「选牌」的自利模型（MIN 层用）—— 导出供探针对拍真实贪心口径 */function quickCardPick(g, me, cards) {
  let best = null;
  let bestScore = -Infinity;
  for (const card of cards) {
    const s = cardPriority(g, me, card);
    if (s > bestScore) { bestScore = s; best = card; }
  }
  return best;
}

/**
 * 单张牌的自利即时分（quickCardPick 的计分内核）
 *
 * 【为什么抽出来 · 2026-10-14】searchCard 需要按「贪心优先级」决定候选牌的
 * 展开顺序（超预算时丢弃牌尾），而复用整句 quickCardPick 只能拿到赢家、
 * 拿不到每张牌的分。抽出后两边同一口径，不会漂移。
 * 纯函数：内部改写的 playedCard/points 会还原。
 */
function cardPriority(g, me, card) {
  const pl = g.players[me];
  const isDice = card === 'DICE';
  const saveCard = pl.playedCard;
  const savePts = pl.points;
  pl.playedCard = card;
  const steps = isDice ? [1, 2, 3, 4, 5, 6] : [card];
  let s = 0;
  let anyAction = false;
  for (const st of steps) {
    pl.points = st;
    const acts = g.legalActions(me);
    let perStep = -Infinity;
    for (const a of acts) {
      const v = quickMoveScore(g, me, a);
      if (v > perStep) perStep = v;
    }
    if (perStep === -Infinity) perStep = 0;
    else anyAction = true;
    s += perStep;
  }
  pl.playedCard = saveCard;
  pl.points = savePts;
  s /= steps.length;
  if (card === 6 && anyAction) s += 300;
  return s;
}

/**
 * 搜索「工位选取」：比较取走每张工位后的局面价值
 *
 * 【与旧 AI 的本质差异】旧AI 用「mine + contention*0.5」的固定公式，
 * 其中 mine 是抽象常数（deploy 90 / bind 35 / tune 55...）。

  const n = queue.length;
  if (n <= 1) return { index: 0, score: 0 };
  if (!level || !level.depth || !level.nodes) {
    return { index: quickStationPick(g, me, queue), score: 0 };
  }

  const eng = new Engine(g, { depth: level.depth, nodes: level.nodes, deadline: level.deadline || 0, leafEval: level.leafEval || 'state', evalOpts: level.evalOpts || null });
  const snap = snapshot(g);
  let best = 0;
  let bestScore = -Infinity;

   * 原实现把各候选工位执行后的 evalState **绝对分**直接比大小。
   * 但绝对分 ≈ 基线分 + 该工位的收益，基线在所有候选间是同一个常数，
   * 比较绝对分在数学上等价于比较增量 —— 前提是 evalState 是线性的。
   *
   * 实测失败（probe_station_value.mjs，中局 4 家各 2 子在途、手牌满）：
   *   #7 赏骰 → −1975（收益 0，见下）    #5 弃牌 → −1399
   *   #1 前进 → −1707
   * 弃牌的绝对分**最高**，于是搜索每次都选弃牌。
   * 根因是 discard 的 leaf 确实上升了 —— 因为原实现给弃牌区每张牌
   * 一个正权重，而弃牌让「手牌张数」这条更强的项下降得更多，
   * 两者抵消后剩下的净值恰好为正。
   * 也就是说：**绝对分的大小并不代表「这张工位值不值得拿」**，
   * 因为工位是「三选一的稀缺资源」，真正的判据是
   * 「拿这张比拿那张多赚多少」—— 增量。
   *
   * 改为：以执行前的基准分为起点，比较各自的增量。
   * 这样基线被约掉，剩下的是纯粹的工位收益排序。
   */
  const baseScore = eng.leaf(me);

  try {
  for (let i = 0; i < n; i++) {
    restore(g, snap);
    eng.nodes++;
    const id = queue[i];
    const st = STATIONS.find((x) => x.id === id);
    if (!st) continue;

    // 执行工位效果：取最优选项并应用
    const opts = stationOptions(g, me, st);
    let localBest = -Infinity;
    const inner = snapshot(g);
    for (const o of opts) {
      restore(g, inner);
      eng.nodes++;
      // 【决斗期望 · 2026-10-14】移动/出场类工位同样可能踩子决斗（与 doMove 同规则）
      const sc = applyEv(
        g, me, o,
        () => applyStationAction(g, me, st, o),
        () => eng.leaf(me),
      );
      if (sc === null) continue;
      if (sc > localBest) localBest = sc;
      if (eng.aborted) break;
    }
    restore(g, inner);

    /* 相对基准的增量：空转（无选项）= 明确惩罚，
     * 否则会误选一张用不了的工位（规则允许空转，但必须排在最后）。*/
    let score = opts.length ? (localBest - baseScore) : -400;

    /* 【赏骰的价值必须显式补偿 · 2026-10-06 工位价值建模】
     * 赏骰工位（#7）的效果是「延后到本轮全员行动结束后再单独行动一次」，
     * 它的收益**不在当前局面上**，故 applyStationAction 之后
     * evalState 完全看不出变化 → leaf 分差恒为 0。
     * 于是 searchStationPick 会把三张候选工位里
     * 「唯一值 320 分的赏骰」排在「值 −12分的弃牌」之后 —— 反了。
     *
     * 【为什么不能靠 playerScore 解决】
     * playerScore 描述的是「此刻的局面价值」，而赏骰是**期权**：
     * 它的收益取决于后续骰点（可能吃子、可能推进、可能空转），
     * 是对未来的加权期望，不属于静态局面分。
     * 放在 playerScore 里会把「还没兑现的收益」算进当前分，
     * 污染所有其他评估项。故只能在「选哪张工位」这一层补偿。
     *
     * 【补偿量】W_AI 侧的 bonusDiceValue=320，由 probe_bonus.mjs 标定：
     * 中后段单次移动 worth 增量 222 × 每轮期望行动次数 1.17 ≈ 260，
     * 乘 1.23 覆盖「多一次吃子/脱离威胁的机会」。*/
    if (st.kind === 'bonusDice' && opts.length) score += bonusDiceValue();

    if (score > bestScore) { bestScore = score; best = i; }
    if (eng.aborted) break;
  }
  } finally {
    // 【韧性铁则 · 2026-10-13】异常路径也必须还原，理由同 searchMove
    restore(g, snap);
  }
  return { index: best, score: bestScore };
}

/** 退化工位选取：沿用「我方价值 + 对手争抢强度」的旧口径 */
function quickStationPick(g, me, queue) {
  const others = g.players.filter((p) => p.id !== me);
  let best = 0;
  let bestScore = -Infinity;
  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    const st = STATIONS.find((x) => x.id === id);
    if (!st) continue;
    const opts = stationOptions(g, me, st);
    let mine = 0;
    for (const o of opts) {
      const v = quickStationOptionScore(g, me, o);
      if (v > mine) mine = v;
    }
    let contention = 0;
    for (const op of others) {
      for (const o of stationOptions(g, op.id, st)) {
        const v = quickStationOptionScore(g, op.id, o);
        if (v > contention) contention = v;
      }
    }
    const s = mine + Math.min(contention, 90) * 0.5;
    if (s > bestScore) { bestScore = s; best = i; }
  }
  return best;
}

/** 工位选项的浅层估值（旧口径，供 quickStationPick 与退化路径使用） */
function quickStationOptionScore(g, me, opt) {
  switch (opt.kind) {
    case 'move':
      return quickMoveScore(g, me, { groupIndex: opt.groupIndex, mv: opt.mv });
    case 'deploy': return 90;
    case 'bind': return 35;
    case 'tune': {
      const has = g.players[me].hand.includes(opt.to);
      return has ? -30 : 55;
    }
    case 'discard': return 20;
    case 'retrieve': return 50;
    case 'bonusDice': return 120;
    // 【规则 5.5 · 无敌】与 evaluate.playerScore 的 3b 项同口径：
    // 免疫不改变任何棋子的位置，故 quick 层若返回常数 0，
    // 三张候选里有无敌时会被当成 worthless 直接跳过。
    case 'invincible': return quickInvincibleScore(g, me);
    default: return 0;
  }
}

/**
 * 无敌工位的浅层估值（quick 路径）
 *
 * 与 evaluate.js 的 3b 项保持同一形状：抵消场上棋子的期望被吃损失，
 * 但按 quick 层的粗口径估，不逐格查威胁表。
 */
function quickInvincibleScore(g, me) {
  const pl = g.players[me];
  let exposed = 0;
  for (const gr of pl.groups) {
    if (gr.pos < 0 || inHomeLane(gr.pos)) continue;
    exposed += worthOf(gr.pos, gr.size);
  }
  if (exposed <= 0) return 20;
  return Math.min(900, exposed * 0.9);
}

/**
 * 搜索「工位效果选项」

  if (!opts || !opts.length) return { option: null, score: 0 };
  if (!level || !level.depth || !level.nodes) {
    return { option: quickStationOptionPick(g, me, opts), score: 0 };
  }
  const eng = new Engine(g, { depth: level.depth, nodes: level.nodes, deadline: level.deadline || 0, leafEval: level.leafEval || 'state', evalOpts: level.evalOpts || null });
  const snap = snapshot(g);
  let best = null;
  let bestScore = -Infinity;
  try {
  for (const o of opts) {
    restore(g, snap);
    eng.nodes++;
    // 【决斗期望 · 2026-10-14】移动/出场类工位同样可能踩子决斗（与 doMove 同规则）
    const v = applyEv(
      g, me, o,
      () => applyStationAction(g, me, station, o),
      () => eng.leaf(me),
    );
    if (v === null) continue;
    if (v > bestScore) { bestScore = v; best = o; }
    if (eng.aborted) break;
  }
  } finally {
    // 【韧性铁则 · 2026-10-13】异常路径也必须还原，理由同 searchMove
    restore(g, snap);
  }
  return { option: best || opts[0], score: bestScore };
}

function quickStationOptionPick(g, me, opts) {
  let best = opts[0];
  let bestScore = -Infinity;
  for (const o of opts) {
    const s = quickStationOptionScore(g, me, o);
    if (s > bestScore) { bestScore = s; best = o; }
  }
  return best;
}

/**
 * AI 决策 —— Expectimax 搜索驱动（国际象棋引擎管线）
 *
 * 【本轮重构：从贪心到搜索】
 * 旧版是「贪心 + 单步博弈」：给每个动作打一个即时分，选最高的。
 * 这类评估有三个结构性缺陷：
 *   ① **只看这一步**：把棋子从u=45 走到 u=51 的单步分很高，
 *      但走完之后这枚子停在敌子射程内、另三枚还在基地 —— 单步分完全看不见。
 *   ② **零和性缺失**：旧scoreGain 是绝对收益（「我赚 300 分」），
 *      但飞行棋是零和的，赢的条件是「我全部收官」而非「我分高」。
 *   ③ **无对手建模**：完全不设想「对手下一步会怎么打我」。
 * 新版把决策交给 search.js 的 expectimax：
 *   MAX（我的选择）→ CHANCE（骰子点数取期望）→ MIN（对手选对我最不利的一步）→ 局面评估
 *
 * 【为什么保留 chooseCard / chooseMove / chooseStationIndex / chooseStationOption 四个签名】
 * app.js 与全部测试都依赖这四个导出。改签名会波及整个 UI 与测试层，
 * 而本次改动的本质是「内部决策方式变强」，与对外接口无关。
 * 保持签名不变 = minimum-diff，且未来回退只需切一个开关。
 *
 * 【确定性铁律 —— 全项目硬约束】
 * 同seed 同局面必得同决策。搜索本身是确定性的（节点数预算而非时间预算），
 * 随机只来自规则层的种子化骰子。
 *
 * 【降级设计 —— 搜索永不成为故障点】
 * 搜索的任何异常都必须退回旧贪心，绝不让 AI 因为搜索出错而崩掉整局游戏。
 * 每个入口都有 try/catch + 贪心兜底。这是 AI 作为「对手」的底线要求：
 * AI 变笨可以接受，AI 崩溃不可接受。
 */
/** 工位 id → 定义 */
const STATION_BY_ID = new Map(STATIONS.map((s) => [s.id, s]));

/* ------------------------------------------------------------------ 搜索档位
 * 默认档位。basic 是深度 1（评估走完后的局面），
 * 已经强于旧版的单步贪心；strong 是深度 2（额外看到对手的下一步）。
 *
 * 【为什么默认 basic而不是 strong】UI 每次决策都要同步返回，
 * strong 在经典 4 子局的后期可能有几十个走法，实测耗时需标定（见 bench_search.mjs）。
 * 档位可通过 setAiLevel 切换，供 UI 设置项与对照实验使用。

/** 切换搜索档位（UI 设置项 / 对照实验用） */function setAiLevel(name) {

/** 取当前档位 */function getAiLevel() {

 *
 * 实测（arena2经典 4 子，120 seed × 双向）：

 * passBase）全部未能超过贪心，已逐个记录在 search.js 的 LEVELS 注释里。
 *
 * 因此出厂配置改为「选牌 + 工位走搜索，移动层走贪心」——搜索只在它
 * 确实占优的层上生效。消融实验同时证明威胁敞口与集群惩罚是有效项
 * （去掉分别 −4.3 / −9.0），评估函数的风险建模本身没有问题，
 * 问题在移动层的**排序口径**与贪心增量分的差异，留待后续定位。
 */
const layerSwitch = { card: true, move: false, stationPick: true, stationOption: true };

/** 设置分层开关（对照实验用）。返回当前开关状态 */function setLayerSwitch(partial) {
  for (const k of Object.keys(partial)) {
    if (k in layerSwitch) layerSwitch[k] = !!partial[k];
  }
  return { ...layerSwitch };
}

/** 取当前分层开关 */function getLayerSwitch() {
  return { ...layerSwitch };
}

/** 该层是否启用搜索 */function layerEnabled(name) {
  return !!layerSwitch[name];
}

/* ------------------------------------------------------------------ 权重
 * 以下为**搜索未启用时**的贪心兜底路径所用，量级与 evaluate.js 的 worth 保持一致。
 *
 * 【量级基准】吃一枚 u=30 处的普通子 ≈ worth(30) ≈ 400 分。
 */
const W_AI = {
  finish: 1200,      // 抵达终点格：压倒一切（由 worth(FINISH) 承载，此处仅作文档锚点）
  enterHome: 260,    // 进入终点航道（免疫吃子）—— 与 evaluate.js 的 homeBase 同量级
  jump: 60,          // 吃到跳跃红利（+4 格）—— 与 evaluate.js 的 jumpBonus 对齐
  capture: 1.4,      // 吃子收益系数（乘以被吃编队的实际价值）
  earlyPenalty: 20,  // u<8 起点段的暴露折价
  ownCellBonus: 0,   // 【已移除】worth 里不再有 ownCell 加成（会造成单调性台阶）

  // 博弈层
  risk: 0.85,        // 风险厌恶系数（乘在期望损失上），与 evaluate.js 同值
  contestBonus: 0.35,
  contestMax: 120,

  // 节奏层
  card6: 300,        // 6 点自带额外回合 + 工位选取资格（仅在真有动作时兑现）
  stuck: -520,       // 空转重罚
};

/**
 * 单枚编队在 u 处的综合价值：位置价值 × 编队规模
 * 吃子时按此计费 —— 两枚绑一起的编队被吃，损失是两倍。
 *
 * 【worth 直接用 evaluate.js 的实现，不要在此转发 · 2026-10-06】
 * 此前这里有个 `function worth(u,size){ return _worth(u,size); }` 的转发 wrapper，
 * 意图是「强调与 evaluate.js 单一真相源」。但它造成了两处实质伤害：
 *   1. 打包器把各模块压平到同一顶层作用域后，`ai.js` 的 function worth
 *      与 `evaluate.js` 的 function worth **同名**；
 *      打包器的重名检测当时只扫 `export` 声明，漏掉了这个非导出的本地函数，
 *      于是产物里出现两个 `function worth`。
 *   2. 更致命的是 `import { worth as _worth }` 被还原成 `const _worth = worth;`，
 *      而 `function` 声明会被提升到作用域顶部 —— 该语句执行时 `worth`
 *      已经指向 wrapper 自己，于是 `_worth` 绑定到 wrapper，
 *      wrapper 再调 `_worth` → **无限递归 → Maximum call stack size exceeded**。
 * 该缺陷只在浏览器/sandbox 里炸（ESM 有模块作用域隔离，纯 Node 跑不出来），
 * 是靠 probe_ui_flow.mjs 驱动真实产物才暴露的。
 * 直接 import 使用，不加转发层。
 */
function groupValue(u, size) {
  return worth(u, size);
}

/**
 * 贪心层：这一步的直接收益 —— **仅在搜索未启用/异常时使用**
 *
 * @param {object} g Game
 * @param {number} me 玩家序号
 * @param {object} act {groupIndex, mv} 或 {kind:'deploy', groupIndex}
 */
function scoreGain(g, me, act) {
  const pl = g.players[me];

  // 出场：本身不推进，但多一枚可动的子，且立刻处于起点危险区
  if (!act.mv) return 70 - W_AI.earlyPenalty;

  const gr = pl.groups[act.groupIndex];
  const mv = act.mv;

  let s = worth(mv.to, gr.size) - worth(gr.pos, gr.size);
  if (mv.jumped) s += W_AI.jump;                       // 跳跃红利，worth 里没有
  if (mv.enteredHome) s += W_AI.enterHome;             // 进入免疫区的战术价值

  // 吃子收益：按被吃编队的实际价值算，而非固定分。
  // 【格号换算是必需的】mv.landedCell 是 52 格共享航道上的**格号**，
  // 而 og.pos 是「该玩家视角的 u」。两者语义不同，必须经 cellNo(other.id, og.pos)
  // 换算才能比较 —— 直接拿 og.pos 比会永不命中，使吃子收益恒为 0。
  if (mv.landedCell !== null && mv.landedCell !== undefined) {
    for (const other of g.players) {
      if (other.id === me) continue;
      for (const og of other.groups) {
        if (og.pos < 0 || inHomeLane(og.pos)) continue;      // 基地与航道内不可被吃
        if (cellNo(other.id, og.pos) !== mv.landedCell) continue;
        s += groupValue(og.pos, og.size) * W_AI.capture;
      }
    }
  }
  return s;
}

/** 敌方威胁场（贪心兜底路径专用；搜索路径用 evaluate.js 的 threatTables） */
function buildThreatMap(g, me) {
  return threatTables(g).get(me);
}

/**
 * 该落点是否「我方下轮也想要」—— 用于抢格博弈（贪心兜底路径）
 *
 * 【与 evaluate.js 的 isContested 必须重名隔离 · 2026-10-06】
 * 本函数与 evaluate.js 的 isContested 逻辑几乎相同，唯一区别是
 * 多一道 `myValue < 400` 门槛（贪心层只对高价值落点做对冲，评估层全量考虑）。
 * 打包器把各模块压平到同一顶层作用域后，同名函数后者覆盖前者，
 * 会让 evaluate.js 的 threatTables 静默地用上贪心口径 —— 无任何报错。
 * 故改名区分，不要合并（两者口径本就不同）。
 */
function isContestedGreedy(g, me, targetU, myValue) {
  if (myValue < 400) return false;
  const pl = g.players[me];
  for (const gr of pl.groups) {
    if (gr.pos < 0 || inHomeLane(gr.pos)) continue;
    for (let step = 1; step <= 6; step++) {
      const raw = gr.pos + step;
      if (raw > FINISH) break;
      let to = raw;
      // 跳跃必须与 board.js 的 isOwnCell 同口径，否则此处算出的
      // 「我方下轮想要的格子」与规则层的实际落点不一致，对冲项会指向错误的格子。
      if (isOwnCell(to)) to = Math.min(to + 4, FINISH);
      if (to !== targetU || inHomeLane(to)) continue;
      if (worth(gr.pos) >= 300) return true;
    }
  }
  return false;
}

/**
 * 博弈层：这一步的净风险敞口（期望值口径）—— 贪心兜底路径
 * 负数表示这笔账不划算 —— 推进/吃子的收益抵不过被吃的预期损失。
 */
function scoreThreat(g, me, act, threatMap) {
  const mv = act.mv;
  if (!mv) return 0;
  if (mv.to === FINISH) return 0;
  if (inHomeLane(mv.to)) return 0;
  if (mv.landedCell === null || mv.landedCell === undefined) return 0;

  const chance = threatMap[mv.landedCell];
  if (chance <= 0) return 0;

  const gr = g.players[me].groups[act.groupIndex];
  const mine = groupValue(mv.to, gr.size);

  let s = -mine * chance * W_AI.risk;
  if (isContestedGreedy(g, me, mv.to, mine)) {
    s += Math.min(mine * W_AI.contestBonus, W_AI.contestMax) * chance;
  }
  return s;
}

/** 贪心评估一个候选动作（fallback 用） */
function greedyEvaluate(g, me, act, threatMap) {
  return scoreGain(g, me, act) + scoreThreat(g, me, act, threatMap);
}

/**
 * 节奏层：打出这张牌后，本轮是否等于空转
 *
 * u=48 是每位玩家的末同色格，落上去必然触发 +4 跳到 52（进入终点航道）。
 * 若只按「步数越大越好」选牌，会反复选 4 打到 u=48 → 跳到 52，
 * 而 52 只能靠精准点数推进 → 形成永久往复。
 */
function isStuckAfter(g, me, card) {
  if (card === 'DICE') return false;
  const pl = g.players[me];
  for (const gr of pl.groups) {
    if (gr.pos < 0 || gr.pos >= FINISH) continue;
    const raw = gr.pos + card;
    if (raw > FINISH) continue;
    let to = raw;
    // 跳跃判定必须用 board.js 的 isOwnCell（u%4==0，含 u=48），
    // 硬编码 %4 在 u=48 之外的边界上曾漏判 —— 实测导致 AI 反复选 4 打到 u=48
    if (!inHomeLane(gr.pos) && isOwnCell(to)) to = Math.min(to + 4, FINISH);
    if (to !== gr.pos) return false;
  }
  return !pl.groups.every((gr) => gr.pos < 0 || gr.pos >= FINISH || inHomeLane(gr.pos));
}

/** 贪心选牌（搜索未启用/异常时的兜底） */
function greedyChooseCard(g, me) {
  const pl = g.players[me];
  const opts = [];
  // 【字段名必须与 Game 一致：hasDice】
  // 曾误写成 state.js 遗留的 hasDiceCard —— 该字段在 Game 的玩家对象上根本不存在（恒 undefined），
  // 于是骰子行动牌从未进入候选集，AI 全程只会打数字牌；
  // 手牌被工位「弃牌」清空时 opts 为空 → 返回 null → Game.chooseCard 抛「手牌中没有 null」。
  if (pl.hasDice) opts.push('DICE');
  for (const c of pl.hand) opts.push(c);
  if (!opts.length) return pl.hasDice ? 'DICE' : null;

  const threatMap = buildThreatMap(g, me);
  let best = null;
  let bestScore = -Infinity;

  for (const card of opts) {
    const isDice = card === 'DICE';
    let s = 0;
    const saveCard = pl.playedCard;
    const savePts = pl.points;
    pl.playedCard = card;
    const steps = isDice ? [1, 2, 3, 4, 5, 6] : [card];
    let anyAction = false;
    for (const st of steps) {
      pl.points = st;
      const acts = g.legalActions(me);
      let perStep = -Infinity;
      for (const a of acts) {
        const v = greedyEvaluate(g, me, a, threatMap);
        if (v > perStep) perStep = v;
      }
      if (perStep === -Infinity) perStep = 0;
      else anyAction = true;
      s += perStep;
    }
    pl.playedCard = saveCard;
    pl.points = savePts;
    s /= steps.length;

    // 【6 点奖励必须条件兑现】规则 7.1 的额外回合与工位选取资格
    //   只有在「真有动作」时才兑现；否则就是一张废牌。
    if (card === 6) s += anyAction ? W_AI.card6 : 0;
    if (!isDice && isStuckAfter(g, me, card)) s += W_AI.stuck;

    if (s > bestScore) { bestScore = s; best = card; }
  }
  return best;
}

/**
 * 选择行动牌
 *
 * 【主路径】搜索：评估「选这张牌 → 走完整个移动阶段 → 局面价值」。
 *   旧版评估的是「选这张牌 → 这一步的即时收益均值」，看不到后续后果。
 * 【兜底】搜索异常时退回 greedyChooseCard。
 */function chooseCard(g, me) {
  const pl = g.players[me];
  const candidates = [];
  if (pl.hasDice) candidates.push('DICE');
  for (const c of pl.hand) candidates.push(c);
  if (!candidates.length) return pl.hasDice ? 'DICE' : null;

  try {
    // 【分层开关】关掉该层时传 LEVELS.none，各入口自会走各自的贪心兜底路径
    const r = searchCard(g, me, candidates, layerEnabled('card') ? currentLevel : NONE);
    if (r.card !== null && r.card !== undefined) return r.card;
  } catch (e) {
    // 【降级底线】搜索出错绝不能影响对局 —— 退回贪心
    console.warn('[ai] searchCard 异常，退回贪心：', e.message);
  }
  return greedyChooseCard(g, me);
}

/**
 * 在合法动作中选一个（移动阶段 / 额外回合 / 赏骰奖励轮）
 *
 * 【phase 必须显式传入 · 2026-10-13】三个阶段共用本入口，但点数来源不同：
 *   · 'move'  本回合行动牌点数（pl.points）
 *   · 'extra' 额外回合单独掷出的骰点（pl.extraPoints，commitExtraTurn 内部取）
 *   · 'bonus' 赏骰奖励轮骰点（pl.bonusPoints，commitBonus 内部取）
 * 旧实现不传 phase，搜索把额外回合/赏骰的选项按「行动牌点数」试走，
 * 这两类决策因此退化。缺省 'move' 保持旧调用方（测试）行为不变。
 *
 * 【确定性】同局面必返回同一个动作 —— 搜索用节点数预算而非时间预算，
 * 保证展开量与局面一一对应。原先的 rng 噪声已彻底移除。
 *
 * 【降级】搜索异常或无动作时退回贪心，保证绝不返回 null 导致回合卡死。
 */function chooseMove(g, me, acts, phase = 'move') {
  if (!acts || !acts.length) return null;

  try {
    const r = searchMove(g, me, acts, layerEnabled('move') ? currentLevel : NONE, phase);
    if (r.action) return r.action;
  } catch (e) {
    console.warn('[ai] searchMove 异常，退回贪心：', e.message);
  }

  const threatMap = buildThreatMap(g, me);
  let best = acts[0];
  let bestScore = -Infinity;
  for (const a of acts) {
    const s = greedyEvaluate(g, me, a, threatMap);
    if (s > bestScore) { bestScore = s; best = a; }
  }
  return best;
}

/** 工位效果决策的贪心估值（fallback 用） */
function scoreStationOption(g, me, opt, threatMap) {
  switch (opt.kind) {
    case 'move':
      return greedyEvaluate(g, me, { groupIndex: opt.groupIndex, mv: opt.mv }, threatMap);
    case 'deploy':
      return 90 - W_AI.earlyPenalty;
    case 'bind':
      return 35;
    case 'tune': {
      const has = g.players[me].hand.includes(opt.to);
      return has ? -30 : 55;
    }
    case 'discard':
      return 20;
    case 'retrieve':
      return 50;
    case 'bonusDice':
      return 120;
    case 'invincible':
      // 【规则 5.5】无敌 = 免疫吃子。防御价值随「我方场上棋子总价值」增长，
      // 但必须做**机会成本扣减**：无敌只挡吃子，不挡推进、不挡收官。
      // 若给一个不随局面变化的常数，就会出现「快收官时还去拿无敌」的荒谬选择，
      // 故按场上暴露价值估算，并减去「本可以拿到的进攻收益」。
      return invincibleValue(g, me);
    default:
      return 0;
  }
}

/**
 * 无敌工位的贪心估值（fallback 路径）
 *
 * 【为什么不能是常数】
 * 无敌挡的是「我方场上棋子被击退回基地」的损失。
 *快到收官时这个损失极大（已收 2 枚时，任何一次被吃都可能致命），
 * 开局时几乎无意义（场上只有 1 枚，价值很低）。
 * 故按「我方场上棋子的暴露总价值」×系数 估，并做边际递减（防溢出）。
 */
function invincibleValue(g, me) {
  const pl = g.players[me];
  let exposed = 0;
  for (const gr of pl.groups) {
    if (gr.pos < 0 || inHomeLane(gr.pos)) continue;   // 基地与航道内本就不怕吃
    exposed += worth(gr.pos, gr.size);
  }
  if (exposed <= 0) return 20;      // 场上没子可护，收益极低但不为 0（仍有防未来落子）
  // 系数 0.9：吃子威胁的实际概率是 1/6 量级，免疫等于把这份敞口归零
  return Math.min(900, exposed * 0.9);
}

/**
 * 工位效果决策：对所有合法选项估值，取最优
 *
 * 【主路径】搜索：模拟「执行这个选项后的局面价值」，用同一量纲比较。
 *   旧版用固定常数表（deploy 90 / bonusDice 120），
 *   会出现「为了拿 110 分的赏骰而放弃 1300 分的收官」这类荒谬选择。
 */function chooseStationOption(g, me, station, opts) {
  if (!opts || !opts.length) return null;
  try {
    const r = searchStationOption(g, me, station, opts,
      layerEnabled('stationOption') ? currentLevel : NONE);
    if (r.option) return r.option;
  } catch (e) {
    console.warn('[ai] searchStationOption 异常，退回贪心：', e.message);
  }
  const threatMap = buildThreatMap(g, me);
  let best = opts[0];
  let bestScore = -Infinity;
  for (const o of opts) {
    const s = scoreStationOption(g, me, o, threatMap);
    if (s > bestScore) { bestScore = s; best = o; }
  }
  return best;
}

/** 对某张工位的所有合法选项估值（供挑选队列用） */
function stationBestValue(g, me, stationId) {
  const st = STATION_BY_ID.get(stationId);
  if (!st) return 0;
  const opts = stationOptions(g, me, st);
  const threatMap = buildThreatMap(g, me);
  let best = -Infinity;
  for (const o of opts) {
    const s = scoreStationOption(g, me, o, threatMap);
    if (s > best) best = s;
  }
  return best === -Infinity ? 0 : best;
}

/**
 * 挑选工位队列中的哪一张
 *
 * 【主路径】搜索：模拟「拿走这张工位并执行其最优效果」后的局面价值。
 * 【博弈点】工位是明牌竞抢的（只有 3 张，前 3 名优先选），
 *   故贪心兜底路径仍保留「这张工位对敌方的价值」这一项 ——
 *   一张对手也很需要的工位，被我拿走本身就是收益。
 */function chooseStationIndex(g, me, queue) {
  const n = queue.length;
  if (n <= 1) return 0;

  try {
    const r = searchStationPick(g, me, queue,
      layerEnabled('stationPick') ? currentLevel : NONE);
    if (typeof r.index === 'number' && r.index >= 0 && r.index < n) return r.index;
  } catch (e) {
    console.warn('[ai] searchStationPick 异常，退回贪心：', e.message);
  }

  const others = g.players.filter((p) => p.id !== me);
  let best = 0;
  let bestScore = -Infinity;
  for (let i = 0; i < n; i++) {
    const id = queue[i];
    const mine = stationBestValue(g, me, id);
    let contention = 0;
    for (const op of others) contention = Math.max(contention, stationBestValue(g, op.id, id));
    const s = mine + Math.min(contention, 90) * 0.5;
    if (s > bestScore) { bestScore = s; best = i; }
  }
  return best;
}

 *
 * 颜色取自 theme.py（70 年代科幻极简调色板）
 */
const VOID = '#141110';
const INK = '#1F1A16';
const PANEL = '#271F19';

];

/** 十六进制颜色混合，t=0 取 c1 */
function mix(c1, c2, t) {
  const p = (c) => {
    const s = c.replace('#', '');
    return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
  };
  const a = p(c1);
  const b = p(c2);
  const to = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0').toUpperCase();
  return '#' + to(a[0] + (b[0] - a[0]) * t) + to(a[1] + (b[1] - a[1]) * t) + to(a[2] + (b[2] - a[2]) * t);
}

/**
 * 生成一枚飞行器棋子的 SVG 片段
 * 在 [-1.1,1.1] 归一化空间绘制再缩放，故从棋盘上的 ~12px 到放大预览都保持锐利
 *
 * @param {number} cx 中心 x
 * @param {number} cy 中心 y
 * @param {string} color 玩家色
 * @param {number} kind 0=火箭 1=飞碟 2=穿梭机 3=环绕探测器
 * @param {number} r 缩放半径
 * @param {object} opt
 * @param {boolean} opt.ghost 半透明（基地待命）
 * @param {number} opt.rot 额外旋转（度）
 * @returns {string} SVG 片段
 */
function vehicle(cx, cy, color, kind, r = 16, opt = {}) {
  const ghost = opt.ghost ? 0.3 : 1;
  const rot = opt.rot || 0;
  const line = mix(color, VOID, 0.55);
  const hi = mix(color, BONE, 0.42);
  const lo = mix(color, VOID, 0.32);
  const o = [];
  o.push(`<g transform="translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(${rot}) scale(${r})" opacity="${ghost}">`);
  o.push(`<g stroke="${line}" stroke-width="0.05" stroke-linejoin="round" stroke-linecap="round">`);

  if (kind === 0) {           // ROCKET 竖直火箭
    o.push(`<polygon points="0,0.55 -0.18,0.96 0.18,0.96" fill="${GOLD}"/>`);
    o.push(`<polygon points="0,-1.00 -0.30,-0.45 0.30,-0.45" fill="${hi}"/>`);
    o.push(`<rect x="-0.30" y="-0.45" width="0.60" height="1.00" rx="0.26" fill="${color}"/>`);
    o.push(`<polygon points="-0.30,0.00 -0.56,0.62 -0.30,0.55" fill="${lo}"/>`);
    o.push(`<polygon points="0.30,0.00 0.56,0.62 0.30,0.55" fill="${lo}"/>`);
    o.push(`<circle cx="0" cy="-0.05" r="0.16" fill="${BONE}" stroke="none"/>`);
  } else if (kind === 1) {    // SAUCER 飞碟
    o.push(`<ellipse cx="0" cy="0.10" rx="0.96" ry="0.34" fill="${lo}"/>`);
    o.push(`<path d="M -0.44,0.06 A 0.44 0.44 0 0 1 0.44,0.06 Z" fill="${hi}"/>`);
    for (const lx of [-0.52, -0.18, 0.18, 0.52]) {
      o.push(`<circle cx="${lx}" cy="0.26" r="0.07" fill="${BONE}" stroke="none"/>`);
    }
  } else if (kind === 2) {    // SHUTTLE 三角翼穿梭机
    o.push(`<polygon points="0.18,0.52 0.18,0.84 0.42,0.52" fill="${hi}"/>`);
    o.push(`<polygon points="-0.18,0.52 -0.18,0.84 -0.42,0.52" fill="${hi}"/>`);
    o.push(`<polygon points="0,-0.95 0.90,0.52 0.18,0.52 0,0.10 -0.18,0.52 -0.90,0.52" fill="${color}"/>`);
    o.push(`<circle cx="0" cy="-0.30" r="0.15" fill="${BONE}" stroke="none"/>`);
  } else {                     // ORBITER 环形探测器
    o.push(`<ellipse cx="0" cy="0" rx="1.00" ry="0.36" fill="none" stroke="${hi}" stroke-width="0.14" transform="rotate(-18)"/>`);
    o.push(`<line x1="0" y1="-0.40" x2="0" y2="-0.88" stroke="${line}" stroke-width="0.08"/>`);
    o.push(`<circle cx="0" cy="-0.88" r="0.07" fill="${BONE}" stroke="none"/>`);
    o.push(`<circle cx="0" cy="0" r="0.42" fill="${color}"/>`);
  }
  o.push('</g></g>');
  return o.join('');
}

/** 棋子底座光圈 */
function pedestal(cx, cy, r, color) {
  return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${mix(color, VOID, 0.82)}"/>`
    + `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 0.92).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.55"/>`
    + `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 0.74).toFixed(1)}" fill="none" stroke="${color}" stroke-width="0.6" opacity="0.30" stroke-dasharray="3 4"/>`;
}

/**
 * 一枚完整的可交互棋子（底座 + 飞行器 + 可选高亮环）
 * @param {object} o
 * @param {number} o.cx, o.cy, o.r
 * @param {number} o.player 玩家 id（决定颜色与形态）
 * @param {number} o.size 编队规模（1 或 2，size=2 时叠一个副影表示绑定）
 * @param {string} o.state 'normal'|'active'|'ghost'|'dim'
 * @param {number} o.rot 朝向（度）
 */
function pieceToken({ cx, cy, r = 15, player, size = 1, state = 'normal', rot = 0 }) {
  const color = PLAYERS[player].color;
  let o = [];
  o.push(pedestal(cx, cy, r * 1.35, color));
  if (size === 2) {
    // 绑定编队：后方叠一枚压暗的副影
    o.push(vehicle(cx, cy, mix(color, VOID, 0.45), player, r * 0.8, { rot: rot + 18, ghost: true }));
  }
  o.push(vehicle(cx, cy, color, player, r, { rot, ghost: state === 'ghost' }));
  if (state === 'active') {
    o.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 2.0).toFixed(1)}" fill="none" stroke="${BONE}" stroke-width="1.6" opacity="0.9"/>`);
    o.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 2.5).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1" opacity="0.5"/>`);
  } else if (state === 'dim') {
    o.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r * 1.9).toFixed(1)}" fill="${VOID}" opacity="0.45"/>`);
  }
  return o.join('');
}

/**
 * 生成一颗立体骰子的 SVG（等距立方体 + 面上点数）
 * 阶段一修过绿色骰子的几何（点数曾跳出面外），此处沿用同一约束：
 * 每个点数必须落在所属面的投影多边形内
 *
 * @param {number} size 骰子边长（像素）
 * @param {number} pips 1..6
 * @param {string} color 面色，默认 AVOCADO
 */
function die3d(size = 46, pips = 1, color = AVOCADO) {
  const s = size;
  const h = s / 2;
  // 等距立方体三个面的顶点（顶面菱形 + 左右立面）
  const top = [[0, -h * 0.62], [h, -h * 0.16], [0, h * 0.30], [-h, -h * 0.16]];
  const left = [[-h, -h * 0.16], [0, h * 0.30], [0, h], [-h, h * 0.54]];
  const right = [[0, h * 0.30], [h, -h * 0.16], [h, h * 0.54], [0, h]];
  const pts = (a) => a.map((q) => q.map((v) => v.toFixed(1)).join(',')).join(' ');
  const o = [`<g>`];
  o.push(`<polygon points="${pts(top)}" fill="${mix(color, BONE, 0.30)}" stroke="${VOID}" stroke-width="1"/>`);
  o.push(`<polygon points="${pts(left)}" fill="${mix(color, VOID, 0.22)}" stroke="${VOID}" stroke-width="1"/>`);
  o.push(`<polygon points="${pts(right)}" fill="${mix(color, VOID, 0.05)}" stroke="${VOID}" stroke-width="1"/>`);

  // 顶面点数：3x3 网格按点数取点，全部落在菱形内（内缩 45% 保证不出面）
  const layout = {
    1: [[0, 0]],
    2: [[-0.42, -0.26], [0.42, 0.26]],
    3: [[-0.42, -0.26], [0, 0], [0.42, 0.26]],
    4: [[-0.42, -0.26], [0.42, -0.26], [-0.42, 0.26], [0.42, 0.26]],
    5: [[-0.42, -0.26], [0.42, -0.26], [0, 0], [-0.42, 0.26], [0.42, 0.26]],
    6: [[-0.42, -0.34], [0.42, -0.34], [-0.42, 0], [0.42, 0], [-0.42, 0.34], [0.42, 0.34]],
  };
  const r = h * 0.13;
  for (const [gx, gy] of (layout[pips] || layout[1])) {
    // 菱形 → 直角坐标映射
    const x = gx * h * 0.9;
    const y = gy * h * 0.9 + gx * h * 0.16;
    o.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${VOID}" opacity="0.85"/>`);
  }
  o.push('</g>');
  return o.join('');
}

/* ==================== ui/board_view.js ==================== */
/**
 * 棋盘渲染 —— T8
 *
 * 【为什么静态与动态分离】
 * 静态棋盘（52 格航道、终点航道、基地、中央指令盘、图例、规则角板）由 Python 的
 * board.py 生成，是 1400×1400 的纯矢量稿，直接内联为 <img> 或 inline SVG；
 * 动态棋子由 JS 按规则层状态实时绘制。
 * 两者共用同一坐标系（viewBox 0 0 1400 1400），故棋子必然精确落在格心上。
 * 若改为 JS 重画静态棋盘，会引入与印刷稿不一致的风险，收益为零。
 *
 * 【棋子层职责】只读状态 → 输出 SVG，不改状态。动画用 CSS transition 完成，
 * 跳跃/吃子/进航道/抵达终点各有独立 class，靠 CSS keyframes 表现。
 */



/**
 * viewBox 与几何模块保持一致。
 * 【注意】不要在此重复声明 `const VB = 1400` —— geom.js 已导出同名常量，
 * 打包成单文件时两者会压平到同一作用域并触发重复声明。
 */

/**
 * 列出全部在局棋子，附带渲染所需的附加信息
 * @param {object} game Game 实例
 * @returns {Array} [{key, player, groupIndex, size, pos, zone, finished}]
 */
function listPieces(game) {
  const out = [];
  for (const pl of game.players) {
    let baseSlot = 0;
    let jitterOnCell = new Map();
    pl.groups.forEach((gr, gi) => {
      if (gr.pos < 0) {
        // 基地待命：按出现顺序占槽位，双层交错避免重叠
        const ring = baseSlot >= 3 ? 1 : 0;
        out.push({
          key: `p${pl.id}g${gi}`, player: pl.id, groupIndex: gi,
          size: gr.size, pos: -1, zone: 'base', finished: false,
          slot: baseSlot % 3, ring,
        });
        baseSlot++;
        return;
      }
      if (gr.pos >= FINISH) return;   // 已抵达终点的棋子不在 groups 中（Bug A 修复后不会出现在此）
      // 同格多子做微偏移：先统计该格已有几枚
      const ck = gr.pos;
      const j = jitterOnCell.get(ck) || 0;
      jitterOnCell.set(ck, j + 1);
      out.push({
        key: `p${pl.id}g${gi}`, player: pl.id, groupIndex: gi,
        size: gr.size, pos: gr.pos,
        zone: inHomeLane(gr.pos) ? 'lane' : 'track', finished: false,
        jitter: j,
      });
    });
  }
  return out;
}

/**
 * 渲染棋子层 SVG 字符串
 * @param {object} game
 * @param {object} opt
 * @param {Array} opt.activeKeys 处于可操作状态的棋子 key（高亮）
 * @param {string} opt.hintKey  悬停/最后移动的棋子 key
 * @param {Array} opt.targetKeys 合法的落点棋子 key（画脉冲标记）
 * @param {Array} opt.fromPos    记录 {key:{x,y}} 用于计算位移起点（做滑行动画）
 */
/**
 * 棋子绘制半径（viewBox 单位）
 *
 * 【为什么是 21而不是 15】主航道格带宽度只有 68（452..520），棋子按15 画时
 * 在 1080p 屏幕上只有约 12px，四种飞行器的形态（火箭/飞碟/穿梭机/环绕探测器）
 * 完全分不清。实测 21 时棋子约占格带 31%，既能看清形态又不遮挡格号，
 * 同格两枚叠加的微偏移（±13）也不会溢出到相邻格。
 */
const PIECE_R = 21;
function renderPieces(game, opt = {}) {
  const active = new Set(opt.activeKeys || []);
  const targets = new Set(opt.targetKeys || []);
  const o = [`<g id="piece-layer">`];

  for (const p of listPieces(game)) {
    const { x, y } = pieceXY(p.player, p.pos, { slot: p.slot, ring: p.ring, jitter: p.jitter });
    const state = active.has(p.key) ? 'active' : (opt.dimOthers ? 'dim' : 'normal');

    // 合法落点：在棋子外圈画脉冲环，提示可点
    if (targets.has(p.key)) {
      o.push(`<g class="pt-target"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(PIECE_R * 2.0).toFixed(1)}" fill="none" stroke="${PLAYERS[p.player].color}" stroke-width="2" opacity="0.85"/></g>`);
    }
    o.push(`<g class="pt ${active.has(p.key) ? 'pt-active' : ''}" data-key="${p.key}" data-player="${p.player}" data-gi="${p.groupIndex}">`);
    // 朝向：主航道棋子沿切线方向旋转，视觉上体现「前进方向」
    o.push(pieceToken({ cx: x, cy: y, r: PIECE_R, player: p.player, size: p.size, state, rot: tangentRot(p.player, p.pos) }));
    o.push('</g>');
  }
  o.push('</g>');
  return o.join('');
}

/** 棋子朝向：主航道沿顺时针切线，航道内朝圆心，终点格不转 */
function tangentRot(player, pos) {
  if (inHomeLane(pos)) return 180;
  const cell = (STARTS[player] + pos) % 52;
  // 切线方向角 = 半径角 + 90°
  return (-90 + cell * STEP + 90) % 360;
}

/**
 * 预判这一步能否吃子（只读，不改状态）
 * 判据与movement.applyMove 的吃子逻辑严格一致：
 *   落点必须在主航道（航道内免疫），且格号与敌方编队所在格号相同
 */
function willCapture(game, me, mv) {
  if (!mv || mv.landedCell === null || mv.landedCell === undefined) return false;
  for (const other of game.players) {
    if (other.id === me) continue;
    for (const og of other.groups) {
      if (og.pos < 0 || inHomeLane(og.pos)) continue;
      if (cellNo(other.id, og.pos) === mv.landedCell) return true;
    }
  }
  return false;
}

/**
 * 渲染「移动高亮」层：把当前玩家所有可移动棋子标出来，
 * 并在每个合法落点旁画一个半透明幽灵棋子作为落点预览
 */
function renderTargets(game, pIdx, actions) {
  if (!actions || !actions.length) return '';
  const pl = game.players[pIdx];
  const o = [`<g id="target-layer">`];
  const seen = new Set();
  for (const a of actions) {
    const gr = pl.groups[a.groupIndex];
    if (!gr) continue;
    // 【基地出场】动作的 mv 为 null（棋子还在基地，没有「起点→终点」的位移），
    // 但玩家仍需要在棋盘上看到「它会落到哪」——统一画成起点格的虚影并标「出」，
    // 否则只剩一枚被高亮的基地棋子，位移结果全靠猜。
    if (a.mv === null) {
      if (seen.has(`deploy:${a.groupIndex}`)) continue;
      seen.add(`deploy:${a.groupIndex}`);
      const d = pieceXY(pIdx, 0, {});
      o.push(`<g class="pt-ghost" opacity="0.55">`);
      o.push(`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="23" fill="${mix(PLAYERS[pIdx].color, VOID, 0.55)}" stroke="${PLAYERS[pIdx].color}" stroke-width="1.6" stroke-dasharray="4 3"/>`);
      o.push(`<text x="${d.x.toFixed(1)}" cy="${(d.y + 4).toFixed(1)}" font-size="12" fill="${BONE}" text-anchor="middle" opacity="0.95">出</text>`);
      o.push('</g>');
      continue;
    }
    // 落点预览：同一落点只画一次
    const key = `${a.mv.to}:${gr.size}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const jitter = 0;
    const { x, y } = pieceXY(pIdx, a.mv.to, { jitter });
    o.push(`<g class="pt-ghost" opacity="0.55">`);
    o.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="23" fill="${mix(PLAYERS[pIdx].color, VOID, 0.55)}" stroke="${PLAYERS[pIdx].color}" stroke-width="1.6" stroke-dasharray="4 3"/>`);
    if (a.mv.jumped) {
      o.push(`<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" font-size="12" fill="${BONE}" text-anchor="middle" opacity="0.95">跳</text>`);
    } else if (willCapture(game, pIdx, a.mv)) {
      // 落点有敌子：额外画一个「吃」标记，让玩家一眼看出这一步的收益
      o.push(`<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" font-size="13" fill="#E2571F" text-anchor="middle" opacity="0.95" font-weight="700">吃</text>`);
    }
    o.push('</g>');
  }
  o.push('</g>');
  return o.join('');
}

/**
 * 生成「落点高亮」覆盖层：用于玩家把棋子拖到某格时提示是否合法
 * 现阶段交互用「点击棋子」而非拖拽，故此函数预留给后续拖拽实现
 */
function renderDropHint(pIdx, u, valid) {
  const { x, y } = pieceXY(pIdx, u, {});
  const c = valid ? BONE : '#B0402C';
  return `<g id="drop-hint"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26" fill="none" stroke="${c}" stroke-width="2.4" stroke-dasharray="5 4"/></g>`;
}

/**
 * 渲染中央指令盘的状态区（覆盖在静态棋盘之上，显示当前轮次/阶段）
 * @param {object} game
 * @param {string} phaseText 阶段文案
 * @param {number|null} turnPlayer 当前行动者；可能为 null（等待态）或越界（对局已结束）
 */
function renderCenterStatus(game, phaseText, turnPlayer) {
  // 【Bug 修复 · 阶段二】对局结束后 currentActor() 可能返回 undefined 或越界下标，
  //   直接取 PLAYERS[turnPlayer].color 会抛 TypeError 并中断整个 render，
  //   导致终局画面（赢家、棋盘终态）完全渲染不出来。
  //   故此处对玩家下标做双重校验：必须是 0..PLAYERS.length-1 的整数。
  const valid = Number.isInteger(turnPlayer) && turnPlayer >= 0 && turnPlayer < PLAYERS.length;
  const color = valid ? PLAYERS[turnPlayer].color : BONE;
  const who = valid ? `P${turnPlayer} ${PLAYERS[turnPlayer].cn}` : '';
  return `<g id="center-status">`
    + `<rect x="545" y="952" width="310" height="62" rx="8" fill="${VOID}" opacity="0.85" stroke="${color}" stroke-width="1.2"/>`
    + `<text x="700" y="978" font-size="17" fill="${color}" text-anchor="middle" font-weight="700" letter-spacing="2">${escapeXml(phaseText)}</text>`
    + `<text x="700" y="998" font-size="11" fill="${BONE}" text-anchor="middle" opacity="0.75" letter-spacing="1.5">${who}${who ? '　·　' : ''}ROUND ${game.turn + 1}</text>`
    + `</g>`;
}

/** 各玩家棋子进度摘要（供侧栏显示） */
function playerSummary(game, pIdx) {
  const pl = game.players[pIdx];
  const total = game.quick ? 1 : 4;
  const lane = pl.groups.filter((g) => g.pos >= 52 && g.pos < FINISH).length;
  const base = pl.groups.filter((g) => g.pos < 0).length;
  const track = pl.groups.filter((g) => g.pos >= 0 && g.pos < 52).length;
  return {
    total, finished: pl.finished, lane, base, track,
    hand: pl.hand.slice(), discard: pl.discard.length, hasDice: pl.hasDice,
    // 【规则 5.5】免疫剩余轮数，供 UI 打出「无敌」徽标。
    // 【为什么要显式透出而不是让 app.js 直接读 pl】
    //   本函数是玩家面板的唯一数据出口，UI 侧不应直接读状态字段 ——
    //   否则字段一改就要同时改渲染层，容易漏（与 station.js「不直接改 UI」同源约束）。
    invincible: pl.invincible || 0,
  };
}
function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/** 供外部核对渲染坐标：某玩家 u=0 应对应其起点格 */


/* ==================== ui/app.js ==================== */
/**
 * 对局界面 —— T9
 *
 * 【回合流程状态机】
 *   CARD   暗牌选行动：每名玩家依次选牌（AI 自动，人工点击）
 *   ACT依次执行步骤，每名玩家<b>连续完成自己的全部动作</b>（见下）
 *   BONUS  赏骰奖励轮（全员行动结束、起始玩家轮转之后才执行）
 *
 * 【ACT 阶段的编排口径 —— 逐玩家连续行动】
 *   亮牌定顺位后，按顺位依次消费 core/flow.js 的步骤序列：
 *     P_k: 移动 → （若掷 6）额外回合（可连锁）→ （若有资格）挑选并执行工位
 *   完成后才轮到 P_{k+1}。
 *   全员走完 → 工位队列滚动刷新 → 轮转起始玩家 → 执行赏骰奖励轮。
 *
 * 【为什么不是「全员移动完再统一取工位」—— 2026-10-06 流程改造】
 * 规则书第三章原文「按顺位依次移动棋子 → 按顺位挑选并执行工位效果」写的是两阶段，
 * 与 8.3#7「本轮<b>全员行动结束</b>后执行赏骰奖励轮」里的「全员行动结束」自相矛盾：
 * 若移动与工位是两个全队批量阶段，赏骰的延后基准应是「移动与工位阶段结束后」。
 * 真正自洽的口径是「每名玩家连续完成自己的全部动作」，本模块据此改造。
 * 具体影响：
 *   1. 工位改为在该玩家移动之后<b>立刻</b>执行，此前要空等到全队移动完；
 *   2. 工位的推进/吃子效果会在后续玩家行动<b>之前</b>生效——
 *      旧结构下 P0 取工位推进 4 格后P1~P3 已经动完了，新结构下他们会先看到这4 格；
 *   3. 6 点连锁额外回合归属于该玩家自己的连续动作，不插到别人中间；
 *   4. 赏骰登记发生在工位生效的<b>当场</b>（谁拿到记谁），
 *      但结算仍延后到全员行动结束 —— 「延后」指的是延后到所有人动完。
 * 规则书第三章已同步改写。
 *
 * 【AI 与人走同一条规则路径】AI 只是「替玩家做选择」，
 * 不实现任何自己的移动/吃子逻辑（见 core/ai.js 铁则）。
 */

/** 阶段常量 */
const PH = {
  CARD: 'CARD',     // 暗牌选行动
  ACT: 'ACT',           // 逐玩家连续行动（移动 / 额外回合 / 工位）
  BONUS: 'BONUS',// 赏骰奖励轮（全员行动结束后）
};

/** 额外回合连锁上限（规则 7.3 允许「再掷 6 再触发」，此处仅为防御性兜底） */
const EXTRA_CHAIN_CAP = 10;








/** 工位 id → 定义 */
const ST_BY_ID = new Map(STATIONS.map((s) => [s.id, s]));
class App {
  /**
   * @param {HTMLElement} root 挂载点
   * @param {object} opt
   * @param {number} opt.players 2..4
   * @param {boolean} opt.quick 极速单子
   * @param {Array} opt.human 哪些座位是人类（其余为 AI）
   * @param {string} opt.seed
   */
  constructor(root, opt = {}) {
    this.root = root;
    this.players = opt.players || 4;
    // 【默认经典 4 子】极速单子平均 7 轮就结束，体验不到策略深度；
    // 且经典模式每人在基地有 3 枚待命棋子，6 点的「二选一（出击 / 前进 6）」才有意义。
    this.quick = opt.quick !== undefined ? opt.quick : false;
    this.human = opt.human || [0];            // 默认 P0 人类，其余 AI（支持多人热座）
    this.seed = opt.seed || 'ui';

    this.game = new Game({ players: this.players, quick: this.quick, seed: this.seed });
    this.phase = PH.CARD;
    this.cursor = 0;                 // CARD 阶段当前轮到谁选牌
    this.flow = null;                // 【ACT 阶段】RoundFlow 游标，行动顺序的单一真相源
    this.sixers = [];                // 本轮打出 6 点的玩家
    this.bonusQueue = [];            // 【8.3 #7】待执行赏骰奖励轮的玩家队列（延后到全员行动结束）
    this.stationTaken = 0;
    this.stationPicks = [];      // 本轮已抢工位 [{player, station}]
    this.log = [];
    this.lastAction = null;     // 棋盘上常驻的「实时动作」提示（toast）
    this.dice = null;                // 最近一次掷骰的点数
    this.lastMove = null;            // {key, fromXY, jumped, captured, enteredHome, finished}
    this.pendingActions = null;      // 等待玩家选择的合法动作
    this.stationChoice = null;       // 等待玩家选择工位效果
    this.duelChoice = null;          // 【决斗】等待真人暗扣出牌 {player, role, options}
    this.pickActions = null;         // 额外回合 / 赏骰奖励轮：等待玩家在棋盘上点棋子
    this.timer = null;
    this.autoPlay = false;           // 「自动演示」模式

    this.el = {};
    this.buildSkeleton();
    // 静态棋盘若已随构建注入则立即挂载（setBoardSvg 在外部调用时也能兜住）
    if (typeof BOARD_SVG === 'string' && BOARD_SVG) this.setBoardSvg(BOARD_SVG);
    this.render();
    this.beginCardPhase();
    this.showWelcome();    // 首次进入自动弹出玩法引导，避免「打开不知道怎么玩」
  }

  // ------------------------------------------------------------ 骨架
  buildSkeleton() {
    this.root.innerHTML = `
<div class="ul-shell">
  <header class="ul-top">
    <div class="ul-brand">
      <span class="ul-logo">ULTIMATE<span class="ul-logo2">LUDO</span></span>
      <span class="ul-sub">一夜终极飞行棋 · WEB</span>
    </div>
    <div class="ul-turn">
      <div class="ul-turn-label">当前轮次</div>
      <div class="ul-turn-no" id="ul-turn">0</div>
    </div>
    <div class="ul-ctrl">
      <button class="ul-btn" id="ul-new">新对局</button>

      <button class="ul-btn ul-btn-ghost" id="ul-help">规则速查</button>
    </div>
  </header>

  <!-- 棋盘列：工位栏 / 状态栏 / 棋盘 自上而下只占这一列，棋盘吃掉剩余全部高度。
       其余面板（玩家 / 手牌 / 日志）一律竖排到右侧栏，不再在棋盘上下方堆叠。 -->
  <main class="ul-main">
    <section class="ul-boardcol">
      <div class="ul-stabar" id="ul-stabar"></div>
      <div class="ul-statusbar">
        <div class="ul-dice" id="ul-dice"></div>

        <div class="ul-toast" id="ul-toast" hidden></div>
      </div>
      <div class="ul-boardwrap">
        <div class="ul-board" id="ul-board">
          <div class="ul-boardimg" id="ul-boardimg"></div>
