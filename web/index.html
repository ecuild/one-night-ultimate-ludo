/**
 * 终局判定 —— 独立成模块以解开 game.js ↔ station.js 的循环依赖
 *
 * 【为什么独立】棋子抵达终点格有两条路径：
 *   1) Game.doMove       —— 6 点二选一 / 骰子行动牌 / 数字牌推进
 *   2) station.applyStationAction —— 18 张工位的「前进」类效果
 * 修复前只有路径 1 判终局，路径 2 抵达终点后游戏永不结束（实测 1/200 局死锁）。
 * 两条路径都需要写终局判定，若都写在各自文件里会形成 game ↔ station 循环 import，
 * 故把判定收敛到本文件，由两侧共同调用 —— 终局判定从此只有一处实现。
 *
 * 【判定口径】抵达终点格的编队会立刻从 groups 中移除（见 movement.applyMove），
 *   故 groups 只含「仍在局中的棋子」，finished 是已完成棋子的唯一真相。
 *   分母不能用 groups.length，必须用 pieceCount(quick)。
 */
/**
 * 判定某玩家是否达成胜利；达成则关闭对局并记录赢家
 * @param {object} g Game 实例（需具备 players / quick / over / winner）
 * @param {number} pIdx 玩家序号
 * @returns {boolean} 是否刚刚达成胜利
 */function settleWin(g, pIdx) {
  if (g.over) return false;
  if (!checkWin(g, pIdx)) return false;
  g.over = true;
  g.winner = pIdx;
  return true;
}

/* ==================== core/duel.js ==================== */
/**
 * 决斗 —— 主动吃子的两方对决（规则书 5.3 · 2026-10-09 新增）
 *
 * 【规则原文（用户裁定）】
 *   主动吃子的情况下，相当于是两方决斗：就跟平时进行回合一样双方同时暗扣卡牌，
 *   揭示，如果是骰子牌则投掷骰子，然后比较点数，
 *   平手攻击方胜利，其他时候点数小的回家。
 *
 * 【本模块的三条硬口径】
 * 1. 平手 → 攻击方胜（防守方回家）。「其他时候点数小的回家」即
 *    攻击方点数大 → 防守方回家；攻击方点数小 → 攻击方回家（反杀）。
 * 2. 暗扣牌为「数字手牌 1–6」或「骰子行动牌」：
 *    - 数字牌 = 牌面点数（确定值）
 *    - 骰子牌 = 揭示时投掷骰子 1–6（随机值）
 * 3. 出牌消耗：数字牌进各自弃牌区（与平时出牌一致）；
 *    骰子行动牌永久独立、不进弃牌区（规则 4.2），故出骰子牌不消耗。
 *
 * 【为什么单独成模块】
 * 决斗判据要被四处复用：核心结算（game）、AI 模拟（search）、
 * AI 出牌（ai）、UI 播报（app）。若各写一份 `>=` 比较，
 * 一旦将来改「平手防守方胜」，四处会静默不一致 —— 这类 bug 不报错、
 * 只表现为「AI 偶尔算错吃子」，极难定位。故收敛到单一真相源。
 */

/** 骰子行动牌的牌面标记（与 Game.playedCard === 'DICE' 同一口径） */
const DUEL_DICE = 'DICE';

/**
 * 揭示一张暗扣牌，得到实际点数
 *
 * @param {number|string} card 数字牌 1–6，或 DUEL_DICE
 * @param {function} [roll] 投骰函数，默认 Math.random 兜底（测试应注入种子化 rand）
 * @returns {number} 1–6 的点数
 */
function revealCard(card, roll) {
  if (card === DUEL_DICE) {
    const r = roll || (() => Math.floor(Math.random() * 6) + 1);
    return r();
  }
  return Number(card);
}

/**
 * 结算一场决斗
 *
 * @param {object} opts
 * @param {number|string} opts.attackerCard 攻击方（移动方）暗扣牌
 * @param {number|string} opts.defenderCard 防守方（被吃方）暗扣牌
 * @param {function} [opts.roll] 投骰函数（骰子牌揭示时用）
 * @returns {{
 *   attackerPts:number, defenderPts:number,
 *   attackerWins:boolean, tie:boolean,
 *   loser:'attacker'|'defender'
 * }}
 */
function settleDuel({ attackerCard, defenderCard, roll }) {
  const attackerPts = revealCard(attackerCard, roll);
  const defenderPts = revealCard(defenderCard, roll);
  const tie = attackerPts === defenderPts;
  // 【平手攻击方胜利】故攻击方只需 ≥ 即胜；防守方必须严格大于才能赢。
  const attackerWins = attackerPts >= defenderPts;
  return {
    attackerPts,
    defenderPts,
    attackerWins,
    tie,
    loser: attackerWins ? 'defender' : 'attacker',
  };
}

/**
 * 该玩家在决斗中可打出的暗扣牌候选
 *
 * @param {object} player 玩家状态（需 hand 数字牌数组 / hasDice 骰子牌标记）
 * @returns {Array<number|string>} 候选牌（数字牌 + 骰子行动牌）
 *
 * 【为什么骰子牌恒为候选】规则 4.2：骰子行动牌永久独立持有、不进弃牌区、
 * 每回合可无限选用。故即使数字手牌已打空，玩家也永远有牌可出 ——
 * 这保证决斗**永不死锁**（手牌为空时自动以骰子牌应战）。
 */
function duelCardOptions(player) {
  const opts = (player.hand || []).slice();
  if (player.hasDice) opts.push(DUEL_DICE);
  return opts;
}

/**
 * 自动/AI 为一场决斗选择暗扣牌
 *
 * 【策略依据 · 为什么是「出最大牌」】
 * 决斗的败方代价是**棋子回基地**（远大于一张手牌的资源价值），
 * 而胜率是点数的单调函数，故在「已确定要打这场决斗」的前提下，
 * 出手中最大点数即 dominant strategy —— 不存在靠留大牌换取后续收益的空间，
 * 因为输了这一场损失的是棋子本身。
 *
 * 【骰子牌的定位】骰子牌期望值 3.5 且不消耗（规则 4.2 永久独立）。
 * 当手中最大点数 ≤3 时，骰子牌的期望点数和胜率都更高，且省下一张手牌；
 * 当最大点数 ≥4 时，确定性的大点数优于随机期望（决斗只打一次，
 * 期望值不如「必胜/大概率胜」的确定性收益）。
 *   特别地：攻击方持 6 时**必胜**（6 ≥ 任何点数，平手也算攻击方胜）。
 *
 * @param {object} player 玩家状态
 * @param {object} [opts]
 * @param {boolean} [opts.asAttacker] 是否攻击方（当前双方策略一致，保留以备考量）
 * @returns {number|string} 选中的暗扣牌
 */
function pickDuelCard(player, opts = {}) {
  const hand = (player.hand || []).slice();
  const hasDice = !!player.hasDice;
  // 手牌已打空 → 只能出骰子牌（恒可用，保证不死锁）
  if (hand.length === 0) return hasDice ? DUEL_DICE : null;
  const best = Math.max.apply(null, hand);
  if (best >= 4) return best;
  // 最大 ≤3：骰子牌期望 3.5 更高且不消耗手牌
  return hasDice ? DUEL_DICE : best;
}

/**
 * 估算「攻击方持某牌」对「防守方随机应战」的胜率（供 AI 威胁模型使用）
 *
 * 这是**决策前的期望**，不是实际结算：AI 在决定「要不要踩这颗子」时，
 * 无法知道防守方会出什么牌，只能按对手的常见应手估期望。
 *
 * @param {number|string} attackerCard 攻击方打算出的牌
 * @param {object} defenderPlayer 防守方玩家状态（用于推断其可用牌）
 * @returns {number} 0..1 的胜率估计
 */
function duelWinRate(attackerCard, defenderPlayer) {
  if (attackerCard === DUEL_DICE) {
    // 骰子牌 1–6 均匀；对手按「出最大牌（≥4）或骰子」应战。
    // 保守估计：取对手可能的最大牌作为其点数上限做悲观估计。
    const hand = (defenderPlayer && defenderPlayer.hand) || [];
    const best = hand.length ? Math.max.apply(null, hand) : 0;
    const defPts = best >= 4 ? best : 4;   // 骰子期望 3.5，向上取 4 作保守值
    // 攻击方骰点 D ~ U{1..6}，胜条件 D >= defPts
    const wins = Math.max(0, 7 - defPts);   // D ∈ [defPts, 6] 共 7-defPts 个
    return wins / 6;
  }
  const a = Number(attackerCard);
  const hand = (defenderPlayer && defenderPlayer.hand) || [];
  const best = hand.length ? Math.max.apply(null, hand) : 0;
  const defPts = best >= 4 ? best : 4;
  return a >= defPts ? 1 : 0;
}

/**
 * 解析决斗胜率（精确口径，供 AI 估值用）
 *
 * 与 duelWinRate 的区别：duelWinRate 是「不知道对手会出什么」时的悲观兜底；
 * 而 AI 在评估「要不要踩这枚子」时，对手当前手牌是**可见状态**（game 内），
 * 故可以直接用双方真实的 pickDuelCard 结果算精确胜率，不必再悲观。
 *
 * 平手攻击方胜（与 settleDuel 同口径）；骰子牌揭示为 1–6 均匀。
 *
 * @param {number|string|null} a 攻击方暗扣牌（数字 / DUEL_DICE / null=无牌）
 * @param {number|string|null} d 防守方暗扣牌
 * @returns {number} 0..1 攻击方胜率
 */
function duelWinExact(a, d) {
  if (a == null) return 0;                 // 攻击方无牌可出 → 必败
  if (a === DUEL_DICE && d === DUEL_DICE) return 21 / 36; // 双方骰子：P(a>=b)，a,b∈1..6 = 21/36
  if (a === DUEL_DICE) return Math.max(0, 7 - Number(d)) / 6; // 攻骰、守固定 d：roll>=d 共 7-d 个
  if (d === DUEL_DICE) return Number(a) / 6;               // 攻固定 a、守骰：a>=roll 共 a 个（含平手攻胜）
  return Number(a) >= Number(d) ? 1 : 0;
}

/**
 * 数字牌 6 的「机会成本」—— 仅用于吃子（决斗）估值的机会修正项。
 *
 * 【为什么 6 要单独加机会成本 · 用户裁定 2026-10-10】
 * 6 是唯一的「二选一」资源（规则 7.1）：既可用于「出场 1 枚至起点」，
 * 也可用于「精准前进 6 格」，两者都是高价值动作、且只有 6 能触发。
 * 把它拿去决斗消耗掉，等于同时放弃了出场与走 6 两个选项 ——
 * 而普通数字牌（1–5）没有这种独占性高价值替代用途（走 N 步就是它的本职）。
 *
 * 旧估值只按面值扣 6，远低于出场的真实价值（quick 层出场基准 +60、
 * eval 层 worthwhile 增量 ~110–175）。于是 AI 误以为「拿 6 去吃子」只亏 6 分，
 * 实则亏掉整次出场 —— 系统性高估攻击、低估出场/走 6。
 *
 * 故**攻击方持 6 决斗**时，额外扣 SIX_OPP_COST ≈ 出场的边际价值，
 * 让 AI 在「用 6 出场/走 6」与「用 6 吃子」之间做正确取舍。
 * 该惩罚**不**应用于「出场分支」本身（出场已兑现 6 的二选一价值，不可重复扣），
 * 故由调用方通过 forgoesSix 显式控制（仅主动吃子的移动分支传 true）。
 *
 * 量级标定：出场把一枚 base 子（worth≈0，资源项 +65）变为 u=0 子
 * （worth≈175 + jumpEdge≈10），边际 ≈ 175 + 10 − 65 ≈ 120；
 * 初版取 110（略保守）。2026-10-10 用户要求「更惜 6」，上调至 200
 * （≈出场边际 120 的 1.7×）：弱目标坚决不吃，强目标仍勉强可吃。
 */
const SIX_OPP_COST = 200;

/**
 * 决斗期望净收益（供 quickMoveScore 吃子分支调用，单一真相源）
 *
 * 相对旧版 AI 估值的三处修正（对应 2026-10-09 / 10-10 用户裁定）：
 *   1. 胜率用 duelWinExact（基于双方真实手牌的解析期望），不再用悲观 0/1 兜底；
 *   2. 计入**出牌成本**：数字牌进弃牌区，成本 = 牌面值；骰子行动牌不消耗，成本 0。
 *      这正是「主动攻击会消耗你的大牌」在估值里的落地 —— 旧估值完全漏算。
 *   3. 【2026-10-10】攻击方持 6 时额外扣 SIX_OPP_COST（放弃出场/走 6 的机会成本），
 *      由 opts.forgoesSix 控制，仅主动吃子（非出场）分支计入。
 *
 * @param {object} attacker 攻击方玩家（取其 pickDuelCard）
 * @param {object} defender 防守方玩家
 * @param {number} capVal 吃子收益基准（调用方给，如 worthOf(敌子)*1.4）
 * @param {number} selfLoss 反杀损失（调用方给，如 worthOf(to)*系数）
 * @param {object} [opts]
 * @param {boolean} [opts.forgoesSix] 攻击方是否「把 6 拿去决斗而放弃出场/走 6」；
 *                                     仅主动吃子分支为 true，出场分支为 false。
 * @returns {number} 期望净收益
 */
function duelExpectNet(attacker, defender, capVal, selfLoss, opts = {}) {
  const aCard = pickDuelCard(attacker);
  const dCard = pickDuelCard(defender);
  const win = duelWinExact(aCard, dCard);
  const cost = (aCard !== null && aCard !== DUEL_DICE) ? Number(aCard) : 0;
  // 6 的机会成本：仅当「攻击方持 6 且把它拿去决斗（放弃出场/走 6）」时计入
  const oppCost = (opts.forgoesSix && aCard === 6) ? SIX_OPP_COST : 0;
  return win * capVal - (1 - win) * selfLoss - cost - oppCost;
}

/** 仅取胜率部分（供暴露折价分支的「敌方踩我方胜率」复用） */
function duelExpectWin(attacker, defender) {
  return duelWinExact(pickDuelCard(attacker), pickDuelCard(defender));
}


/* ==================== core/station.js ==================== */
/**
 * 工位效果执行 —— 规则书 8.3
 *
 * 18 张工位效果严格贴合「精准步数」：禁止少走、禁止多走、禁止走 0 步；
 * 仅明确标注「自选步数」的工位（灵活前进 1–4 / 前进 3–6 / 前进 2–5）允许玩家选步数。
 *
 * 【设计要点】本模块只负责「把工位效果算成具体的动作」，
 * 不直接改动 UI —— AI 与玩家走同一条路径，避免出现两套规则。
 */
/**
 * 工位是否可立即结算（需要玩家额外选择时返回 'CHOOSE'，交给 UI 呈现选项）
 */

/**
 * 列出某工位在该玩家当前局面下的可选动作
 * @returns {Array} [{kind, ...options}] kind: 'move'|'deploy'|'bind'|'tune'|'discard'|'retrieve'|'bonusDice'|'none'
 */function stationOptions(g, pIdx, station) {
  const pl = g.players[pIdx];
  const out = [];

  switch (station.kind) {
    case 'move': {
      const lo = station.min ?? station.fixed;
      const hi = station.max ?? station.fixed;
      for (let steps = lo; steps <= hi; steps++) {
        for (let i = 0; i < pl.groups.length; i++) {
          const gr = pl.groups[i];
          if (gr.pos < 0) continue;
          // 【规则 5.4 + 8.3】所有 move 类工位均标注「终点航道不可用」：
          //   既不能推进已在航道内的棋子（computeMove 内 LANE_NEEDS_DICE 拒绝），
          //   也不能用工位效果冲进航道（canEnterHome = false）。
          const mv = computeMove(pl, gr, steps, { isDiceAction: false, canEnterHome: false });
          if (mv.ok) {
            out.push({
              kind: 'move',
              steps,
              groupIndex: i,
              mv,
              label: inHomeLane(gr.pos)
                ? `终点航道推进 ${steps} 格 → 第 ${mv.lanePos} 格`
                : `前进 ${steps} 格`,
            });
          }
        }
      }
      break;
    }

    case 'deployOrBind': {
      // 选项①：从基地出场 1 枚至起点同色格
      const baseIdx = pl.groups.findIndex((x) => x.pos === -1);
      if (baseIdx >= 0) {
        out.push({ kind: 'deploy', groupIndex: baseIdx, label: '从基地出场 1 枚至起点' });
      }
      // 选项②：将同格两枚己方棋子绑定为编队
      const seen = new Map();
      pl.groups.forEach((gr, i) => {
        if (gr.pos < 0) return;
        const key = gr.pos;
        if (seen.has(key) && gr.size + pl.groups[seen.get(key)].size <= 2) {
          out.push({ kind: 'bind', groupIndex: seen.get(key), otherIndex: i, label: '绑定同格两枚为编队' });
        } else if (!seen.has(key)) {
          seen.set(key, i);
        }
      });
      break;
    }

    case 'tune': {
      // 从弃牌区选 1 张非 6 牌做 ±1 调整
      // 【不变量 · HAND_CAP】手牌已满则无牌可「换回」——调整产物牌是要进手牌的，
      // 6 张满时再加工具牌就是造牌，且会让 4.3 的「6 张打光才回收」永不达成。
      if (pl.hand.length >= HAND_CAP) break;
      for (let i = 0; i < pl.discard.length; i++) {
        const card = pl.discard[i];
        for (const to of tuneOptions(card)) {
          if ((g.pile[to] || 0) <= 0) continue;   // 牌堆该点数已空
          out.push({ kind: 'tune', discardIndex: i, from: card, to, label: `弃牌 ${card} → ${to}` });
        }
      }
      break;
    }

    case 'discard': {
      const n = Math.min(station.count, pl.hand.length);
      if (n <= 0) break;
      if (n === 1) {
        for (const c of pl.hand) out.push({ kind: 'discard', cards: [c], label: `弃 ${c}` });
      } else {
        // 2 张：枚举组合
        const h = pl.hand;
        for (let i = 0; i < h.length; i++) {
          for (let j = i + 1; j < h.length; j++) {
            out.push({ kind: 'discard', cards: [h[i], h[j]], label: `弃 ${h[i]} 与 ${h[j]}` });
          }
        }
      }
      break;
    }

    case 'retrieve': {
      // 【不变量 · HAND_CAP】按剩余容量裁剪张数。
      //   规则书 1.2 手牌「1–6 各 1 张，全程固定持有」= 恒为 6 张；
      //   若无上限，连续取回可把手牌撑到 10 张，而 4.3 的回收条件是
      //   「全部 6 张数字手牌均进入弃牌区」→ 手牌 >6 就永远打不空，回收永久失效。
      //   取不满 requested 张时按实际可取张数给选项（规则书 8.3 #12 对
      //   「调整 2 次」也明确「若不足则按实际可选张数调整」，口径一致）。
      const room = HAND_CAP - pl.hand.length;
      if (room <= 0) break;
      const want = Math.min(station.count, pl.discard.length, room);
      if (want <= 0) break;
      if (want === 1) {
        for (let i = 0; i < pl.discard.length; i++) {
          out.push({ kind: 'retrieve', discardIndex: i, card: pl.discard[i], label: `取回 ${pl.discard[i]}` });
        }
      } else {
        const d = pl.discard;
        for (let i = 0; i < d.length; i++) {
          for (let j = i + 1; j < d.length; j++) {
            out.push({ kind: 'retrieve', discardIndex: [i, j], card: [d[i], d[j]], label: `取回 ${d[i]} 与 ${d[j]}` });
          }
        }
      }
      break;
    }

    case 'bonusDice':
      out.push({ kind: 'bonusDice', label: '专属骰子奖励轮' });
      break;

    case 'invincible':
      // 【规则 5.5】无敌：**不需要玩家做任何选择**，直接生效。
      // 故这里只产出一个「确认」选项 —— 它不是「选一个动作」，
      // 而是把一个纯增益工位包装成与其它卡一致的一步，避免 UI/CLI 各写一套分支。
      // 已在免疫中时同样给出：重复取牌是**刷新**窗口（不是叠加，见 applyStationAction）。
      out.push({
        kind: 'invincible',
        label: isInvincible(pl) ? '无敌（刷新免疫窗口）' : '本回合与下回合免疫吃子',
      });
      break;
  }
  return out;
}

/**
 * 执行一个工位动作
 * @param {object} g Game 实例
 * @param {number} pIdx 玩家序号
 * @param {object} station 工位定义
 * @param {object} opt stationOptions 返回的某一项
 * @returns {object} 事件
 */function applyStationAction(g, pIdx, station, opt) {
  const pl = g.players[pIdx];
  switch (opt.kind) {
    case 'move': {
      const ev = applyMove(g, pIdx, opt.groupIndex, opt.mv);
      // 【决斗 · 2026-10-09】工位推进落点有敌子，同样触发决斗（与 doMove 同规则）。
      // 决斗由 Game 推进（applyMove 只登记待决斗列表），故必须在这里显式启动，
      // 否则工位路径会出现「落点站着敌子却什么都没发生」的静默漏判。
      if (ev.duels && ev.duels.length) {
        const auto = opt.autoDuel !== undefined ? opt.autoDuel : true;
        g.startDuels(ev.duels, pIdx, opt.groupIndex, auto);
        ev.captured = (g.duelCaptured || []).slice();
        ev.duelLost = !!g.duelLost;
      }
      g.note(`P${pIdx} 工位「${station.name}」${opt.label}`);
      // 【Bug 修复 · 2026-10-05 阶段二】工位也能把棋子推到终点格，
      //   原实现只在 Game.doMove 里判终局，导致工位抵达终点后游戏永不结束。
      //   判据统一收敛到 settleWin()，移动与工位两条路径共用。
      if (ev.finished) settleWin(g, pIdx);
      return ev;
    }
    case 'deploy': {
      // 【不变量加固 · 2026-10-06】规则 8.3 #2/#13 选项①「从基地出场 1 枚」。
      // 与 Game.doMove 的出场分支同口径加固：即使基地里存在 size>1 的编队
      // （正常对局不会出现，movement 吃子时已按规则 6 拆散），也只放 1 枚。
      const gr = pl.groups[opt.groupIndex];
      if (gr.size > 1) gr.size -= 1;
      gr.pos = 0;
      gr.home = false;
      g.note(`P${pIdx} 工位「${station.name}」出场 1 枚`);
      return { type: 'deploy' };
    }
    case 'bind': {
      const ok = bindGroups(pl, opt.groupIndex, opt.otherIndex);
      g.note(`P${pIdx} 工位「${station.name}」绑定编队`);
      return { type: 'bind', ok };
    }
    case 'tune': {
      const card = pl.discard.splice(opt.discardIndex, 1)[0];
      const r = tuneCard(g.pile, card, opt.to);
      if (r) pl.hand.push(opt.to);            // 调整后的牌回到手上
      g.note(`P${pIdx} 工位「${station.name}」${card} → ${opt.to}`);
      return { type: 'tune', ...r };
    }
    case 'discard': {
      for (const c of opt.cards) playCard(pl, c);
      g.note(`P${pIdx} 工位「${station.name}」弃 ${opt.cards.join(',')}`);
      // 【规则书 8.3 #5 / #10 明确禁止】弃牌工位「本次只丢弃、不拿牌、不置换、
      //   不触发手牌提前回收」。此前在此调用了 g.checkRecycle(pIdx)，
      //   结果弃掉的牌当帧就被回收回手牌、弃牌区被清空 —— 玩家看到的是
      //   「我用工位效果丢弃的牌怎么依然在我手中」。已按规则书移除。
      //   死锁兜底不依赖这里：Game.chooseCard 开头有 checkRecycle 安全网，
      //   手牌真的被打空时，下一次选牌（含骰子牌）会自动补满。
      return { type: 'discard', cards: opt.cards };
    }
    case 'retrieve': {
      const idxs = Array.isArray(opt.discardIndex) ? opt.discardIndex : [opt.discardIndex];
      // 【不变量修复 · 2026-10-06】原先在此写 g.pile[c] += 1（把取回的牌「归还」公共牌堆）。
      // 这是凭空造牌：这些牌本来就在玩家弃牌区，从未离开过「玩家持有」这个集合，
      // 规则书 8.3 #6 / #11 只说「从个人数字弃牌堆拿回手牌」，从未提及归还牌堆。
      // 实测 2 次回溯后牌堆从 50 张涨到 52 张 —— 公共牌堆是 1–5 各 10 张的有限存量
      // （规则书 1.2），凭空增长会让「牌堆耗尽后靠点数顶替」的兜底逻辑永不触发。
      const took = [];
      // 从后往前删，避免索引错位
      for (const i of idxs.slice().sort((a, b) => b - a)) {
        const c = pl.discard.splice(i, 1)[0];
        pl.hand.push(c);
        took.push(c);
      }
      g.note(`P${pIdx} 工位「${station.name}」取回 ${took.length} 张`);
      return { type: 'retrieve', cards: took };
    }
    case 'bonusDice':
      // 【规则 8.3 #7】赏骰奖励「延后至全员行动结束后执行」——
      //   此处只登记，不掷骰也不移动；由调用方把玩家放进赏骰队列，
      //   在回合流程第九步（确定下一轮起始玩家之后）统一结算。
      //   此前在这里直接 g.doExtraTurn()，等于把赏骰当成了 6 点额外回合：
      //   会给出击选项、会允许移动终点航道棋子、还会错误地再触发一次额外回合。
      return { type: 'bonusDice', pending: true };
    case 'invincible':
      // 【规则 5.5】置免疫计数。
      // 【为什么必须封顶而不是无限叠加 —— 2026-10-06 压测实测发现】
      //   原写成 `invincible += INVINCIBLE_ROUNDS`，免疫中再取一张就变成 4 轮。
      //   由于递减每轮只减1，它要3 轮才降回 2 —— 期间免疫期远超设计值。
      //   更糟的是压测抓到 inv=3 这个**越界值**，说明「叠加」引入了
      //   一个不受INVINCIBLE_ROUNDS 约束的状态，正是记忆里记过的
      //   「静默失效」类 bug：不抛异常，只是让规则与实现脱钩。
      //   正确做法：重复取牌只是**刷新**窗口，不叠加长度。
      //   理由也符合直觉 —— 无敌是「免疫状态」，不是「可累加的护盾值」。
      pl.invincible = INVINCIBLE_ROUNDS;
      g.note(`P${pIdx} 工位「${station.name}」免疫吃子${INVINCIBLE_ROUNDS} 轮`);
      return { type: 'invincible', rounds: pl.invincible };
  }
  return { type: 'none' };
}


/* ==================== core/flow.js ==================== */
/**
 * 回合流程编排 —— 单一真相源
 *
 * 【为什么需要这个模块】
 * 规则书第三章只写了一句「按顺位依次移动棋子 → 按顺位挑选并执行工位效果」，
 * 既没说清「移动阶段」与「工位阶段」是全队两个批量阶段，还是每名玩家各自的连续动作，
 * 也没说清 6 点连锁额外回合插在哪。这是规则书本身的表述缺陷，
 * 不是实现者的误读 —— 但实现必须选定一个口径并把它固定下来，否则会到处分叉。
 *
 * 【本模块选定的口径：逐玩家连续行动】
 *   暗牌选牌 → 全员亮牌 → 掷骰 → 判定顺位
 *   → 按顺位，每名玩家<b>连续完成自己的全部动作</b>：
 *        ① 移动棋子（6 点为二选一）
 *        ② 若掷 6 → 连锁额外回合（可反复，仍属该玩家自己的连续动作）
 *        ③ 若未掷 6 且有工位资格 → 挑选并执行工位
 *   → 全员行动结束后：工位队列滚动刷新 → 轮转起始玩家 → 执行赏骰奖励轮
 *
 * 【为什么是这个口径，而不是「全员移动完再统一取工位」】
 * 1. 规则书 8.3#7 写赏骰奖励轮在「本轮全员行动结束后执行」——
 *    用的是「全员行动结束」，隐含「每个人的行动是各自完成的」，
 *    若移动与工位是全队批量阶段，正确表述应是「移动与工位阶段结束后」。
 *    赏骰的延后基准必须落在「每人行动都做完」这个点上。
 * 2. 工位是<b>明牌竞抢</b>（队列 n−1 张，前 3 名按顺位先到先得）。
 *    若工位统一在全队移动之后执行，则先手玩家在自己的移动之后要空等，
 *    而后手玩家的工位效果可能改变先手玩家下一步的判断依据 ——
 *    这会让「先到先得」的顺位优势与「行动连续性」互相打架。
 * 3. 6 点连锁额外回合是「同一个人在同一次掷骰后再次行动」，
 *    语义上必然属于该玩家的连续动作，不该插到别人中间去。
 *
 * 【设计：游标而非状态机】
 * RoundFlow 只是一个<b>不可变步骤数组 + 游标</b>，不含任何规则判定，
 * 也不直接调用 game 的写操作。这样 UI（需要人工介入、要停下等输入）与
 * CLI（无人值守、可一口气跑完整局）都能消费同一个序列，
 * 且两边必然走完全相同的顺序 —— 这正是「单一真相源」的意义。
 *
 * 【额外回合连锁的表达】
 * 连锁在<b>步骤生成时</b>就展开：掷 6 的玩家生成
 *   move → extra → (若再掷 6 则追加 extra) → station(跳过，因为 6 点禁选)
 * 由于连锁次数取决于骰子、只能边跑边知道，本模块采用
 * 「生成一步、消费一步」的流式接口（next/advance），
 * 由调用方在每次执行完 extra 后询问「是否还有下一次额外回合」。
 */

/** 步骤类型常量 —— 调用方按此分派 */
const FLOW_STEP = {
  MOVE: 'move',        // 移动棋子（6 点为二选一）
  EXTRA: 'extra',      // 额外回合（6 点玩家专属，可连锁）
  STATION: 'station',  // 挑选并执行工位
};

/**
 * 回合流程游标
 *
 * 典型用法（UI 与 CLI 共用）：
 *   const flow = RoundFlow.start(this.game);
 *   let st = flow.current();
 *   while (st) {
 *     ...执行 st 对应的动作...
 *     if (st.type === FLOW_STEP.EXTRA) {
 *       st = flow.afterExtra(rolledSix);   // 连锁：再掷 6 就还有下一步
 *     } else {
 *       st = flow.next();
 *     }
 *   }
 *   flow.finishedBonus();   // 队列滚动 + 轮转起始玩家 + 返回赏骰队列
 */
class RoundFlow {
  /**
   * @param {Game} game
   * @param {number[]} order 行动顺位（game.resolveOrder 的结果）
   */
  constructor(game, order) {
    this.game = game;
    this.order = order.slice();
    this.idx = 0;
    // 该玩家本轮是否有工位资格：
    //   - 掷 6 者本轮全程禁选（规则 7.3）→ 立即判定，不依赖 usedSix 的置位时机
    //   - 非 6 点者按顺位前 STATION_PICK_LIMIT 名有资格（裁定 1）
    // 这里用 points===6 直接判定，而非读 usedSix。
    // 【为什么】旧实现在「全员移动完之后」才调 stationEligible，那时
    // usedSix 已被 endSixMove 置位，恰好等价于 points===6，纯属巧合。
    // 改成逐玩家连续行动后，必须在生成该玩家步骤时就确定资格 ——
    // 若仍依赖 usedSix，就变成「先有鸡还是先有蛋」：不移动就不知道能不能选工位。
    this.eligible = order
      .filter((p) => this.game.players[p].points !== 6)
      .slice(0, STATION_PICK_LIMIT);
  }

  /** 由 game 直接起手 */
  static start(game) {
    return new RoundFlow(game, game.resolveOrder());
  }

  /** 当前待执行的步骤；null 表示本轮行动已全部走完 */
  current() {
    return this.idx < this.steps.length ? this.steps[this.idx] : null;
  }

  /** 已完成到第几步（供日志/UI 显示「第几手」） */
  get progress() {
    return { done: this.idx, total: this.steps.length };
  }

  /**
   * 懒生成步骤数组
   * 【为何不在构造时一次生成】额外回合的连锁次数取决于后续骰点，
   * 构造时不可能知道。故 MOVE / STATION 在构造时即可定，
   * EXTRA 采取「消费到时才展开连锁」的方式（见 afterExtra）。
   */
  get steps() {
    if (this._steps) return this._steps;
    const out = [];
    for (const p of this.order) {
      out.push({ type: FLOW_STEP.MOVE, player: p });
      if (this.game.players[p].points === 6) {
        // 6 点：移动后进入额外回合，且本轮禁选工位（规则 7.3）
        out.push({ type: FLOW_STEP.EXTRA, player: p });
      } else if (this.eligible.includes(p)) {
        out.push({ type: FLOW_STEP.STATION, player: p });
      }
      // 非 6 点且无资格者：此轮该玩家在行动阶段无事可做（裁定 1 第 4 名空转）
    }
    this._steps = out;
    return out;
  }

  /** 常规步骤：推进游标 */
  next() {
    this.idx++;
    return this.current();
  }

  /**
   * 额外回合执行完毕
   *
   * @param {boolean} rolledSix 本次额外回合是否又掷出 6
   * @returns {object|null} 下一步骤（rolledSix 为真时再给一个 EXTRA）
   *
   * 【连锁的表达】掷出 6 → 规则 7.3「重复触发全部 6 点规则」→ 再来一次额外回合。
   * 该连锁属于「同一玩家的连续动作」，因此游标停在同一步之前，
   * 不把别的玩家插进来 —— 这正是本口径与旧两阶段结构的本质差别。
   */
  afterExtra(rolledSix) {
    // 游标当前指向 EXTRA 步骤。若再掷 6，就把该步骤重演一次（游标不动）。
    // 否则推进一步（可能是下一玩家的 MOVE，也可能是本轮结束）。
    if (rolledSix) {
      this._repeatExtra = true;
      return this.current();
    }
    this._repeatExtra = false;
    return this.next();
  }

  /**
   * 循环结束标志：steps 全部走完
   * 供调用方判定「本轮行动结束 → 该做队列刷新 / 起始轮转 / 赏骰了」
   */
  get done() {
    return this.current() === null;
  }

  /**
   * 本轮收尾：工位队列滚动刷新 + 轮转起始玩家
   *
   * @param {number} taken 本轮实际取走的工位数
   * @returns {number[]} 延后执行的赏骰奖励轮玩家队列
   *
   * 【为什么赏骰不在这里执行】规则 8.3#7：赏骰奖励轮在「本轮全员行动结束后」执行，
   * 且必须先确定下一轮起始玩家（流程第九步的顺序）。
   * 故本方法只做队列刷新与轮转，把赏骰队列交还调用方延后结算。
   */
  finish(taken) {
    this.game.refillQueue(taken);
    this.game.nextTurn();
    return this.pendingBonus ? this.pendingBonus.slice() : [];
  }

  /**
   * 登记赏骰资格（由工位 #7 效果在<b>该玩家自己的回合内</b>触发）
   *
   * 【关键差异】旧实现在「全员工位阶段结束后」才结算赏骰，
   * 于是 P0 拿到赏骰后，P1/P2/P3 还能继续抢工位、继续改变局面，
   * 赏骰的执行时机被无谓推后。逐玩家连续口径下，
   * 谁拿到就在谁的回合内登记，赏骰本身仍然延后到全员行动结束 ——
   * 「延后」指延后到<b>所有人</b>行动结束，不是延后到工位阶段结束。
   */
  addBonus(p) {
    if (!this.pendingBonus) this.pendingBonus = [];
    if (!this.pendingBonus.includes(p)) this.pendingBonus.push(p);
  }
}

/**
 * 供测试与 CLI 直接使用的步骤清单（不含游标语义）
 * @returns {Array<{type:string, player:number}>}
 */
function roundPlan(game) {
  return new RoundFlow(game, game.resolveOrder()).steps;
}


/* ==================== core/game.js ==================== */
/**
 * 回合编排 —— 规则书第三章「回合完整固定流程」+ 4.4 顺位 + 第七章 6 点 + 第八章工位
 *
 * 流程（环节不可颠倒）：
 *   暗牌选行动 → 全员同时亮牌 → 骰子行动牌玩家掷骰 → 统一判定行动顺位
 *   → 按顺位依次移动 → 按顺位挑选并执行工位（赏骰延后）→ 工位队列滚动刷新
 *   → 确定下一轮起始玩家 → 执行赏骰奖励轮
 *
 * 【裁定 1】四人局工位队列仅 3 张，第 4 名玩家无牌可取 → 空转跳过。
 */
/**
 * 对局控制器：持有全部可变状态，对外暴露「选牌 / 选棋子 / 选工位」三类动作
 *
 * 所有随机性来自 this.rand（种子化），保证同 seed 可完整复现。
 */class Game {
  constructor({ players = 4, quick = true, seed = 'ludo' } = {}) {
    this.rand = makeRng(seed);
    this.n = players;
    this.quick = quick;
    this.seed = seed;
    this.pile = newUpgradePile();
    this.turn = 0;
    this.startPlayer = Math.floor(this.rand() * players);
    this.over = false;
    this.winner = null;

    this.players = [];
    for (let p = 0; p < players; p++) {
      this.players.push({
        id: p,
        groups: [{ pos: 0, size: 1, home: true }],
        hand: [1, 2, 3, 4, 5, 6],
        hasDice: true,
        discard: [],
        finished: 0,
        // 本轮状态
        playedCard: null,   // 数字牌 or 'DICE'
        points: null,       // 本轮点数
        usedSix: false,
        pendingExtra: false,
        extraPoints: null,   // 额外回合单独掷出的点数（≠ 本回合行动牌点数）
        bonusPoints: null,   // 赏骰奖励轮单独掷出的点数
        invincible: 0,// 【规则 5.5】剩余免疫轮数，0 = 无敌不生效
      });
    }
    if (!quick) {
      for (const pl of this.players) {
        for (let i = 0; i < 3; i++) pl.groups.push({ pos: -1, size: 1, home: true });
      }
    }

    this.deck = STATIONS.map((s) => s.id);
    shuffle(this.deck, this.rand);
    this.queue = this.deck.splice(0, this.n - 1);
    this.log = [];

    // ---- 回收待执行队列（规则书 4.3 · 时序修正 2026-10-10）----
    // 打出最后一张牌 / 决斗出牌打空手牌时，不再当场回收，
    // 而是标记入队，推迟到「本轮工位阶段结束后」由 flushRecycle 统一执行，
    // 以免工位（手牌调整 / 回溯取回 / 回收2 次 / 调整2 次）读到被提前清空的弃牌区而空转。
    this.recyclePending = new Set();

    // ---- 决斗状态（规则 5.3 · 2026-10-09）----
    // pendingDuels：本次移动触发的、还未开打的决斗队列（逐一决斗）
    // duelCtx：本轮决斗的上下文（谁是攻击方、动的是哪枚棋子）
    // duel：当前正在进行、等待揭示的这场（含双方暗扣牌）
    // duelCaptured / duelLost：本次决斗的最终战果，回填到移动的 ev 供 UI/AI 读取
    this.pendingDuels = [];
    this.duelCtx = null;
    this.duel = null;
    this.duelCaptured = [];
    this.duelLost = false;
    this.lastDuel = null;
    // duelForce：搜索专用的决斗结果强制开关（'attacker' | 'defender' | null）。
    // 【为什么需要 · 2026-10-14】搜索模拟一次走法时，若该走法触发决斗，
    // resolveAllDuels 会自动结算并用 rollDie(this.rand) 采样骰子牌点数 ——
    // 这是**一次随机采样**，不是期望。同一走法在不同随机流下因此得到
    // ±1400 分的偏差（探针 probe_duel_noise.mjs 实测：含决斗候选的决策点
    // 不稳定率 17.9%，不含决斗的仅 1.9%），而普通走法分差只有 100~300，
    // 采样噪声足以淹没真实差异。搜索故按此开关分「攻击胜/攻击败」两支
    // 各评估一次、再按 duelExpectWin 加权合成期望（见 search.js）。
    // 真实对局与 UI 恒为 null（正常掷骰）；快照不携带它 —— 搜索每次
    // 强制前显式设置、用后立即清除，真实流程永不接触该字段。
    this.duelForce = null;
  }

  note(msg) {
    this.log.push({ turn: this.turn, msg });
  }

  /** 当前该谁行动（暗牌阶段由外部决定谁在选） */
  get order() {
    return Array.from({ length: this.n }, (_, k) => (this.startPlayer + k) % this.n);
  }

  // ------------------------------------------------------------ 暗牌阶段
  /** 玩家选牌：数字 1-6 或 'DICE'（骰子行动牌） */
  chooseCard(pIdx, card) {
    const pl = this.players[pIdx];
    // 【安全网】进入选牌前先确保手牌有效：工位「弃牌」等途径可能把数字手牌直接丢空，
    // 若不在此补满，玩家会只剩骰子行动牌、又打不出数字牌 → 永远无法触发回收，
    // 正是说明书 8.3#5 明确警告的「只能用骰子行动牌的死锁」。
    // 规则书 4.3：只有 6 张数字牌全部打光才回收，故此处仅在手牌为空时生效。
    this.checkRecycle(pIdx);
    if (card === 'DICE') {
      if (!pl.hasDice) throw new Error('骰子行动牌不存在');
      pl.playedCard = 'DICE';
      // 【规则 4.2】全员亮牌后当场掷骰，以骰点为本回合行动点数
      pl.points = rollDie(this.rand);
      // 【规则 4.2】骰子行动牌使用后立即收回本人手牌，
      // 不进弃牌区、不参与任何回收，每回合可无限重复选用
    } else {
      if (!pl.hand.includes(card)) throw new Error(`手牌中没有 ${card}`);
      // 【规则 4.2】打出后放入个人数字弃牌区
      playCard(pl, card);
      pl.playedCard = card;
      pl.points = card;
      // 【规则 4.3 · 时序修正 2026-10-10】打出后若 6 张全部打光，不再当场回收，
      // 改为标记待回收，推迟到「本轮工位阶段结束后」由 flushRecycle 统一执行：
      // 否则工位「手牌调整 / 回溯取回 / 回收2 次 / 调整2 次」会读到被提前清空的弃牌区而空转。
      this.markRecycle(pIdx);
    }
  }

  /**
   * 【规则 4.4】统一判定行动顺位
   * 6 点玩家永远最先；多名同为 6 点者按起始玩家顺时针
   * 非 6 点玩家按点数从小到大；点数相同按起始玩家顺时针
   */
  resolveOrder() {
    const acts = this.players
      .filter((pl) => pl.playedCard !== null)
      .map((pl) => ({ p: pl.id, pts: pl.points }));
    // 注意：Array.sort 的比较器只取「符号」，必须返回偏移量之差而非偏移量本身
    const off = (p) => (p - this.startPlayer + this.n) % this.n;
    acts.sort((a, b) => {
      if ((a.pts === 6) !== (b.pts === 6)) return a.pts === 6 ? -1 : 1;
      if (a.pts !== b.pts) return a.pts - b.pts;
      return off(a.p) - off(b.p);          // 点数相同 → 按起始玩家顺时针
    });
    return acts.map((a) => a.p);
  }

  // ------------------------------------------------------------ 移动阶段
  /**
   * 【规则 1.3 补· 2026-10-06 新增】全员在基地时免费赠送一次出击
   *
   * 【要解决的问题】
   * 规则书 1.3 原有唯一豁免：「所有棋子均已入终点格 / 基地无棋子可出场、
   * 无任何可移动棋子时，该玩家本轮自动跳过移动阶段」。
   * 但存在一个被漏掉的中间态：**棋子既没进终点、也不在场上，全部堆在基地**。
   * 经典 4 子局里这很容易发生（开局各1 枚在场，被吃光后就进入这个状态）。
   * 此时该玩家的回合是「打出一张牌 → 什么也动不了」，
   * 手牌白白消耗、额外回合也拿不到，是纯粹的空转与挫败感。
   *
   * 【规则口径】当一名玩家**所有棋子都不在场上**（全部在基地待命；
   *   已进终点的棋子不参与「是否在场上」的判定）时，
   *   他本轮额外获得一次「免费出击」：把基地里1 枚棋子放到自家起点格，
   *   **不消耗点数、不占用 6 点二选一**。
   *
   * 【为什么是「所有」而不是「至少一枚」】
   * 若只要基地有棋子就能免费出击，则 6 名玩家以外的每个人都白拿一张免费出场，
   * 等于凭空多出4 次出场机会，直接摧毁 6 点「二选一」这个核心抉择的价值
   * （规则书 5.1 明确「低点数的战略价值在于率先行动与优先挑选工位」）。
   * 限定「全都在基地」使得这个救济只在真正无棋可动时触发，不改变常规对局。
   *
   * @param {number} pIdx
   * @returns {number} 基地中可免费出场的编队索引；无可免费出击时返回 -1
   */
  freeDeployIndex(pIdx) {
    const pl = this.players[pIdx];
    // 场上还有任何一枚棋子 → 不是「全员在基地」，不触发
    for (const gr of pl.groups) {
      if (gr.pos >= 0) return -1;
    }
    // 全部在基地：取第一枚。注意这里不能只查 pos === -1 就返回，
    // 上面已经保证了「全部在基地」，故两者等价，但分层写更不易被后续改动破坏。
    return pl.groups.findIndex((gr) => gr.pos === -1);
  }

  /**
   * 列出某玩家本轮的全部合法动作
   * @returns {Array} 供 UI 渲染为可点击项
   */
  legalActions(pIdx) {
    const pl = this.players[pIdx];
    const pts = pl.points;
    if (pts === null) return [];

    // 【规则 1.3 补】全员在基地 → 额外插入免费出击选项（不消耗点数）
    const freeIdx = this.freeDeployIndex(pIdx);
    if (freeIdx >= 0) {
      const rest = this.legalActionsByPoints(pIdx);
      return [{ kind: 'free-deploy', groupIndex: freeIdx, mv: null, label: '免费出击 1 枚至起点' }, ...rest];
    }
    return this.legalActionsByPoints(pIdx);
  }

  /** 按本回合点数列出合法动作（免费出击等附加项由 legalActions 负责叠加） */
  legalActionsByPoints(pIdx) {
    const pl = this.players[pIdx];
    const pts = pl.points;

    // 【规则 7.1】6 点：必须二选一，不可放弃
    if (pts === 6) {
      // 6 点的来源可能是数字牌 6 或骰子行动牌（掷出 6）：isDiceAction 必须与 doMove 的执行口径
      // 一致（doMove 用 pl.playedCard === 'DICE' 判定），否则骰子 6 的「进入航道 / 进终点格」
      // 选项会被列错。数字牌 6 → allowLane:true 可进/走航道但不可进终点；骰子 6 → 全开。
      const isDice6 = pl.playedCard === 'DICE';
      const opts = legalMoves(this.players[pIdx], 6, {
        forSix: true,
        isDiceAction: isDice6,
        canEnterHome: isDice6,
        allowLane: !isDice6,
      });
      const out = opts.map((o) => ({
        kind: o.sixKind === 'deploy' ? 'six-deploy' : 'six-advance',
        groupIndex: o.gIdx,
        mv: o.mv,
        label: o.sixKind === 'deploy' ? '出场 1 枚至起点' : '精准前进 6 格',
      }));
      // 【规则 7.1】6 点必须二选一 —— 当前进 6 格不可行时（会越过终点 / 被精准步数否决），
      // 「基地出场」仍必须作为一个可选项存在，否则玩家会被迫放弃本回合，
      // 违反「不可放弃」。doMove 对 pos === -1 的编队会执行到场（deploy 分支）。
      //
      // 【Bug 修复 · 2026-10-06】原判断只看「有没有前进 6 格」，
      // 但 legalMoves(forSix) 本身已经产出了一条 six-deploy（取第一个基地棋子），
      // 于是「无前进 + 有基地」时又追加一条 → 界面上出现两个一模一样的「出场」按钮，
      // 且两条都指向同一枚棋子。实测：场上仅剩 u=55（进 6 会越界）+ 1 枚基地棋子时，
      // legalActions 返回 2 条完全相同的 six-deploy。
      // 修法：兜底只在「连出场都没有」时才补。
      if (!out.some((o) => o.kind === 'six-advance') && !out.some((o) => o.kind === 'six-deploy')) {
        const idx = this.players[pIdx].groups.findIndex((g) => g.pos === -1);
        if (idx >= 0) out.push({ kind: 'six-deploy', groupIndex: idx, mv: null, label: '出场 1 枚至起点' });
      }
      return out;
    }

    // 骰子行动牌：可动普通航道 或 终点航道（润色说明 5.4）
    if (pl.playedCard === 'DICE') {
      const out = [];
      for (let i = 0; i < pl.groups.length; i++) {
        const g = pl.groups[i];
        if (g.pos < 0) continue;
        const mv = computeMove(this.players[pIdx], g, pts, {
          isDiceAction: true,
          canEnterHome: true,
        });
        if (mv.ok) {
          out.push({
            kind: inHomeLane(mv.to) ? 'home' : 'main',
            groupIndex: i,
            mv,
            label: inHomeLane(mv.to) ? `进入终点航道第 ${mv.to - HOME_START + 1} 格` : `前进 ${pts} 格`,
          });
        }
      }
      return out;
    }

    // 数字牌：可推进主航道棋子，亦可进入 / 移动终点航道（2026-10-06 修正：非骰子可进入航道），
    // 但仅骰子行动牌可进入终点格 —— 故 isDiceAction:false + allowLane:true + canEnterHome:true。
    const out = [];
    for (let i = 0; i < pl.groups.length; i++) {
      const g = pl.groups[i];
      if (g.pos < 0) continue;
      const mv = computeMove(this.players[pIdx], g, pts, { isDiceAction: false, canEnterHome: true, allowLane: true });
      if (mv.ok) {
        out.push({
          kind: mv.enteredHome ? (inHomeLane(g.pos) ? 'home' : 'enter-home') : 'main',
          groupIndex: i,
          mv,
          label: inHomeLane(g.pos)
            ? `终点航道推进 ${pts} 格 → 第 ${mv.lanePos} 格`
            : (mv.jumped ? `前进 ${pts} 格并跳跃` : `前进 ${pts} 格`),
        });
      }
    }
    return out;
  }

  /**
   * 执行一次移动
   * @param {object} [override] 供「额外回合 / 赏骰奖励轮」覆盖本次点数与骰子权限：
   *   这两条路径的点数是单独掷出来的，不等于本回合的行动牌点数 pl.points，
   *   若沿用 pl.points 就会出现「额外回合掷出 3 却走了 6 格」的严重错算。
   */
  doMove(pIdx, groupIndex, override) {
    const pl = this.players[pIdx];
    const g = pl.groups[groupIndex];
    if (g.pos === -1) {
      // 出场：6 点选项① / 工位「出击」/【规则 1.3 补】免费出击
      // 【不变量加固 · 2026-10-06】规则 7.1 选项① / 8.3 #2 选项① 都只说「出场 1 枚」。
      // 正常对局下基地里不可能出现 size>1 的编队（movement.applyMove 吃子时已按规则 6
      // 拆散），但本函数是「出场」的唯一入口，必须对任何输入都守住 1 枚这条底线：
      // 若存在 size>1 的编队，只放 1 枚，其余留在基地。
      if (g.size > 1) g.size -= 1;
      g.pos = 0;
      g.home = false;
      // 【规则 7.1 新增 · 2026-10-06】出场即落子于起点同色格（cellNo(pIdx,0)）：
      //   若敌子正蹲在自家起点上 → 吃掉它（击退基地）；
      //   若蹲着的是【无敌】敌子 → 我方被弹回基地（规则 5.5 无敌新作用「别人踩上去别人回老家」）。
      const ev = { type: 'deploy', free: !!(override && override.free), captured: [], bounced: false, duels: [] };
      const res = resolveLanding(this.players, pIdx, cellNo(pIdx, 0));
      ev.captured = res.captured;
      ev.duels = res.duels || [];
      if (res.bounced) {
        g.pos = -1; g.home = true; ev.bounced = true;
        this.note(`P${pIdx} 出场被无敌弹回基地`);
      } else {
        this.note(`P${pIdx} 出场 1 枚至起点`);
        // 【决斗 · 2026-10-09】出场踩到敌子同样要决斗（不再白吃）
        if (ev.duels.length) {
          const auto = override && override.autoDuel !== undefined ? override.autoDuel : true;
          this.startDuels(ev.duels, pIdx, groupIndex, auto);
          ev.captured = (this.duelCaptured || []).slice();
          ev.duelLost = !!this.duelLost;
        }
      }
      // 【免费出击】不消耗点数、不置6 点标记 —— 与 6 点选项①走同一条物理路径，
      // 但**不改变本轮点数与工位资格**（规则 1.3 补：它不是 6 点特权的一部分）。
      return ev;
    }
    // 【Bug 修复 · 2026-10-10】override 缺字段时的回落保护：
    //   doMove 的调用方（UI 的 applyChosenMove）只传 {autoDuel:false} 来「挂起真人决斗」，
    //   并不带 pts / isDice。若此处写 `override ? override.pts : pl.points`，
    //   只要 override 非 null 就把 pts 取成 undefined → computeMove 失败返回 null
    //   → 点棋子完全不动、流程却照常推进（现象：「点旗子没反应，直接进工位」）。
    //   canEnterHome 这条（下方）已有 !== undefined 保护，此处补上 pts / isDice 的一致性。
    const pts = (override && override.pts !== undefined) ? override.pts : pl.points;
    const isDice = (override && override.isDice !== undefined) ? override.isDice : (pl.playedCard === 'DICE');
    // 【一致性修复 · 2026-10-06】canEnterHome 必须可被 override 显式覆盖。
    // 此前的隐式规则是「canEnterHome = isDice」，于是赏骰奖励轮
    // （commitBonus 传 isDice:true）也顺带拿到了「首次进入终点航道」的权限。
    // 但规则 8.3 #7 逐字写明赏骰奖励轮「不能移动终点航道棋子」，
    // 规则 5.4 又把入航道权限限定给「本回合打出骰子行动牌的玩家」——
    // 赏骰是工位效果，不是骰子行动牌，故必须显式收紧。
    // 更关键的是一致性：列选项的 bonusOptions 与执行的 doMove 若用不同参数，
    // 会出现「点下去落点变了」。故把该参数纳入 override 统一口径。
    // 【一致性修复 · 2026-10-13】canEnterHome / allowLane 必须与 legalActionsByPoints
    // 的**列选项口径**同源，否则就是「点下去落点变了」——
    //   · 旧实现写 `canEnterHome = isDice`，而列选项对数字手牌传的是 canEnterHome:true
    //     （规则 5.4 · 2026-10-06 修正：非骰子可进入航道）→ 执行侧把「入航道」吞掉：
    //       - 跳跃入航道被抑制（u47+1：列表 u52、实落 u48，按钮写「跳跃」却没跳）；
    //       - 直入航道直接 computeMove 失败返回 null（u50+2 / u51+1 整步静默消失）。
    //   · 旧实现从不传 allowLane，而 computeMove 对「航道内棋子 + 非骰子」强制要求
    //     allowLane → 数字手牌推进航道内棋子同样整步静默失败（u53+2）。
    //   · 数字牌 6 的六进阶是唯一例外：列选项口径 canEnterHome:false（禁入航道）、
    //     allowLane:true（6 步必越界，实际不可达，仅为口径对齐）。
    // 该缺陷同时是 AI 选牌层崩坏的根因：search.js 经 doMove 试走，入航道类数字牌
    // 全被评估成「+16 分的原地小步」，searchCard 因此系统性贬数字牌、滥选骰子牌
    // （实测选牌层胜率 23.8% vs 启发式 50%，见 src/cli/arena_layer.js）。
    // 注意：赏骰奖励轮由 commitBonus 显式传 canEnterHome:false 收紧（8.3 #7），不受本默认值影响。
    const canEnterHome = override && override.canEnterHome !== undefined
      ? override.canEnterHome
      : !(pts === 6 && !isDice);
    const allowLane = override && override.allowLane !== undefined
      ? override.allowLane
      : !isDice;
    const mv = computeMove(this.players[pIdx], g, pts, {
      isDiceAction: isDice,
      canEnterHome,
      allowLane,
    });
    if (!mv.ok) return null;
    const ev = applyMove(this, pIdx, groupIndex, mv);
    if (mv.jumped) this.note(`P${pIdx} 落在同色格，跳跃至 ${mv.to}`);
    if (ev.bounced) this.note(`P${pIdx} 踩中无敌，被弹回基地`);
    if (ev.captured.length) this.note(`P${pIdx} 吃子：击退 ${ev.captured.map((c) => 'P' + c.player).join(',')}`);
    // 【决斗 · 2026-10-09】主动吃子不再稳吃：落点有敌子即触发双方暗扣对决。
    // autoDuel 默认 true，AI 模拟/CLI/测试可无人值守打完；UI 真人传 false 挂起等出牌。
    if (ev.duels && ev.duels.length) {
      const auto = override && override.autoDuel !== undefined ? override.autoDuel : true;
      this.startDuels(ev.duels, pIdx, groupIndex, auto);
      // 回填决斗战果：captured 供 UI/AI 沿用，duelLost 标记攻击方被反杀
      ev.captured = (this.duelCaptured || []).slice();
      ev.duelLost = !!this.duelLost;
    }
    if (mv.enteredHome) this.note(`P${pIdx} 进入终点航道第 ${mv.lanePos} 格`);
    if (ev.finished) {
      this.note(`P${pIdx} 一枚棋子抵达终点格（${this.players[pIdx].finished}）`);
      // 【Bug 修复 · 2026-10-05】终局判定统一走 settleWin，与 station.js 的工位路径共用
      settleWin(this, pIdx);
    }
    return ev;
  }

  // ------------------------------------------------------------ 决斗（规则 5.3 · 2026-10-09）
  /**
   * 移动/出场后登记待决斗列表
   *
   * @param {Array} duels resolveLanding 产出的待决斗敌子列表
   * @param {number} moverIdx 攻击方
   * @param {number} groupIndex 攻击方本次移动的编队索引（败北时把它送回基地）
   * @param {boolean} auto true=双方交给 AI 策略自动出牌并一路结算到底；
   *                       false=只开第一场、等 UI 调 submitDuelCard 交牌
   * @returns {boolean} 是否已全部结算完毕
   *
   * 【为什么需要 auto 这个开关】
   * 决斗要求双方各出一张牌。AI 模拟（search.js 会直接调 doMove 试探走法）
   * 必须能无人值守地一口气打完，否则搜索树会在半路断掉、AI 决策失真。
   * 而 UI 里真人要亲自暗扣选牌，必须能挂起等待。故用同一套流程、两种推进方式。
   */
  startDuels(duels, moverIdx, groupIndex, auto = true) {
    if (!duels || duels.length === 0) return true;
    this.pendingDuels = duels.map((d) => Object.assign({}, d));
    this.duelCtx = { moverIdx, groupIndex };
    // 【接口兼容】决斗的最终战果回填到本次移动的 ev.captured / ev.duelLost：
    // UI 播报、AI 评分、既有测试都读 captured，若让它恒为空会静默打断多条链路。
    this.duelCaptured = [];
    this.duelLost = false;
    if (!auto) {
      this.openDuel();
      return false;
    }
    return this.resolveAllDuels();
  }

  /** 开启队列中的下一场决斗（只建场、不自动出牌） */
  openDuel() {
    if (!this.pendingDuels || this.pendingDuels.length === 0) {
      this.duel = null;
      return null;
    }
    const d = this.pendingDuels[0];
    const ctx = this.duelCtx;
    this.duel = {
      attacker: ctx.moverIdx,
      defender: d.player,
      groupIndexes: (d.groupIndexes || [d.groupIndex]).slice(),
      size: d.size,
      attackerCard: null,
      defenderCard: null,
      result: null,
    };
    return this.duel;
  }

  /** 自动模式：用 AI 策略为双方出牌，一路结算到队列清空或攻击方败北 */
  resolveAllDuels() {
    let guard = 0;
    while (this.pendingDuels && this.pendingDuels.length) {
      if (guard++ > 32) break;        // 防御：理论上每格最多 3 个对手，32 足够
      const duel = this.openDuel();
      if (!duel) break;
      const atk = this.players[duel.attacker];
      const def = this.players[duel.defender];
      duel.attackerCard = pickDuelCard(atk);
      duel.defenderCard = pickDuelCard(def);
      // 双方都拿不出牌的极端情况（无骰子牌且手牌空）：跳过该场，避免死循环
      if (duel.attackerCard === null || duel.defenderCard === null) {
        this.pendingDuels.shift();
        continue;
      }
      const attackerDown = this.settleCurrentDuel();
      if (attackerDown) break;        // 攻击方已回基地，其余场次取消
    }
    this.clearDuelState();
    return true;
  }

  /**
   * 提交一方的暗扣牌（UI 真人用；AI 走 resolveAllDuels 自动出牌）
   * @returns {boolean} 是否已结算（双方都交了牌）
   */
  submitDuelCard(pIdx, card) {
    if (!this.duel) return false;
    if (pIdx === this.duel.attacker) this.duel.attackerCard = card;
    else if (pIdx === this.duel.defender) this.duel.defenderCard = card;
    else return false;
    if (this.duel.attackerCard === null || this.duel.defenderCard === null) return false;
    return this.settleCurrentDuel();
  }

  /**
   * 结算当前这场决斗（揭示 → 比点 → 败方回家 → 消耗弃牌）
   * @returns {boolean} 攻击方是否被淘汰（true=攻击方败北回基地，后续场次取消）
   */
  settleCurrentDuel() {
    const d = this.duel;
    if (!d) return false;
    // 【搜索期望口径】duelForce 非空时跳过掷骰直接判定胜负，
    // 让搜索按「攻击胜/攻击败」两支分别评估后合成期望（见构造函数注释）。
    // 两条分支都要走 consumeDuelCard（双方暗扣牌照常消耗），故只在
    // 「揭示比点」这一步替换为确定性结果，其余结算逻辑完全不变。
    const forced = this.duelForce;
    const res = forced
      ? {
          attackerPts: 0, defenderPts: 0, tie: false,
          attackerWins: forced === 'attacker',
          loser: forced === 'attacker' ? 'defender' : 'attacker',
        }
      : settleDuel({
          attackerCard: d.attackerCard,
          defenderCard: d.defenderCard,
          roll: () => rollDie(this.rand),   // 骰子牌揭示：沿用种子化随机流，保证可复现
        });
    d.result = res;

    // 【出牌消耗 · 用户裁定】数字牌进各自弃牌区；骰子行动牌永久独立、不进弃牌区（规则 4.2）
    this.consumeDuelCard(d.attacker, d.attackerCard);
    this.consumeDuelCard(d.defender, d.defenderCard);

    const atkPl = this.players[d.attacker];
    const defPl = this.players[d.defender];
    const tieTxt = res.tie ? '（平手·攻击方胜）' : '';
    this.note(`决斗 P${d.attacker} ${res.attackerPts} vs P${d.defender} ${res.defenderPts}${tieTxt}`);

    if (res.attackerWins) {
      sendHome(defPl, d.groupIndexes);
      // 回填战果，保持 captured 接口语义不变
      this.duelCaptured.push({ player: d.defender, size: d.size, groupIndex: d.groupIndexes[0] });
      this.note(`P${d.attacker} 决斗胜，P${d.defender} 的 ${d.size} 枚棋子回基地`);
      this.pendingDuels.shift();          // 本场打完，进入下一场
      if (this.pendingDuels.length === 0) {
        this.clearDuelState();
        return false;
      }
      this.openDuel();                    // 开下一场（UI 模式会在此挂起等出牌）
      return false;
    }

    // 攻击方败北：自己回基地，且后续场次全部取消（其余防守方保留）
    const ctx = this.duelCtx;
    const g = atkPl.groups[ctx.groupIndex];
    if (g) { g.pos = -1; g.home = true; }
    this.duelLost = true;            // 供 UI 播报「反杀」
    this.note(`P${d.attacker} 决斗败，自己的棋子回基地`);
    this.pendingDuels = [];
    this.clearDuelState();
    return true;
  }

  /** 消耗一张决斗暗扣牌（数字牌进弃牌区，并在打光时触发规则 4.3 回收） */
  consumeDuelCard(pIdx, card) {
    if (card === DUEL_DICE) return;       // 骰子行动牌不消耗
    if (card === null || card === undefined) return;
    const pl = this.players[pIdx];
    if (playCard(pl, card)) {
      this.note(`P${pIdx} 决斗打出 ${card}`);
      // 【规则 4.3 · 时序修正 2026-10-10】决斗出牌也是「打出」，6 张全打光同样触发回收，
      // 但同样推迟到本轮工位阶段结束后由 flushRecycle 统一执行（markRecycle）。
      if (pl.hand.length === 0) this.markRecycle(pIdx);
    }
  }

  /** 清空决斗状态（全部场次结束后调用） */
  clearDuelState() {
    // 保留最后一局的结果供 UI 播报（要显示「你出 N、对手出 M、谁胜」），
    // 否则结算完 this.duel 被置空，播报层拿不到点数。
    if (this.duel) this.lastDuel = this.duel;
    this.pendingDuels = [];
    this.duelCtx = null;
    this.duel = null;
  }

  /** 当前是否有一场决斗在等待某玩家出牌（供 UI 判断要不要弹选牌界面） */
  isDuelPending() {
    return !!(this.duel && (this.duel.attackerCard === null || this.duel.defenderCard === null));
  }

  // ------------------------------------------------------------ 6 点规则
  /** 6 点玩家结束移动阶段：标记需额外回合（额外回合只能掷骰、全程禁选工位） */
  endSixMove(pIdx) {
    const pl = this.players[pIdx];
    pl.usedSix = true;
    pl.pendingExtra = true;
  }

  /**
   * 额外回合 · 第 1 步：掷骰
   * 【拆分原因】原 doExtraTurn 把「掷骰 → 列选项 → 自行挑第一个 → 执行」写在一起，
   * UI 无法插入玩家选择。现在拆成掷骰 / 列选项 / 提交三步，
   * 人机与 AI 走完全相同的规则路径（AI 只是替玩家做第 3 步的选择）。
   *
   * @returns {number} 骰点 1..6
   */
  /**
   * 额外回合 · 第 1 步：掷骰
   * 【规则 7.3】额外回合只能掷实体骰子；骰点必须单独记录，
   *   绝不能复用 pl.points（那是本回合行动牌的点数）。
   */
  rollExtra(pIdx) {
    const pts = rollDie(this.rand);
    this.players[pIdx].extraPoints = pts;
    this.note(`P${pIdx} 额外回合掷出 ${pts}`);
    return pts;
  }

  /**
   * 额外回合 · 第 2 步：列出合法动作
   * 掷出 6 时为二选一（出场 / 推进），否则为普通骰子移动（含入航道权限）
   * @returns {Array} 形状与 legalActions 一致，可直接交给 chooseMove
   */
  extraTurnOptions(pIdx, pts) {
    const pl = this.players[pIdx];
    const out = [];

    if (pts === 6) {
      const out2 = [];
      // 额外回合恒为实体骰子掷出 → isDiceAction:true、可进入航道与终点格；allowLane 无意义。
      for (const o of legalMoves(pl, 6, { forSix: true, isDiceAction: true, canEnterHome: true, allowLane: false })) {
        out2.push({
          kind: o.sixKind === 'deploy' ? 'six-deploy' : 'six-advance',
          groupIndex: o.gIdx,
          mv: o.mv,
          label: o.sixKind === 'deploy' ? '出场 1 枚至起点' : '精准前进 6 格',
        });
      }
      // 与 legalActions 同源的兜底：前进 6 不可行时，基地出场必须仍然可选。
      // 【Bug 修复 · 2026-10-06】同 legalActions：legalMoves(forSix) 已产出 six-deploy，
      // 原判断只看 six-advance 会导致重复追加同一个出场选项。兜底须同时看两者。
      if (!out2.some((o) => o.kind === 'six-advance') && !out2.some((o) => o.kind === 'six-deploy')) {
        const idx = pl.groups.findIndex((g) => g.pos === -1);
        if (idx >= 0) out2.push({ kind: 'six-deploy', groupIndex: idx, mv: null, label: '出场 1 枚至起点' });
      }
      return out2;
    }

    // 非 6：骰子移动，普通航道与终点航道皆可
    for (let i = 0; i < pl.groups.length; i++) {
      const g = pl.groups[i];
      if (g.pos < 0) continue;
      const mv = computeMove(pl, g, pts, { isDiceAction: true, canEnterHome: true });
      if (mv.ok) {
        out.push({
          kind: inHomeLane(mv.to) ? 'home' : 'main',
          groupIndex: i,
          mv,
          label: inHomeLane(mv.to) ? `进入终点航道第 ${mv.lanePos} 格` : `前进 ${pts} 格`,
        });
      }
    }
    return out;
  }

  /**
   * 额外回合 · 第 3 步：提交选中的动作
   * 再次掷出 6 时重复触发额外回合标记（由调用方决定是否再掷）
   */
  /**
   * 额外回合 · 第 3 步：提交选中的动作
   * 【规则 7.3】再次掷出 6 时重复触发全部 6 点规则（由调用方决定是否再掷）
   * 【修复】此前直接调用 doMove，走的是 pl.points（本回合行动牌点数），
   *   于是「额外回合掷出 3 点」也按 6 格移动 —— 点数被吞。改为显式传入本次骰点。
   * 【决斗 · 2026-10-10 修复】duelOpts 用于把 UI 的「挂起真人决斗」标志传进来。
   *   此前本函数写死 autoDuel 默认 true，额外回合踩到敌子时双方被 AI 策略
   *   静默代打并立即结算 —— 真人既看不到暗扣界面、也没机会出牌，
   *   表现就是「我攻击了却没触发决斗，对手直接回去了」。
   */
  commitExtraTurn(pIdx, groupIndex, duelOpts) {
    if (!this.players[pIdx].pendingExtra) return null;
    const pts = this.players[pIdx].extraPoints;
    if (pts === undefined || pts === null) return null;
    return this.doMove(pIdx, groupIndex, Object.assign({ pts, isDice: true }, duelOpts || {}));
  }

  /** 结束额外回合（清标记，进入下一轮） */
  endExtraTurn(pIdx) {
    this.players[pIdx].pendingExtra = false;
  }

  /**
   * 重新开启额外回合（规则 7.3：额外回合再次掷出 6 → 重复触发全部 6 点规则）
   *
   * 【Bug 修复 · 2026-10-06】此前 UI 的连锁写法是「先 endExtraTurn() 再把玩家压回队列」，
   * 于是第二轮额外回合进入时 pendingExtra 已被清成 false，
   * commitExtraTurn() 的守卫 `if (!pendingExtra) return null` 直接早退 ——
   * 表现为「又给了额外回合，但棋子一步没动」。实测 8 局里出现 7 次。
   * 修复：压回队列时必须同时把标记重新置起，让标记始终反映
   * 「该玩家此刻是否还有待执行的额外回合」，而不是「上一个额外回合是否已结束」。
   */
  reopenExtraTurn(pIdx) {
    this.players[pIdx].pendingExtra = true;
  }

  // ------------------------------------------------------------ 赏骰奖励轮
  /**
   * 【规则 8.3 #7 赏骰奖励】流程第九步：本轮全员行动 + 工位选取结束后才执行。
   * 与「6 点额外回合」是两套东西，不可混用：
   *   - 只能移动<b>普通航道</b>棋子（终点航道棋子不可动）
   *   - 不触发 6 点特权（不给出击选项、不新增额外回合）
   *   - 不可再选工位
   */
  rollBonus(pIdx) {
    const pts = rollDie(this.rand);
    this.players[pIdx].bonusPoints = pts;
    this.note(`P${pIdx} 赏骰奖励轮掷出 ${pts}`);
    return pts;
  }

  /** 赏骰奖励轮的合法动作：普通航道棋子 + 骰点精准移动（含跳跃） */
  bonusOptions(pIdx, pts) {
    const pl = this.players[pIdx];
    const out = [];
    for (let i = 0; i < pl.groups.length; i++) {
      const g = pl.groups[i];
      if (g.pos < 0) continue;                 // 赏骰不给出击
      if (inHomeLane(g.pos)) continue;         // 【8.3 #7】不能移动终点航道棋子
      // 【Bug 修复 · 2026-10-06】canEnterHome 由 true 收紧为 false。
      // 规则 5.4：「终点航道仅允许本回合打出骰子行动牌的玩家移动」，
      //           「数字手牌、各类工位效果、6 点二选一的突进，均不能移动终点航道内的棋子」。
      // 赏骰奖励轮由工位 #7 产生，属「工位效果」，故无入航道权限。
      // 此前传 true 导致两条越权路径（探针 probe_deep3.mjs 实测）：
      //   u=51 掷 1 → 直走进终点航道第 1 格
      //   u=44 掷 4 → 跳跃落点 u=52 进入终点航道
      // 同时必须与 commitBonus 的执行参数保持一致，否则会出现「点下去落点变了」。
      const mv = computeMove(pl, g, pts, { isDiceAction: true, canEnterHome: false });
      if (mv.ok) {
        out.push({
          kind: inHomeLane(mv.to) ? 'home' : 'main',
          groupIndex: i,
          mv,
          label: inHomeLane(mv.to) ? `进入终点航道第 ${mv.lanePos} 格` : `前进 ${pts} 格`,
        });
      }
    }
    return out;
  }

  /**
   * 提交赏骰奖励轮的移动
   * 【决斗 · 2026-10-10 修复】duelOpts 语义同 commitExtraTurn：默认仍是无人值守自动结算，
   *   但 UI 传入 {autoDuel:false} 时可挂起等待真人暗扣出牌。
   */
  commitBonus(pIdx, pts, groupIndex, duelOpts) {
    // canEnterHome:false —— 与 bonusOptions 严格同口径（见上）
    return this.doMove(pIdx, groupIndex, Object.assign({ pts, isDice: true, canEnterHome: false }, duelOpts || {}));
  }

  /**
   * 【兼容入口】一次性跑完额外回合（CLI 压测与不需要玩家选择的场景使用）
   * 内部仍然调用上面三步，只是第 3 步自动取第一个合法动作
   */
  doExtraTurn(pIdx) {
    const pts = this.rollExtra(pIdx);
    const opts = this.extraTurnOptions(pIdx, pts);
    if (opts.length) this.commitExtraTurn(pIdx, opts[0].groupIndex);
    return { pts, six: pts === 6, options: opts };
  }

  // ------------------------------------------------------------ 工位系统
  /** 取走一张可见工位（返回工位定义） */
  takeStation(index) {
    const id = this.queue.splice(index, 1)[0];
    return STATIONS.find((s) => s.id === id);
  }

  /**
   * 【规则 8.2】工位队列滚动刷新：取走 k 张就补入 k 张，队列恒为 n-1
   * 牌库不足时把已用过的工位洗回牌库再补，始终保证队列为 n-1 张，
   * 不会出现空队列或超量。
   */
  refillQueue(taken) {
    for (let i = 0; i < taken; i++) {
      // 牌库耗尽 → 把已用过的洗回牌库
      while (this.deck.length === 0) {
        if (!this.used || this.used.length === 0) break;
        shuffle(this.used, this.rand);
        this.deck.push(...this.used);
        this.used = [];
      }
      // 极端兜底：牌库与已用池都空（理论上不会发生，18 张足够循环）
      if (this.deck.length === 0) {
        this.deck.push(STATIONS[Math.floor(this.rand() * STATIONS.length)].id);
      }
      this.queue.push(this.deck.shift());
    }
  }

  /** 记录已用过的工位（供牌库耗尽时回收） */
  markUsed(stationId) {
    this.used = this.used || [];
    this.used.push(stationId);
  }

  /** 本轮有资格取工位的玩家顺位（前 STATION_PICK_LIMIT 名且非 6 点） */
  stationEligible(order) {
    const out = [];
    for (const p of order) {
      if (this.players[p].usedSix) continue;      // 【规则 7.3】6 点全程禁选工位
      if (out.length >= STATION_PICK_LIMIT) break;  // 【裁定 1】前 3 名有资格
      out.push(p);
    }
    return out;
  }

  // ------------------------------------------------------------ 回合收尾
  /** 轮转起始玩家 + 清理本轮状态 */
  nextTurn() {
    this.turn += 1;

   * （规则书 4.3 时序：回收不抢占工位对弃牌区的读取）
   */
  flushRecycle() {
    if (!this.recyclePending.size) return;
    for (const pIdx of this.recyclePending) this.checkRecycle(pIdx);

  }

  checkRecycle(pIdx) {

 * 威胁表：每名玩家各一张52 格概率图

 * 早期实现只建「非 me 的棋子对 me 的威胁」一张图，
 * 然后拿去给每个对手算暴露损失 —— 这依赖「威胁场对称」
 * （A 能打到 B 的格 ⟺ B 在 A 的射程内）。该假设在本规则下确实成立，
 * 但它是一个**隐含假设**：一旦将来加入非对称规则（如某玩家有视野限制、
 * 或某棋子不能吃子），整张评估会静默错位，且没有任何断言会报警。
 * 故显式按玩家分别计算：成本仅 4×52 个数字，收益是消除隐含前提。
 *
 * 【概率口径】每个敌子对某格的吃点是具体某个点数，发生概率 1/6；
 * 多个敌子按「至少一个命中」叠加：1 − Π(1 − 1/6)。
 * 不用二值「射程内 = 会被吃」，理由见模块头部与ai.js 的对照实验记录。
 *
 * 【决斗修正 · 2026-10-14 —— 本模块与决斗规则对齐的关键修复】
 * 规则 5.3（2026-10-09 起）：敌子落到我方格子上**不再是稳吃**，
 * 而是双方暗扣对决，防守方仍有胜机（平手攻击方胜）。
 * 旧实现把「敌子够得着该格」直接当作「我会被吃」，等于假设敌方必胜 ——
 * 而 quickMoveScore 的暴露折价分支早已乘以敌方决斗胜率 foeWin
 * （见 search.js），两条路径口径不一致，后果是**评估层比贪心层更悲观**：
 * 搜索因此系统性躲避任何有敞口的推进，而贪心正确地折价后照常推进。
 * 实测（probe_choice_diff.mjs，40 局 402 个分歧点）：
 *   d1 搜索 vs 贪心在分歧点 27:27 完全打平，主局胜率仅 22.5% ——
 *   即搜索相对贪心**没有提供任何决策质量提升**，本项是主要嫌疑。
 *
 * 修法：对每个 (攻击方 other, 防守方 me) 组合预先算好 foeWin，
 * 落地概率乘以该系数。代价是 4×4 次 duelExpectWin（每次只是两次
 * pickDuelCard + 一次解析比较），可忽略。
 *
 * @param {Game} g
 * @returns {Map<number, number[]>} **玩家序号 id** → 长度 52 的概率数组
 */
function threatTables(g) {
  const tables = new Map();
  /**
   * foeWin[a][d] = 「a 持当前手牌攻击 d」的决斗胜率。
   * 按 (攻击方, 防守方) 预先算好，避免在 52×groups×6 的内层重复计算。
   */
  const foeWin = new Map();
  for (const a of g.players) {
    const row = new Map();
    for (const d of g.players) {
      row.set(d.id, a.id === d.id ? 1 : duelExpectWin(a, d));
    }
    foeWin.set(a.id, row);
  }
  for (const me of g.players) {
    // 【键必须是 me.id 而不是 me 对象】此处若用 `tables.set(me, ...)`，
    // 下游按整数 id 查表（tt.get(pl.id)）必然拿到 undefined，
    // 表现为 playerScore 里 `threat[c]` 抛「Cannot read properties of undefined」。
    // Map 用对象做键是引用相等，与 id 语义无关，故必须显式用 me.id。
    const p = new Array(52).fill(0);
    // 【规则 5.5 · 无敌 · 双向】无敌玩家**既不被任何人吃，也不吃任何人**。
    //   这条要在这两处同时成立，缺一不可：
    //   ① 下方 `if (isInvincible(other)) continue` —— 无敌方不向任何人贡献威胁。
    //      缺它AI 会反复尝试去打无敌子（每次模拟都吃不到、白耗节点），
    //      还会把无敌方误判为「好欺负」而加码进攻。
    //   ② 此处 `if (isInvincible(me))` 直接返回全零表—— 我方免疫时不存在被吃敞口。
    //      缺它 playerScore 的 threatRisk 项会继续扣分，
    //      等于「明明 immune 却在怕被吃」，AI 会有多余弃子行为。
    //   注意「规则层拦住」与「评估层承认」是两件事：movement.applyMove 只保证
    //   实际不吃，评估层若不认，搜索仍会朝错误方向展开。
    if (isInvincible(me)) {
      tables.set(me.id, p);
      continue;
    }
    for (const other of g.players) {
      if (other.id === me.id) continue;
      if (isInvincible(other)) continue;
      // 【决斗修正】敌子落到我方格上只是「发起决斗」，真正被吃的概率
      // 还要乘以敌方的决斗胜率。无敌敌方不会踩我方（踩了自弹），已排除。
      const win = foeWin.get(other.id).get(me.id);
      for (const og of other.groups) {
        if (og.pos < 0 || inHomeLane(og.pos)) continue;
        for (let step = 1; step <= 6; step++) {
          const raw = og.pos + step;
          if (raw > FINISH) break;
          let to = raw;
          if (isOwnCell(to)) to = Math.min(to + 4, FINISH);   // 敌方棋子同样吃跳跃
          if (to === og.pos || inHomeLane(to)) continue;
          const c = cellNo(other.id, to);
          if (c < 0 || c >= 52) continue;
          p[c] += (1 - p[c]) / 6 * win;
        }
      }
    }
    tables.set(me.id, p);
  }
  return tables;
}

/** 该格是否「我方下轮也想要」—— 用于抢格对冲，避免退让成软柿子 */
function isContested(g, me, targetU) {
  const pl = g.players[me];
  for (const gr of pl.groups) {
    if (gr.pos < 0 || inHomeLane(gr.pos)) continue;
    for (let step = 1; step <= 6; step++) {
      const raw = gr.pos + step;
      if (raw > FINISH) break;
      let to = raw;
      if (isOwnCell(to)) to = Math.min(to + 4, FINISH);
      if (to !== targetU || inHomeLane(to)) continue;
      if (worth(gr.pos) >= 300) return true;
    }
  }
  return false;
}

/**
 * 停在同色格（u%4==0）上的「下一轮跳跃期望收益」
 *
 * 【为什么不能是常数 —— 见 playerScore 第 2 项的注释】
 * 规则 5.2：落到同色格上再走 4 格。若下一点数恰好落回该同色格，
 * 就白赚 4 格推进。概率取决于「从该格出发、走p 步后仍落在同色格」的 p 值。
 * 由于worth 的斜率随 u 递增，这笔期望收益也随 u 递增，
 * 故必须按当前斜率折算，不能取常数。
 *
 * 计算：遍历 1..6 六个点数，累加「触发跳跃时的额外 4 格价值」。
 * 触发条件：raw = u + p 恰为同色格（此时 computeMove 会再+4）。
 * 主航道每4 格一个同色格，故 6 个点数里通常只有 1 个触发。
 *
 * @param {number} u 当前进度（主航道内）
 * @returns {number} 期望额外价值（已含 size=1 的量纲）
 */
function jumpEdge(u) {
  if (u < 0 || u >= FINISH || inHomeLane(u)) return 0;
  let s = 0;
  for (let p = 1; p <= 6; p++) {
    const raw = u + p;
    if (raw > FINISH) break;
    if (!isOwnCell(raw)) continue;          // 该点数落不到同色格 → 无红利
    const to = Math.min(raw + 4, FINISH);
    if (to === raw) continue;
    s += (worth(to) - worth(raw)) / 6;      // 等概率 1/6
  }
  return s;
}

/**
 * 「假如该玩家没有无敌」时的威胁表 —— 用于给免疫标定收益
 *
 * 【为什么需要这个反事实函数】
 * threatTables 对免疫玩家返回全零表（免疫即无敌，正确），
 * 于是「免疫值多少分」不能用那张表算 —— 它已经免疫了，分差自然是 0。
 * 正确口径是：假想摘掉无敌标记，重算被吃敞口，那份敞口就是免疫消除掉的损失。
 *
 * 【成本】O(对手数 × 敌子数 × 6)，与threatTables 同阶。
 * 只在玩家**处于免疫期**时才调用（playerScore 3b 项），
 * 而免疫是 18 张牌里的少数局面，故对整体评估耗时影响可忽略。
 *
 * 【决斗口径必须与 threatTables 一致 · 2026-10-14】
 * 本函数与 threatTables 是同一件事的两种问法，故敌方决斗胜率 foeWin
 * 也必须乘上 —— 否则「免疫的收益」按「敌方必胜」高估，
 * AI 会为了拿无敌而放弃实质推进。
 *
 * @param {Game} g
 * @param {number} pIdx 玩家序号
 * @returns {number[]} 长度 52 的概率数组（无视无敌）
 */
function naiveThreatOf(g, pIdx) {
  const me = g.players[pIdx];
  const p = new Array(52).fill(0);
  for (const other of g.players) {
    if (other.id === me.id) continue;
    const win = duelExpectWin(other, me);   // 与 threatTables 同口径：敌方决斗胜率
    for (const og of other.groups) {
      if (og.pos < 0 || inHomeLane(og.pos)) continue;
      for (let step = 1; step <= 6; step++) {
        const raw = og.pos + step;
        if (raw > FINISH) break;
        let to = raw;
        if (isOwnCell(to)) to = Math.min(to + 4, FINISH);
        if (to === og.pos || inHomeLane(to)) continue;
        const c = cellNo(other.id, to);
        if (c < 0 || c >= 52) continue;
        p[c] += (1 - p[c]) / 6 * win;
      }
    }
  }
  return p;
}

/**
 * 弃牌区进度价值 —— 规则书 4.3 的「全打光即回收补满」
 *
 * 【要解决的真问题 · 2026-10-06 工位价值建模】
 * 原实现给弃牌区每张牌一个常数 discardCard=6，
 * 于是「弃 1 张」被算成 6 − 18 = **−12 分**，即弃牌工位是负收益。
 * 探针实测 #5 = −12、#10 = −24，方向与规则完全相反。
 *
 * 【为什么常数定值在原理上就不成立】
 * 不变量：hand ∪ discard ≡ 6 张（规则书 1.2「1–6 各 1 张，全程固定持有」）。
 * 故弃牌的收益不是「多了张牌」，而是：
 *   ① 弃牌区的牌**可被 #6/#11 回收类工位取回**（有限定地变现）；
 *   ② 弃牌是「让 6 张打光」的推进，而打光是**唯一的补牌途径**（规则 4.3）。
 * 这两者的价值都取决于「离打光还差几张」：
 *   · 已弃 5 张时再弃 1 张 → 立刻触发全回收，实际收益极大；
 *   · 已弃 0 张时弃 1 张 → 只推进了 1/6，价值很小。
 * 常数模型把这两种极端压成同一个数，必然一边错。
 *
 * 【建模口径 · 修正记录】
 * 第一版写成 `progress = R · Σ_{k=1..r} 1/k`（r = 剩余张数），
 * 意图是「越接近打光、单步越值钱」。但这个函数**方向反了**：
 * Σ1/k 在 r 小时数值**更小** —— 即「离打光越近，分数越低」。
 * 探针实测直接暴露：弃 1/2/3/4/5/6 张后的 eval 全部等于 −1399，
 * 意味着增量对每个选项都是同一个常数，完全没有区分度；
 * 更糟的是弃 5 张（离打光只差 1 张，此时价值应最高）
 * 反而和弃 1 张同分。
 *
 * 正确方向：**价值必须随「已弃张数」单调递增**，
 * 因为弃牌区的牌越多，离「一次全回收补满 6 张」越近。
 * 且递增幅度要递减（最后一张是临门一脚，但不该压过一切）。
 *
 * 记d = discard.length（0..5；到 6 时已触发回收、弃牌区清空）：
 *   progress = R · (1 − 1/(d+1))·  ... 不行，仍不是单调递增的正确形状。
 * 改用**已弃张数占比**的平方根型：
 *   progress = R · √(d / HAND_CAP)
 * d=0→0, d=1→0.41R, d=2→0.58R, d=3→0.71R, d=5→0.91R。
 * 单调递增、增速递减、末段仍未饱和（保留「临门一脚」的溢价）。
 *
 * @param {object} pl 玩家状态
 * @returns {number} 弃牌区进度价值（分）
 */
function recycleProgress(pl) {
  const d = pl.discard.length;
  if (d <= 0) return 0;                     // 未弃牌 → 无进度
  if (d >= HAND_CAP) return 0;              // 已打光：checkRecycle 会清空弃牌区
  return W.recycleUnit * Math.sqrt(d / HAND_CAP);
}

/**
 * 消融/标定开关（探针用 · 2026-10-14）
 *
 * 【为什么需要】竞技场实测「越深越差」（d1 35% / d2 45.8% / d3 40.8%，
 * 均不高于贪心 50%），而 probe_eval_corr 实测朴素指标 remaining（总剩余格数）
 * 的胜负预测力 AUC 71.3% **高于** evalState 的 69.5% —— 说明 playerScore
 * 里若干项是净负担。逐项消融是定位「哪一项有害」的唯一严谨手段：
 * 关掉一项看 AUC 升降，升 = 该项在帮倒忙。
 *
 * 默认全开（null = 不消融），真实对局与 UI 不受影响。
 *
 * @param {object} [o]
 * @param {boolean} [o.noThreat]   关掉期望被吃损失（第 4 项）+ 免疫补偿（3b）
 * @param {boolean} [o.noCluster]  关掉聚集风险（第 5 项）
 * @param {boolean} [o.noResource] 关掉手牌/回收进度（第 3 项）
 * @param {boolean} [o.noJump]     关掉跳跃红利（第 2 项的 jumpEdge）
 * @param {boolean} [o.noContest]  关掉抢格对冲（第 4 项的 contestHedge）
 * @param {number}  [o.basePiece]  覆盖 W.basePiece（基地子价值）——
 *                                 吃子在 evalState 里是隐式的（敌子 worth 消失、
 *                                 基地子 worth 出现），故「吃子倍率」只能经由
 *                                 基地子价值间接标定。
 */
const NO_OPTS = null;

/** 取消融配置（null → 全开） */
function optOf(opts) {
  return opts || NO_OPTS;
}

/**
 * 单个玩家的局面价值（绝对值，不含零和差）
 * 组成：收官 + 进度 + 跳跃红利 + 资源 − 被围堵期望损失 − 聚集风险
 */
function playerScore(g, pIdx, threat, opts) {
  const o = opts || {};
  const pl = g.players[pIdx];
  let s = 0;

  // 1) 收官 —— 唯一真正的胜负条件
  s += pl.finished * W.finish;

  // 2) 进度+ 跳跃红利（独立项，不污染 worth 曲线）
  for (const gr of pl.groups) {
    s += worth(gr.pos, gr.size);
    // 【跳跃红利改为「期望净增」而非「固定加分」—— 2026-10-06 修复的评估级BUG】
    // 原写法 `if (isOwnCell(gr.pos)) s += 60 * size` 有一个致命性质：
    // 它给「停在同色格」加了 60 分，于是**离开同色格就等于凭空丢 60 分**。
    // 实测（6点二选一，P0 在 u=20 有一枚、基地有 3 枚）：
    //   推进u=20→u26：进度 +75，但 jump 项 60→0，净 +15
    //   出击（新增一枚到 u=0）：进度 +55，jump 项不变（base 不算同色格）
    //   → evalState 判定「出击 +115」优于「推进 -24」，搜索于是反复弃攻出击。
    // 表现：搜索 AI 平均收官 2.13 枚（旧贪心 3.00），对局轮数 47→86（慢一倍），
    // 「全员在航道」空转从 42 次涨到 942 次。
    //
    // 正确的期望口径：停在 u 的同色格上，下一轮用点数 p 落回该格时
    // 会获得 +4 的额外推进，期望额外收益 = E[额外推进格数] × 当前斜率，
    // 且**随 u 增大而增大**（斜率递增），绝不是常数 60。
    // 此处按「当前格到下一同色格的额外 4 格 × 该处斜率」的期望值折算，
    // 数量级远小于 60（典型 40~90 但随 u 变化），不会压过实际推进。
    if (gr.pos >= 0 && gr.pos < FINISH && isOwnCell(gr.pos)) {
      if (!o.noJump) s += jumpEdge(gr.pos) * gr.size;
    }
  }

  // 3) 资源：手牌密度 + 回收进度+ 无敌防御
  // 【为什么保留 handCard 但废弃 discardCard】
  // hand 表示「现在能选的牌」，是即时战力，故线性计分；
  // discard 表示「离补满还差几步」，其价值是**非线性递减**的
  // （见 recycleProgress 的推导），绝不能与handCard 用同一个常数。
  // 若误用同一个常数，会得出「弃牌是净损失」的错误结论。
  if (!o.noResource) {
    s += pl.hand.length * W.handCard;
    s += recycleProgress(pl);
  }

  // 3b) 【规则 5.5· 无敌】免疫状态本身是有价值的局面特征。
  // 【为什么必须建模，否则 AI 不会去抢无敌卡】
  //   无敌不改变任何棋子的位置与 worth，故若只靠位置项评估，
  //   「取卡」与「不取卡」两局面的 evalState 分差为 0
  //   （与此前「赏骰 leaf 分差恒为 0」完全同类的问题 ——
  //     期权类收益不进静态局面分，必须显式建模）。
  //   缺了这项，搜索会认为无敌卡 worthless，在三张候选中必然不选。
  //
  // 【实现坑 · 绝不能直接用传进来的 threat 表】
  //   threatTables 对免疫方返回的是**全零表**（见该函数内注释②），
  //   于是此处 `threat[c]` 恒为 0 → 补偿量算成 0 → 分差恒 0，
  //   免疫白给。这是个**静默失效**：代码不报错，只是模型没生效。
  //   故必须用「假如自己无敌、但把无敌标记摘掉」重算一份威胁表，
  //   两者之差才是免疫的真实收益。
  if (isInvincible(pl)) {
    if (o.noThreat) { /* 免疫补偿属于威胁口径，一并消融 */ }
    else {
      const naive = naiveThreatOf(g, pIdx);
      for (const gr of pl.groups) {
        if (gr.pos < 0 || inHomeLane(gr.pos)) continue;
        const c = cellNo(pIdx, gr.pos);
        if (c < 0 || c >= 52) continue;
        const chance = naive[c];
        if (chance <= 0) continue;
        s += worth(gr.pos, gr.size) * chance * W.threatRisk;
      }
    }
  }

  // 4) 期望被吃损失（概率加权，不是二值）
  if (!o.noThreat) {
    for (const gr of pl.groups) {
      if (gr.pos < 0 || inHomeLane(gr.pos)) continue;      // 基地与航道内免疫
      const c = cellNo(pIdx, gr.pos);
      if (c < 0 || c >= 52) continue;
      const chance = threat[c];
      if (chance <= 0) continue;
      const val = worth(gr.pos, gr.size);
      s -= val * chance * W.threatRisk;
      if (!o.noContest && isContested(g, pIdx, gr.pos)) {
        s += Math.min(val * W.contestHedge, W.contestMax) * chance;
      }
    }
  }

  // 5) 聚集风险：同格多枚被一锅端，损失是叠加的
  if (!o.noCluster) {
    const byCell = new Map();
    for (const gr of pl.groups) {
      if (gr.pos < 0 || inHomeLane(gr.pos)) continue;
      const c = cellNo(pIdx, gr.pos);
      byCell.set(c, (byCell.get(c) || 0) + gr.size);
    }
    for (const [, n] of byCell) {
      if (n >= 2) s -= (n - 1) * W.clusterPenalty;
    }
  }

  return s;
}

/**
 * 零和局面评估：**我方价值 − 敌方价值之和**
 *
 * 【为什么是「求和」而非「均摊」或「取最大」—— 三轮实测的结论】
 * 赛跑制（谁先收官谁赢）的零和量是「我相对**每一个**对手的领先幅度之和」。
 * 削减任何一个对手的进度都等量有效，规则里不存在「只有压过最强的才算收益」。
 * 三种口径在同一局面下的实测（吃掉一枚 worth(46)=693 的敌子，敌方损失 628 分）：
 *   均摊 Σ/(n−1)        → 314 分（除以对手数）
 *   0.85·max + 0.15·avg →  47 分（**稀释 92%**）
 *   等权求和 Σ           → 628 分（无稀释）
 * max 口径最危险：两个对手分数并列时，oppMax 恒取其一，
 * 吃掉「非最强」对手的棋子对该项贡献恒为 0，收益被挤进权重 0.15 的均摊项。
 * 后果实测：3 人局吃子优势仅 6 分 < 推进 9 分 → 搜索主动放弃吃子。
 * 均摊的「尺度与人数无关」动机不成立：搜索的比较都发生在同一子树的
 * 同一玩家数之下，尺度因子在同层比较中会被约掉。
 *
 * @param {Game} g
 * @param {number} me 当前决策方
 * @param {Map<number, number[]>} [tables] 预构建的威胁表，避免重复计算
 * @param {object} [opts] 消融/标定开关，见 optOf 上方的文档。缺省 = 全开。
 * @returns {number} 越大对 me 越有利。4 人局尺度约为 2 人局的 2 倍，属预期。
 */
function evalState(g, me, tables, opts) {
  if (g.over) return g.winner === me ? W.winBonus : -W.winBonus;

  const tt = tables || threatTables(g);

  const mine = playerScore(g, me, tt.get(me), opts);
  let oppTotal = 0;
  let oppCount = 0;
  for (const pl of g.players) {
    if (pl.id === me) continue;
    oppTotal += playerScore(g, pl.id, tt.get(pl.id), opts);
    oppCount++;
  }
  if (!oppCount) return mine;

  /**
   * 【为什么是「等权求和」而非 max / 均摊 —— 本轮修复的核心】
   *
   * 赛跑制（谁先收官谁赢）的零和量是：**我相对每一个对手的领先幅度之和**。
   * 削减任何一个对手的进度，对「我不能被抢跑」这个目标都是等量有效的 ——
   * 规则里不存在「只有压过最强的那个才算收益」这回事。
   *
   * 三种口径的实测对比（3 人局，吃掉一枚 worth(46)=693 的敌子，
   * 即敌方损失 628 分；同局面下推进 3 格我方净涨约 92 分）：
   *
   *   口径                | 吃子体现为 | 是否被稀释
   *   -------------------|-----------|-----------
   *   均摊 Σ/(n−1)        | 628/2=314 | 除以对手数
   *   0.85·max + 0.15·avg |    47     | **稀释 92%，最严重**
   *   等权求和Σ           |628    | 无
   *
   * max 口径的病态性质尤其隐蔽：**当两个对手分数并列时**，
   * oppMax 恒取其中之一，吃掉「非最强」对手的棋子对该项贡献恒为 0，
   * 全部收益被迫挤进权重仅 0.15 的均摊项，再除以对手数。
   * 探针实测 3 人局吃子优势仅 6 分、推进 9 分 → 搜索主动放弃吃子。
   *
   * 【为什么可以直接求和，不需要归一化】
   * 均摊的原设计动机是「让评估尺度与玩家数无关」，但这个动机不成立：
   * 搜索的所有比较都发生在**同一子树的同一玩家数**之下，
   * 尺度因子在 alpha-beta 的同层比较中会被约掉。
   * 真正需要尺度稳定的只有跨配置的评估函数标定（如探针的量级断言），
   * 那些断言按人数分别校准即可。
   */
  return mine - oppTotal;
}

/**
 * 相对完成度（0..约 2）—— 供对照实验报告「AI 平均领先多少」
 * 注意：这是直观度量而非胜率，仅用于量化诊断。
 */
function progressOf(g, pIdx) {
  const pl = g.players[pIdx];
  const total = g.quick ? 1 : 4;
  let v = (pl.finished / total);
  for (const gr of pl.groups) {
    v += gr.pos < 0 ? 0 : Math.min(gr.pos, FINISH) / FINISH;
  }
  return v;
}

/* ==================== core/snapshot.js ==================== */
/**
 * 对局快照 —— 树搜索的地基
 *
 * 【为什么必须有】搜索的本质是「假设我走了这一步，看看后果」，
 * 而后一步必须能被撤销。没有快照就只能「真的走一遍再 undo」，
 * 但 undo 需要精确逆操作 —— 吃子会把敌子拆成多个编队、抵达终点会
 * splice 掉编队、绑定会 splice 索引，逆操作极易漏项且难验证。
 * 与其手写逆操作（易错），不如做**深拷贝快照**（无脑但可靠）：
 * 搜索分支跑完直接丢弃副本，真实对局一个字节都不动。
 *
 * 【为什么随机流也必须快照】mulberry32 掷骰会推进内部状态。
 * 若只快照对局状态而漏掉随机流，则模拟一条走法后骰子流已被消耗，
 * 下一条走法会从不同的骰子序列开始 —— 同一局面两次搜索得到不同结论，
 * 既无法复现也无法对照实验。故 rngState 与对局状态同进同出。
 *

/** 深拷贝单个玩家的可变状态 */

    hasDice: pl.hasDice,
    discard: pl.discard.slice(),
    finished: pl.finished,
    playedCard: pl.playedCard,
    points: pl.points,
    usedSix: pl.usedSix,
    pendingExtra: pl.pendingExtra,
    extraPoints: pl.extraPoints,
    bonusPoints: pl.bonusPoints,

    startPlayer: g.startPlayer,
    over: g.over,
    winner: g.winner,

    quick: g.quick,

 * 对局对象的引用（legalActions 等规则接口都吃 Game 实例），
 * 若每次还原都换新对象，规则层拿到的引用会与搜索持有的引用脱节。
 * 就地还原保证「同一个 Game 实例，状态被来回搬运」。

    dst.hand = src.hand.slice();
    dst.hasDice = src.hasDice;
    dst.discard = src.discard.slice();
    dst.finished = src.finished;
    dst.playedCard = src.playedCard;
    dst.points = src.points;
    dst.usedSix = src.usedSix;
    dst.pendingExtra = src.pendingExtra;
    dst.extraPoints = src.extraPoints;
    dst.bonusPoints = src.bonusPoints;
    dst.invincible = src.invincible || 0;

  g.queue = s.queue.slice();
  g.used = s.used.slice();
  g.turn = s.turn;
  g.startPlayer = s.startPlayer;
  g.over = s.over;
  g.winner = s.winner;

  // 否则 UI 会把「AI 假想走法」当成真实行动播报给玩家。
  g.log.length = s.logLen;

/**

 * 【场景】搜索需要一个「与真实对局状态相同、但完全独立」的对象来试走。
 * 不能只靠 snapshot/restore 的就地还原：搜索可能在中途放弃某条分支
 * （时间预算耗尽而提前返回），此时手上的快照起点已被覆盖，无法回到起点。

/**

 * 【为什么需要置换表】expectimax 会反复到达同一局面
 * （尤其「我这步走完，轮次切换后又回到类似局面」）。
 * 相同局面的评估值只取决于局面本身，与到达路径无关，故可缓存复用 ——
 * 这是搜索引擎最有效的一类剪枝。

 *   - 随机流状态**不入键**：评估是局面的纯函数，

    // 漏掉会导致置换表返回另一个局面的估值 —— 且不报任何错。
