<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一夜终极飞行棋 · ULTIMATE LUDO</title>
<style>
/* 一夜终极飞行棋 · Web 版样式
   配色沿用 70 年代科幻极简调色板（与 board.py / theme.py 一致）
   深色底 + 骨白字 + 四色玩家色，纯 CSS 无外部依赖 */

:root {
  /* 【可读性调整 · 2026-10-05】用户反馈整体过黑、看不清。
     把深空配色整体抬亮一档：底色由 #141110 提到 #1C1712，
     面板/描边同步提亮，次要文字 muted 由 #9A9082 提到 #C3B7A4，
     在保留 70 年代科幻暖调的同时保证正文可读。 */
  --void: #1C1712;
  --ink: #281F18;
  --panel: #322619;
  --bone: #F2E8D4;
  --muted: #C3B7A4;
  --line: #4A3D30;
  --ember: #E2571F;
  --gold: #EFC02E;
  --avocado: #7F9440;
  --steel: #4A7FA5;
  --mono: 'IBM Plex Mono', 'Consolas', 'SFMono-Regular', monospace;
  --sans: 'Century Gothic', 'Futura', 'Avenir Next', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--void);
  color: var(--bone);
  font-family: var(--sans);
  min-height: 100vh;
  overflow: hidden;
}

.ul-shell { display: flex; flex-direction: column; height: 100vh; }

/* ------------------------------------------------------------ 顶栏 */
.ul-top {
  display: flex; align-items: center; gap: 24px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #1b1613, var(--void));
  flex: 0 0 auto;
}
.ul-brand { display: flex; flex-direction: column; gap: 2px; }
.ul-logo { font-size: 19px; font-weight: 700; letter-spacing: 4px; color: var(--bone); }
.ul-logo2 { color: var(--ember); margin-left: 4px; }
.ul-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; }
.ul-turn { margin-left: auto; text-align: center; }
.ul-turn-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; }
.ul-turn-no { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1; }
.ul-ctrl { display: flex; gap: 8px; }

.ul-btn {
  background: var(--panel); color: var(--bone);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 14px; font-size: 12px; font-family: var(--sans);
  letter-spacing: 1px; cursor: pointer; transition: all .15s;
}
.ul-btn:hover { border-color: var(--ember); color: #fff; }
.ul-btn-ghost { background: transparent; }
.ul-btn.ul-on { background: var(--ember); border-color: var(--ember); color: #fff; }
.ul-btn-lg { padding: 11px 30px; font-size: 14px; margin-top: 18px; }

/* ------------------------------------------------------------ 主区
   【布局原则】棋盘独占左列并吃掉全部剩余高度；玩家 / 手牌 / 日志竖排到右列。
   手牌栏原本在棋盘下方（footer），纵向吃掉 ~150px，是「棋盘小到看不清」的主因；
   移入右列后棋盘高度只被顶栏 + 工位栏 + 状态栏占用。 */
.ul-main { display: flex; flex: 1 1 auto; min-height: 0; }

.ul-boardcol {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.ul-boardwrap {
  flex: 1 1 auto; min-height: 0; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 8px;
  /* 兜底：内容过多时会挤压主区，避免棋盘溢出压到其它栏 */
  overflow: hidden;
}
.ul-board {
  position: relative;
  /* 不写「100vh − 魔法数字」：顶栏/工位栏/手牌栏任一高度变化都会算错，
     棋盘要么溢出压住手牌栏、要么白白留白。改为填满 boardwrap 的可用高度，
     aspect-ratio 保证正方、max-width 兜住窄屏 —— 自动取到最大且不溢出。 */
  height: 100%;
  aspect-ratio: 1;
  max-width: 100%;
  /* 容器隔离混合上下文，使 .ul-boardwash 的 screen 混合只作用于静态棋盘，
     不会越界污染侧栏/顶栏 */
  isolation: isolate;
}
/* ------------------------------------------------------------ 棋盘层
   【为什么亮度仍不够】
   印刷稿底色是 #0E0C0A（亮度≈4.6%），brightness() 是「乘法」滤镜：
   1.9 × 14/255 ≈ 27/255，乘完仍是近黑。单纯加大 brightness 会先让骨白文字过曝，
   航道岔依然糊成一片。正确做法是：在静态棋盘之上叠一层「屏幕混合（screen）」的暖光，
   screen 混合的语义是「提亮暗部、保留亮部」，能把近黑底色抬到可读的中棕，
   同时保持彩色航道线不被冲淡。

   实测方案：brightness(2.4) 先把航道线拉亮到饱和，再用 screen 暖光把整体底色
   抬到中棕（中心亮、边缘略沉的暖调 vignette），深空氛围仍在但完全可读。 */
.ul-boardimg {
  position: absolute; inset: 0;
  z-index: 0;
  filter: brightness(2.4) contrast(1.04) saturate(1.3);
}
.ul-boardimg svg { width: 100%; height: 100%; display: block; }

/* 屏幕混合暖光层：只抬亮静态棋盘，不碰其上的棋子/骰子（它们 z-index 更高，画在 wash 之上） */
.ul-boardwash {
  position: absolute; inset: 0;
  z-index: 1; pointer-events: none;
  mix-blend-mode: screen;
  background: radial-gradient(circle at 50% 44%,
              rgba(150,128,100,.52) 0%,
              rgba(96,80,62,.34) 55%,
              rgba(60,50,40,.22) 100%);
}

/* 棋盘容器加一层暖光底，避免纯黑背景显得脏（比印刷稿略亮，纯装饰）
   注意：这里不要再声明 width/aspect-ratio —— 会覆盖上面的 height:100% 自适配，
   导致棋盘变成长方形。尺寸只在上一条规则里定义一次。 */
.ul-board {
  background: radial-gradient(circle at 50% 42%, #3a2e23 0%, #241c16 62%, #15110d 100%);
  border-radius: 10px;
}
.ul-overlay {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 2;
  cursor: pointer;
  /* 棋子层与棋盘层同步提亮，否则暗底上的亮棋子会显得刺眼、脱离棋面 */
  filter: brightness(1.25);
}
/* 状态条（棋盘上方独立一行）：承载骰子 / 阶段提示 / 最近动作。
   三者曾用 absolute 叠在棋盘内 → 遮挡棋格，现统一改为文档流内的常驻行。 */
.ul-statusbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 14px;
  padding: 4px 16px; min-height: 30px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #1e1915, var(--void));
}

/* 棋子交互态 */
.pt { cursor: pointer; transition: opacity .2s; }
.pt:hover { opacity: 1; filter: brightness(1.15); }
.pt-target circle { animation: ptpulse 1.3s ease-in-out infinite; }
@keyframes ptpulse {
  0%, 100% { opacity: .85; r: 30; }
  50% { opacity: .35; r: 34; }
}
.pt-ghost { animation: ptfade 1.4s ease-in-out infinite; }
@keyframes ptfade { 0%, 100% { opacity: .5; } 50% { opacity: .22; } }

/* 动画：跳跃 */
.pt-jump { animation: ptjump .5s ease-out; }
@keyframes ptjump {
  0% { transform: translateY(0); }
  40% { transform: translateY(-22px) scale(1.12); }
  100% { transform: translateY(0) scale(1); }
}
/* 动画：吃子 */
.pt-captured { animation: ptcap .55s ease-in forwards; }
@keyframes ptcap {
  0% { opacity: 1; }
  100% { opacity: 0; transform: scale(.2) rotate(60deg); }
}
/* 动画：抵达终点 */
.pt-finish { animation: ptfin .7s ease-out; }
@keyframes ptfin {
  0% { transform: scale(1); }
  50% { transform: scale(1.5); filter: brightness(2); }
  100% { transform: scale(1); }
}

/* 骰子与阶段（均在状态条内，不再叠在棋盘上） */
.ul-dice {
  flex: 0 0 auto; display: flex; align-items: center;
  pointer-events: none;
  animation: diceroll .5s ease-out;
}
@keyframes diceroll {
  0% { transform: scale(.3) rotate(-120deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.ul-phase {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12px; letter-spacing: 1px; white-space: nowrap;
}
.ul-tag {
  color: var(--c); border: 1px solid var(--c);
  padding: 4px 12px; border-radius: 20px; background: rgba(20,17,16,.9);
}
.ul-dim { color: var(--muted); }
.ul-flash { animation: flash 1.5s ease-out; }
@keyframes flash {
  0% { background: rgba(226,87,31,.5); }
  100% { background: transparent; }
}

/* ------------------------------------------------------------ 注意力引导
   【为什么需要】用户反馈「点开不知道怎么操作、卡死在那边」。
   根因不是逻辑冻结，而是缺少引导：轮到人类时没有任何醒目的「该你了」信号。
   下面三类脉冲让「当前该谁动、该点哪里」一目了然：
   1) 阶段提示条在轮到人类决策时变成金色实心脉冲（.ul-phase-act + .ul-tag-act）
   2) 人类可选的手牌在 CARD 阶段持续脉冲（.ul-hcard-wait）
   3) 人类可点的棋子在 MOVE 阶段持续脉冲（.pt-active） */

/* 关键：脉冲动画不能再带 translateX(-50%) —— 阶段条已不在棋盘内居中定位 */
.ul-phase.ul-phase-act .ul-tag,
.ul-tag-act {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--void);
  font-weight: 700;
  letter-spacing: 1px;
  animation: tagpulse 1.15s ease-in-out infinite;
}
@keyframes tagpulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,192,46,.55); transform: scale(1); }
  50% { box-shadow: 0 0 22px -2px var(--gold); transform: scale(1.05); }
}

/* 底部手牌在轮到人类选牌时脉冲，明确「点这里出牌」 */
.ul-hcard.ul-hcard-wait {
  border-color: var(--gold);
  animation: hcardwait 1.1s ease-in-out infinite;
}
@keyframes hcardwait {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 0 0 rgba(239,192,46,0); }
  50% { transform: translateY(-7px); box-shadow: 0 0 20px -3px var(--gold); }
}

/* 棋盘上可点击的棋子脉冲，明确「点这枚棋子移动」 */
.pt.pt-active { animation: ptact 1.2s ease-in-out infinite; }
@keyframes ptact {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(242,232,212,.0)); }
  50% { filter: drop-shadow(0 0 9px rgba(242,232,212,.95)); }
}

/* 侧栏当前行动玩家卡片在轮到人类时额外高亮 */
.ul-pcard-on { box-shadow: 0 0 0 1px var(--c), 0 0 16px -4px var(--c); background: #2e251d; }

/* ------------------------------------------------------------ 侧栏 */
.ul-side {
  flex: 0 0 300px;
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
  /* 比纯黑提亮一档：日志与工位说明全是小字，背景过暗会读不清 */
  background: #1e1916;
}
.ul-players { padding: 10px; display: flex; flex-direction: column; gap: 7px; flex: 0 0 auto; }

.ul-pcard {
  border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: 5px; padding: 7px 10px; background: var(--panel);
  transition: all .2s;
}
.ul-pcard-on { box-shadow: 0 0 0 1px var(--c), 0 0 16px -4px var(--c); background: #2e251d; }
.ul-phead { display: flex; align-items: center; gap: 7px; }
.ul-pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.ul-pname { font-size: 12.5px; font-weight: 700; }
.ul-pcode { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; }
.ul-ptag {
  margin-left: auto; font-size: 8.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
}
/* 【规则 5.5】无敌徽标。
   刻意不用金色（--gold 是本项目「强调/可点」语义，会与可交互元素混淆）：
   免疫是**状态**而非**机会**，用中性青绿 + 描边表达「生效中」，
   且放在 .ul-ptag 之前 —— 后者有 margin-left:auto 会把它推到最右。 */
.ul-tag-inv {
  font-size: 8.5px; color: #7fd4c1; font-family: var(--mono);
  border: 1px solid #2f6b5f; border-radius: 3px; padding: 1px 5px;
  background: rgba(47,107,95,.18); white-space: nowrap;
}
.ul-pchips { display: flex; gap: 4px; margin: 5px 0 3px; }
.ul-chip {
  width: 15px; height: 15px; border-radius: 3px;
  border: 1.5px solid var(--c); background: transparent;
}
.ul-chip-fin { background: var(--c); box-shadow: 0 0 7px -1px var(--c); }
.ul-pmeta { display: flex; gap: 10px; font-size: 10px; color: var(--muted); font-family: var(--mono); }
.ul-pcard2 { font-size: 9.5px; color: var(--muted); margin-top: 2px; opacity: .75; }

/* 日志标题（侧栏日志区仍用） */
.ul-stationhead {
  font-size: 10px; letter-spacing: 2px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 6px;
}

/* ------------------------------------------------------------ 工位栏（棋盘上方独立一条）
   放在棋盘上方而非侧栏：侧栏可被「侧栏」按钮隐藏，一隐藏工位就彻底消失；
   也不做成弹窗，避免遮住棋盘格。整条高度压到 ~34px，尽量少挤占棋盘空间。 */
.ul-stabar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 18px;
  padding: 5px 16px; min-height: 34px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #26201a, #1e1915);
}
.ul-sb-left { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; }
.ul-sb-label {
  font-size: 10px; letter-spacing: 2px; color: var(--gold);
  text-transform: uppercase; white-space: nowrap;
}
.ul-sb-label .ul-dim { text-transform: none; letter-spacing: 0; }
.ul-sb-hot { color: var(--ember); font-weight: 700; animation: sblabel 1.1s ease-in-out infinite; }
@keyframes sblabel { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

.ul-sb-items { display: flex; gap: 6px; flex-wrap: wrap; }
.ul-sb-item {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 5px;
  padding: 3px 9px; background: var(--panel);
  white-space: nowrap; font-size: 11px; color: var(--bone);
}
.ul-sb-no { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--gold); }
.ul-sb-txt b { font-weight: 700; font-size: 11px; }
.ul-sb-txt i { font-style: normal; font-size: 9.5px; color: var(--muted); margin-left: 4px; }
/* 轮到你抢：卡片金色脉冲 + 可点，杜绝「看不到工位」 */
.ul-sb-item.ul-sb-on { cursor: pointer; border-color: var(--gold); animation: sbpick 1.15s ease-in-out infinite; }
.ul-sb-item.ul-sb-on:hover { background: var(--gold); color: var(--void); }
.ul-sb-item.ul-sb-on:hover .ul-sb-no,
.ul-sb-item.ul-sb-on:hover .ul-sb-txt i { color: var(--void); }
@keyframes sbpick {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,192,46,0); transform: translateY(0); }
  50% { box-shadow: 0 0 14px -2px var(--gold); transform: translateY(-3px); }
}

.ul-sb-right { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
.ul-sb-row { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; }
.ul-sb-k { color: var(--muted); letter-spacing: 1px; }
.ul-sb-chip {
  border: 1px solid var(--c); color: var(--c);
  border-radius: 4px; padding: 1px 6px;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
}

/* ------------------------------------------------------------ 实时动作提示（toast）
   常驻状态条右端，显示最近一次动作。独立于侧栏 —— 隐藏侧栏时仍能看到谁做了什么。 */
.ul-toast {
  flex: 0 1 auto; min-width: 0;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 20px;
  background: rgba(18,15,13,.93);
  border: 1px solid var(--c, var(--line));
  font-family: var(--mono); font-size: 12px; letter-spacing: .4px;
  box-shadow: 0 4px 16px -6px #000;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ul-toast[hidden] { display: none; }
.ul-toast .t-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--bone)); flex: 0 0 auto; }
.ul-toast .t-who { color: var(--c, var(--bone)); font-weight: 700; }
.ul-toast .t-txt { color: var(--bone); opacity: .9; }

/* ------------------------------------------------------------ 侧栏可隐藏
   手牌已移入侧栏，因此「隐藏侧栏」不能整列 display:none —— 否则玩家看不到手牌、
   也无法点出击/工位效果。改为只折叠「玩家面板 + 日志」，手牌保留成窄条，
   棋盘仍能拿到大部分宽度。 */
.ul-shell.side-hidden .ul-side { flex: 0 0 214px; }
.ul-shell.side-hidden .ul-players,
.ul-shell.side-hidden .ul-logbox { display: none; }
.ul-shell.side-hidden .ul-handbar { border-top: none; max-height: none; }
.ul-shell.side-hidden .ul-boardwrap { padding: 14px; }

.ul-logbox { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 8px 10px; border-top: 1px solid var(--line); }
.ul-log { flex: 1 1 auto; overflow-y: auto; font-size: 10px; line-height: 1.65; font-family: var(--mono); }
.ul-log-turn { color: var(--gold); margin: 5px 0 3px; letter-spacing: 1px; }
.ul-log-l { color: var(--bone); opacity: .82; }
.ul-log-win { color: var(--ember); font-weight: 700; margin-top: 5px; }

/* ------------------------------------------------------------ 手牌区（竖排侧栏里的一块）
   原为棋盘下方 footer，纵向吃掉约 150px 使棋盘变小；现移入右列竖排。 */
.ul-handbar {
  flex: 0 0 auto;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: linear-gradient(0deg, #1b1613, var(--void));
  padding: 9px 10px;
  display: flex; flex-direction: column; gap: 8px;
  /* 工位效果按钮会临时塞进来，限高避免把日志区挤没 */
  max-height: 46%; overflow-y: auto;
}
.ul-hand-idle { font-size: 12.5px; color: var(--muted); }
.ul-hand-idle b { font-size: 14px; }
/* 侧栏只有 300px 宽：信息块不再占 250px 固定列，改为整行；卡片缩到 62×80 以便一行放 3 张 */
.ul-handinfo { border-left: 3px solid var(--c); padding-left: 9px; }
.ul-hi-name { font-size: 13px; font-weight: 700; color: var(--c); }
.ul-hi-meta { font-size: 9.5px; color: var(--muted); font-family: var(--mono); margin: 3px 0; }
.ul-hi-meta i { font-style: normal; color: var(--gold); margin-right: 3px; }
.ul-hi-hint { font-size: 10.5px; color: var(--bone); opacity: .7; line-height: 1.45; }

.ul-hcards { display: flex; gap: 7px; flex-wrap: wrap; }
.ul-hcard {
  width: 62px; height: 80px;
  border: 1px solid var(--line); border-radius: 7px;
  background: linear-gradient(160deg, #33291f, var(--panel));
  color: var(--bone); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; transition: all .15s; font-family: var(--sans);
}
.ul-hcard:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 8px 20px -8px var(--gold); }
.ul-hc-top { font-size: 22px; font-weight: 700; font-family: var(--mono); line-height: 1; }
.ul-hc-bot { font-size: 8px; color: var(--muted); text-align: center; padding: 0 4px; line-height: 1.35; }
.ul-hcard-dice { border-color: var(--avocado); }
.ul-hcard-dice .ul-hc-top { font-size: 13px; color: var(--avocado); }
.ul-hcard-six { border-color: var(--gold); background: linear-gradient(160deg, #453a1c, var(--panel)); }
.ul-hcard-six .ul-hc-top { color: var(--gold); }
.ul-hcard-extra { border-color: var(--ember); }
.ul-hcard-extra .ul-hc-top { font-size: 15px; color: var(--ember); }

/* 【决斗 · 2026-10-09】暗扣出牌：标题卡用高亮描边与脉冲提示「必须现在决策」 */
.ul-hcard-duel {
  border-color: var(--gold);
  border-width: 2px;
  background: linear-gradient(180deg, rgba(227,194,117,.16), rgba(227,194,117,.04));
  animation: duelpulse 1.1s ease-in-out infinite;
}
.ul-hcard-duel .ul-hc-top { font-size: 14px; color: var(--gold); }
@keyframes duelpulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(227,194,117,.55); }
  50%     { box-shadow: 0 0 0 5px rgba(227,194,117,0); }
}

/* ------------------------------------------------------------ 弹窗 */
.ul-modal {
  position: fixed; inset: 0; background: rgba(10,8,7,.86);
  display: flex; align-items: center; justify-content: center; z-index: 99;
  backdrop-filter: blur(3px);
}
/* hidden 属性必须能真正隐藏弹窗：作者样式的 display:flex 会盖过
   UA 的 [hidden]{display:none}，必须用同权重(带属性选择器)的规则兜底，
   否则点「开始游戏 / 知道了 / 再来一局」都关不掉。 */
.ul-modal[hidden] { display: none; }
.ul-modal-box {
  background: var(--panel); border: 1px solid var(--ember); border-radius: 10px;
  padding: 26px 30px; max-width: 860px; max-height: 86vh; overflow-y: auto;
  box-shadow: 0 20px 60px -20px #000;
}
.ul-modal-h { font-size: 17px; margin-bottom: 16px; letter-spacing: 1px; }
.ul-modal-close { margin-top: 16px; }
.ul-opts { display: flex; flex-wrap: wrap; gap: 9px; }
.ul-opt {
  background: #33291f; border: 1px solid var(--gold); color: var(--bone);
  border-radius: 6px; padding: 10px 16px; font-size: 12px; cursor: pointer;
  font-family: var(--sans); transition: all .15s;
}
.ul-opt:hover { background: var(--gold); color: var(--void); }

.ul-win { text-align: center; }
.ul-win-crown { font-size: 44px; color: var(--gold); }
.ul-win-name { font-size: 26px; font-weight: 700; margin-top: 8px; }
.ul-win-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ------------------------------------------------------------ 开局设置 */
.ul-setup { display: flex; flex-direction: column; gap: 14px; }
.ul-setup-row { display: flex; align-items: center; gap: 14px; }
.ul-setup-label {
  flex: 0 0 82px; font-size: 11px; color: var(--ember);
  letter-spacing: 2px; text-transform: uppercase;
}
.ul-setup-opts { display: flex; gap: 7px; flex-wrap: wrap; }
.ul-setup-opt {
  background: #33291f; border: 1px solid var(--line); color: var(--bone);
  border-radius: 6px; padding: 7px 16px; font-size: 12px; cursor: pointer;
  font-family: var(--sans); transition: all .15s;
}
.ul-setup-opt:hover { border-color: var(--gold); }
.ul-setup-on { background: var(--ember); border-color: var(--ember); color: #fff; }
.ul-setup-note { font-size: 10.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }

.ul-help { display: flex; gap: 26px; }
.ul-help-col { flex: 1; font-size: 11.5px; line-height: 1.75; }
.ul-help-col h3 {
  font-size: 11px; color: var(--ember); letter-spacing: 2px;
  margin: 12px 0 5px; text-transform: uppercase;
}
.ul-help-col h3:first-child { margin-top: 0; }
.ul-help-col p { color: var(--bone); opacity: .85; margin-bottom: 5px; }
.ul-help-col b { color: var(--gold); }

/* ------------------------------------------------------------ 窄屏 */
@media (max-width: 1100px) {
  .ul-side { flex-basis: 270px; }
  .ul-help { flex-direction: column; gap: 10px; }
}
@media (max-width: 860px) {
  .ul-main { flex-direction: column; overflow-y: auto; }
  /* 窄屏只能上下堆叠：棋盘列不再抢高度，改由宽度决定边长 */
  .ul-boardcol { flex: 0 0 auto; }
  .ul-side { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--line); }
  .ul-board { height: auto; width: 100%; }
  .ul-log { max-height: 220px; }
}
</style>

/* ==================== core/board.js ==================== */
/**
 * 棋盘模型与坐标换算 —— 一切移动判定的数学基础
 *
 * 【核心设计】用「玩家无关的抽象进度 u」表示棋子位置：
 *   u = 0      → 该玩家的起点同色格
 *   u = 0..51  → 主航道（映射到 52 格共享航道上的实际格号）
 *   u = 52..57 → 自己的终点航道（第 1..6 格）
 *   u = 57     → 终点格（完成）
 *
 * 好处：4 名玩家共用同一套移动/跳跃逻辑，只有 u→格号 的映射随玩家不同。
 * 规则书 1.4 的棋盘定义经 24 项不变量验证自洽（见 test/board.test.js）。
 */
const TRACK = 52;        // 主航道格数（共享环形回路）
const LANE = 6;          // 每人终点航道格数
const HOME_START = 52;   // u >= 52 即进入终点航道
const FINISH = 57;       // u = 57 为终点格
const PATH = 58;         // u 取值范围 0..57

/** 各玩家起点在 52 格共享航道上的格号（规则书 1.4：0 / 13 / 26 / 39） */
const STARTS = [0, 13, 26, 39];

/** 玩家配色（与 board.svg / 棋子 SVG 一致） */
const PLAYER_COLORS = ['#E2571F', '#EFC02E', '#7F9440', '#4A7FA5'];

/**
 * 该玩家的专属同色格集合（规则书 1.4：沿前进方向每 4 格 1 处，共 13 处）。
 * 对应 u = 0, 4, 8, ..., 48（含 48 —— u=48+4=52 恰为终点航道第 1 格，
 * 这一处是「跳跃进入终点航道」路径的触发点，不可遗漏）。
 */
function ownCells() {
  const s = [];
  for (let u = 0; u <= 48; u += 4) s.push(u);
  return s;
}

const OWN = new Set(ownCells());

/** u 是否为某处专属同色格（跳跃触发条件） */
function isOwnCell(u) {
  return OWN.has(u);
}

/** u 所属玩家的抽象进度 → 52 格共享航道上的实际格号。仅 u < 52 有意义。 */
function cellNo(player, u) {
  return (STARTS[player] + u) % TRACK;
}

/** 反向：共享航道格号 → 某玩家视角下的 u（用于渲染与合法性校验） */
function uFromCell(player, cell) {
  const d = (cell - STARTS[player] + TRACK) % TRACK;
  return d;
}

/** 终点航道第几格（1..6），仅在 u >= 52 时有效 */
function lanePos(u) {
  return u - TRACK + 1;
}

/** 是否已进入终点航道 */
function inHomeLane(u) {
  return u >= HOME_START;
}

/** 是否已抵达终点格 */
function isFinish(u) {
  return u === FINISH;
}

/** 棋子是否处于「免疫外力」状态：终点航道内 + 终点格（规则书 5.4） */
function isImmune(u) {
  return u >= HOME_START;
}


/* ==================== core/geom.js ==================== */
/**
 * 棋盘渲染几何 —— board.py 的 JS 移植
 *
 * 目的：规则层用「玩家无关的抽象进度 u」表达位置（见 board.js），
 * 但渲染层必须给出每个 u 对应的像素坐标。本模块是两者之间唯一的换算层，
 * 常量与 board.py 严格一致（改动时两处必须同步，否则棋子会画错格）。
 *
 * 坐标系：viewBox 0 0 1400 1400，圆心 (700,700)，角度单位为度，
 * 0° 指向 +x 轴，逆时针为正（与 board.py 的 polar() 一致）。
 * 主航道格 i 的中心角 = -90 + i * STEP，即 0 号格在正上方，顺时针递增。
 */

/** viewBox 尺寸与圆心 —— 与 board.py 的 W/H/CX/CY 一致 */
const VB = 1400;
const CX = 700;
const CY = 700;

/** 主航道：52 格，每格角宽 */
const TRACK_N = 52;
const STEP = 360 / TRACK_N;

/** 各玩家起点格号直接复用 board.js，不重复声明 —— 单一真相源。
 *  【为什么必须在同一文件导出】打包成单文件时所有模块被压平到同一作用域，
 *  同名 const 会触发 "Identifier has already been declared"。 */

/** 主环内外半径 */
const R_TRACK_OUT = 520;
const R_TRACK_IN = 452;
/** 主航道格心的绘制半径（取环带中点） */
const R_TRACK_MID = (R_TRACK_IN + R_TRACK_OUT) / 2;

/** 终点航道：单格径向厚 38，格间距 4，共 6 格，最外端半径 442 */
const LANE_CELL = 38;
const LANE_GAP = 4;
const LANE_R_OUT = 442;
const LANE_COUNT = 6;
/** 终点航道第 k 格（k=0..5）的中心半径 */
const LANE_STEP = LANE_CELL + LANE_GAP;
const R_LANE_MID = LANE_R_OUT - LANE_CELL / 2;

/** 基地：内外半径与半角宽 */
const BASE_R_IN = 530;
const BASE_R_OUT = 612;
const BASE_HALF_ANG = 8;
const BASE_SLOT_R = 558;
/** 基地 4 个槽位的角偏移（与 board.py bases() 的 off 一致） */
const BASE_SLOT_OFF = [-5.4, -1.8, 1.8, 5.4];

/** 极坐标 → 直角坐标 */
function polar(r, deg) {
  const a = (deg * Math.PI) / 180;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}

/** 主航道第 i 格（0..51）的中心角 */
function trackAngle(i) {
  return -90 + i * STEP;
}

/**
 * 主航道第 i 格的中心坐标
 * @param {number} i 格号 0..51
 * @param {number} rOpt 可选：覆盖绘制半径
 */
function trackCell(i, rOpt = R_TRACK_MID) {
  return polar(rOpt, trackAngle(i));
}

/** 终点航道的中心角（每位玩家不同：位于自己起点格之后） */
function laneAngle(player) {
  return trackAngle(STARTS[player]) - STEP / 2 - 1.2;
}

/**
 * 终点航道第 lane 格（1..6）的中心坐标
 * @param {number} player 0..3
 * @param {number} lane 1..6
 */
function laneCell(player, lane) {
  const r = R_LANE_MID - (lane - 1) * LANE_STEP;
  return polar(r, laneAngle(player));
}

/**
 * 基地槽位坐标
 * @param {number} player 0..3
 * @param {number} slot 0..2（第 4 槽在 board.py 里是 ghost 装饰，不放实体棋子）
 * @param {number} ring 0=内圈 1=外圈，用于双层摆放避免重叠
 */
function baseSlot(player, slot, ring = 0) {
  const off = BASE_SLOT_OFF[slot % 3];
  const r = ring === 0 ? BASE_SLOT_R - 9 : BASE_SLOT_R + 9;
  return polar(r, trackAngle(STARTS[player]) + off * (ring === 0 ? 1 : -1));
}

/**
 * 把「玩家 p 的抽象进度 u」映射为屏幕坐标 —— 渲染层的唯一入口
 *
 * @param {number} player 0..3
 * @param {number} u 抽象进度：-1=基地，0..51=主航道，52..57=终点航道
 * @param {object} opt
 * @param {number} opt.slot 基地槽位序号（u=-1 时用）
 * @param {number} opt.ring 基地内外圈（u=-1 时用）
 * @param {number} opt.jitter 同格多子时的微偏移序号
 * @returns {{x:number, y:number, zone:string}}
 */
function pieceXY(player, u, opt = {}) {
  // 同格多子时才做微偏移，默认 0 —— 保证 u=0 精确落在起点格中心（测试依赖此性质）
  const j = opt.jitter || 0;
  const dx = (j % 3) * 13 - (j > 0 ? 13 : 0);
  const dy = Math.floor(j / 3) * 13 - (j > 2 ? 13 : 0);

  if (u < 0) {
    const p = baseSlot(player, (opt.slot || 0) % 3, opt.ring || 0);
    return { x: p.x + dx, y: p.y + dy, zone: 'base' };
  }
  if (u >= 52) {
    const lane = u - 52 + 1;
    if (lane > LANE_COUNT) return { x: CX, y: CY, zone: 'finish' };
    const p = laneCell(player, lane);
    return { x: p.x, y: p.y, zone: lane === LANE_COUNT ? 'goal' : 'lane' };
  }
  const cell = (STARTS[player] + u) % TRACK_N;
  const p = trackCell(cell);
  return { x: p.x + dx, y: p.y + dy, zone: 'track' };
}

/**
 * 游戏状态模型

 * 【关键抽象 —— 编队 Group】
 * 规则书第六章「绑定编队」规定：绑定的两枚棋子视为整体，必须同步移动、同步跳跃、
 * 不可单独拆分，被吃时整组退回基地。
 * 若按「棋子」建模，移动/吃子/解散都要写绑定分支，极易漏。
 * 因此本项目把「棋子」抽象为「编队 Group」：
 *   - 单枚棋子 = size 1 的编队
 *   - 绑定后    = size 2 的编队
 * 移动、吃子、跳跃全部只作用于编队，绑定逻辑自然内聚。
 *
 * 位置表示：
 *   -1        → 在基地待命（未出场）
 *   0..57     → 在棋盘上，值为棋盘模型的抽象进度 u
 */

/** 功能工位（编号即索引 +1，与卡面一致）
 *
 * 【2026-10-09 调整 · 无敌 4 张 → 2 张，工位牌总数 18 → 16】
 * 起因：引入「主动吃子 = 决斗」后，吃子不再是稳吃，攻击方有被反杀的风险，
 * 而无敌是**唯一能完全跳过决斗**的效果（踩无敌直接被弹回、不进入决斗），
 * 其相对价值被显著放大。故把 #17 / #18 两张无敌移除，无敌保留 #15–#16 共 2 张，
 * 工位牌库总数由 18 张降为 16 张（规则书 1.2 / 8.3 同步改为 16 张）。

 */
const STATIONS = [
  { id: 1,  name: '灵活前进',   kind: 'move',   min: 1, max: 4 },
  { id: 2,  name: '出击 & 绑定', kind: 'deployOrBind' },
  { id: 3,  name: '手牌调整',   kind: 'tune',   count: 1 },
  { id: 4,  name: '极速突进',   kind: 'move',   fixed: 6 },

  { id: 6,  name: '回溯取回',   kind: 'retrieve', count: 1 },
  { id: 7,  name: '赏骰奖励',   kind: 'bonusDice' },
  { id: 8,  name: '前进 3–6 格', kind: 'move',   min: 3, max: 6 },
  { id: 9,  name: '前进 2–5 格', kind: 'move',   min: 2, max: 5 },
  { id: 10, name: '弃牌 2 次',   kind: 'discard', count: 2 },
  { id: 11, name: '回收 2 次',   kind: 'retrieve', count: 2 },
  { id: 12, name: '调整 2 次',   kind: 'tune',   count: 2 },
  { id: 13, name: '出击 & 绑定', kind: 'deployOrBind' },
  { id: 14, name: '极速突进 8 格', kind: 'move',  fixed: 8 },
  { id: 15, name: '无敌',       kind: 'invincible' },
  { id: 16, name: '无敌',       kind: 'invincible' },

/**
 * 【无敌 · 规则 5.5】免疫吃子的持续轮数
 *
 * 【为什么是 2 而不是 1 —— 本条由实测反馈驱动】
 * 初版按字面「当前回合免疫吃子」实现为 1，探针与压测立刻暴露它**几乎零收益**：
 * 工位是在**自己回合的最后一步**才取的（见 flow.js 逐人连续口径），
 * 玩家取到卡时本轮已经走完，没有任何敌人再行动 —— 即「当前回合」这个窗口
 * 在时序上根本不覆盖任何一次攻击。4 张牌等于 4 张废牌。

 * 【递减时机】取卡时置 2；每轮收尾（nextTurn）减 1。
 * 故取卡当轮为 2（含其余对手行动），下一轮为 1（仍免疫），
 * 再下一轮归0 —— 正好是「这回合 + 下回合」。

const INVINCIBLE_ROUNDS = 2;

/**
 * 【裁定 1】四人工位队列只有 3 张，第 4 名玩家无牌可选。

 * 与「6 点玩家无选取资格」属同类例外，规则体系内自洽。
 */
const STATION_PICK_LIMIT = 3;

/**
 * 回收阈值 —— 【回归规则书 4.3 原文，撤回「裁定 3」】
 * 规则书 109–110 行：「当个人全部 6 张数字手牌均进入弃牌区后，可一次性收回
 * 全部数字弃牌，重新补满 1–6 全套。无任何提前回收途径，仅『全部打光』触发一次性回收。」
 * 故阈值 = 0：只有手牌被清空（全部 6 张都在弃牌区）时才回收。
 *
 * 【为什么撤回原「持有 ≤3 张即补满」的裁定 3】各 120 局对照（同一套 AI、同一种子族）：
 *   ┌──────────────────┬───────────┬──────────────┐
 *   │ 指标             │ 裁定3 (≤3) │ 规则书 (打光) │
 *   ├──────────────────┼───────────┼──────────────┤
 *   │ 平均弃牌区张数    │ 1.24      │ 3.03         │
 *   │ 弃牌区为空轮次占比 │ 23.6%     │ 6.9%         │
 *   │ 依赖弃牌区工位空转 │ 10.32/局  │ 2.76/局      │
 *   │ 平均轮数         │ 45.3      │ 46.5         │
 *   │ 死锁 / 异常      │ 0 / 0     │ 0 / 0        │
 *   └──────────────────┴───────────┴──────────────┘
 * 裁定 3 让玩家「打出的牌刚进弃牌区就被回收清空」，弃牌区名存实亡，
 * 直接导致 #3 手牌调整 / #6 回溯取回 / #11 回收 2 次 三张工位几乎永远无牌可用
 * （每局空转 10 次）。改回规则书后空转降 73%，对局长度与死锁率不变。
 *
 * 【改用阈值 0 的前置修复】阈值 0 会让手牌真的被打空，此时若 AI 不会用骰子行动牌就会死锁
 * —— 实测暴露 ai.js 的字段名 bug：AI 读的是 state.js 遗留的 pl.hasDiceCard，
 * 而 Game 的玩家对象字段是 hasDice（恒为 undefined）→ 骰子牌从未进入候选 →
 * 手牌一空 chooseCard 返回 null → Game.chooseCard 抛「手牌中没有 null」（120/120 全崩）。
 * 已统一为 hasDice，规则 4.2「骰子行动牌永久独立、每回合可无限选用」才真正生效。
 */
const RECYCLE_AT = 0;

/**
 * 手牌容量上限 —— 规则书 1.2 / 2.3
 * 原文：「玩家手牌 每人 1 套：数字牌 1–6 各 1 张 + 骰子行动牌 1 张，<b>全程固定持有</b>」。
 * 骰子行动牌独立计数（不进弃牌区、不参与回收），故数字手牌上限恒为 6。
 *
 * 【为什么必须有这个上限 · 不变量修复 2026-10-06】
 * 工位 #3 手牌调整 / #12 调整 2 次 与 #6 回溯取回 / #11 回收 2 次 都会把手牌「加牌」。
 * 原实现无上限，实测：
 *   - 单次 tune 即让手牌 6 → 7 张
 *   - 连续 4 次回溯取回可把手牌撑到 10 张
 * 而规则书 4.3 的回收条件是「<b>全部 6 张</b>数字手牌均进入弃牌区」——
 * 手牌一旦超过 6 张就<b>永远打不空</b>，回收机制彻底失效，
 * 玩家会被困在「手牌里点数重复、越打越多」的循环里（实测打光后仍剩 2 张）。
 * 故 tune / retrieve 必须按剩余容量裁剪，拿不下就不给该选项。
 */
const HAND_CAP = 6;

/**
 * 创建一个玩家的初始状态
 * @param {number} p 玩家序号 0..3
 * @param {boolean} quick 是否极速单子模式（每人 1 枚）
 */
function newPlayer(p, quick) {
  return {
    id: p,
    color: null,           // 由 UI 层填入
    // 编队列表：未出场时只有基地待命编队
    groups: [],
    hand: [1, 2, 3, 4, 5, 6],   // 数字手牌（6 不可被调整）
    hasDice: true,// 骰子行动牌永久独立，不进弃牌区（字段名与 Game 保持一致）
    discard: [],                // 个人数字弃牌区
    finished: 0,                // 已入终点格的棋子数
    /**
     * 【无敌 · 规则 5.5】剩余免疫轮数，0 = 无敌不生效。
     * 取卡时置 INVINCIBLE_ROUNDS(2)，每轮 nextTurn 递减。
     * 语义是**玩家级**而非棋子级：免疫期内该玩家所有棋子都不可被吃。
     */
    invincible: 0,
  };
}

/**
 * 该玩家当前是否处于无敌状态（免疫吃子）—— 规则 5.5
 *
 * 【为什么做成独立函数而不是到处读 pl.invincible > 0】
 * 吃子判定、评估层、搜索模拟三处都要用同一个判据。
 * 若各自写 `pl.invincible > 0`，一旦将来改成「免疫到下一轮结束」之类的
 * 相对时序，就会出现三处口径不一致 —— 且这种不一致**不会报任何错**，
 * 只会表现为「AI 偶尔去吃无敌的子」，极难定位。故收敛到单一真相源。
 *
 * @param {object} pl 玩家状态
 * @returns {boolean}
 */
function isInvincible(pl) {
  return (pl.invincible || 0) > 0;
}

/**
 * 初始化一局
 * @param {object} opts
 * @param {number} opts.players 2..4
 * @param {boolean} opts.quick 极速单子模式
 * @param {string} opts.seed 随机种子（种子化随机，保证同种子可复现）
 */
function initGame({ players = 4, quick = true, seed = 'ludo' } = {}) {
  // 随机数发生器保存在闭包外，通过 seed 派生 —— 不放进 state，
  // 避免「状态快照」与「随机流」耦合（回放时需要用同 seed 重建随机流）
  const rand = makeRng(seed);


  const state = {
    players: [],
    turn: 0,               // 轮次（从 0 开始）
    startPlayer: 0,        // 本轮起始玩家（决定顺位基准与并列时的顺时针顺序）
    stationDeck: [],       // 工位牌库（洗匀后的队列）
    stationQueue: [],      // 可见工位队列，长度恒为 n-1
    log: [],               // 事件日志（供 UI 播报动画 / 回放）
    seed,
    quick,
    over: false,
    winner: null,
  };

  for (let p = 0; p < players; p++) {
    const pl = newPlayer(p, quick);
    // 开局福利：免费出场 1 枚至起点同色格（u = 0）
    pl.groups.push({ pos: 0, size: 1, home: true });
    // 经典模式：剩余 3 枚在基地待命
    if (!quick) {
      for (let i = 0; i < 3; i++) pl.groups.push({ pos: -1, size: 1, home: true });
    }
    state.players.push(pl);
  }

  // 洗工位牌库 —— 种子化随机
  const deck = STATIONS.map((s) => s.id);
  shuffle(deck, () => rand());
  state.stationDeck = deck;

  // 开局亮出 n-1 张
  const visible = state.players.length - 1;
  state.stationQueue = state.stationDeck.splice(0, visible);

  // 起始玩家由随机种子决定
  state.startPlayer = Math.floor(rand() * state.players.length);

  return state;
}

/**
 * 种子化随机数发生器（mulberry32）
 * 【设计要点】规则层绝不直接调用 Math.random()。
 * 所有随机性从外部注入 → 同一 seed 必然复现同一局 → 可回放、可测试。
 *
 * 【搜索引擎必需 · 2026-10-06】返回的函数额外挂 getState/setState。
 *   树搜索（expectimax）必须能把随机流「存回去」：模拟一个假设分支时，
 *   若不能恢复随机流状态，则每试一条走法都会真实消耗掉后续骰子，
 *   搜出来的局面无法复现，整棵搜索树失去意义。
 *   mulberry32 的全部状态就是一个 uint32，故快照成本为O(1)。
 *   这两个方法以「函数属性」形式挂载而非改返回值形状，
 *   故 makeRng(seed) 的现有契约（返回无参函数）完全不变。
 */
function makeRng(seed) {
  let h = 1779033703 ^ String(seed).length;
  for (let i = 0; i < String(seed).length; i++) {
    h = Math.imul(h ^ String(seed).charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  const rand = function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  // 随机流快照：mulberry32 状态 = 单个 uint32
  rand.getState = () => a >>> 0;
  rand.setState = (s) => { a = s >>> 0; };
  return rand;
}

/** Fisher–Yates 洗牌（种子化） */
function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 掷骰：1..6 */
function rollDie(rand) {
  return Math.floor(rand() * 6) + 1;
}

/** 编队在基地待命数量 */
function inBase(player) {
  return player.groups.filter((g) => g.pos === -1).length;
}

/** 编队总棋子数（经典 4 / 极速 1） */
function pieceCount(player, quick) {
  return quick ? 1 : 4;
}

/** 该玩家是否还有任何可移动的编队（用于自动跳过判定，规则书 1.3 唯一豁免） */
function hasMovable(player) {
  return player.groups.some((g) => g.pos >= 0 && g.pos < FINISH);
}

/**
 * 【Bug 修复 · 2026-10-05 阶段二】终局判定必须容忍「编队数组已不含已完成棋子」
 *
 * 修复前：抵达终点格的编队仍留在 groups 里（pos === FINISH），
 *   于是两枚「都在终点格」的棋子能被 bindGroups 绑定，finished 计数与
 *   groups 长度脱钩（实测 finished=4 但 groups.length=3），checkWin 失真 → 死锁。
 * 修复后：抵达终点即从 groups 移除，故 pieceCount 不应再用 quick 推算，
 *   而应直接以 finished 为唯一真相：finished === 该玩家总棋子数（quick ? 1 : 4)。
 *
 * @param {object} state 需具备 players 与 quick
 * @param {number} playerIdx
 */
function checkWin(state, playerIdx) {
  const pl = state.players[playerIdx];
  return pl.finished >= pieceCount(pl, state.quick);
}


/* ==================== core/movement.js ==================== */
/**
 * 移动判定 —— 规则书第五章
 *
 * 这里是全项目最容易出错的地方，三条裁定都在此实现：
 *
 * 【核心铁则 · 精准步数】所有移动必须按要求点数「正好走完」，
 *   禁止少走、多走、主动走 0 步。步数不足/超出终点剩余格数 → 移动非法。
 *
 * 【裁定 2】跳跃落点若已进入终点航道，棋子正常入航道并停住，本回合不再移动；
 *   此后骰子行动牌与数字手牌均可推进它（见 2026-10-06 规则修正）。
 *   依据：【规则 5.2 润色说明】「若落点已进入终点航道，按规则照常进入」—— 属跳跃的自然结果。
 *
 * 【规则 5.4 · 2026-10-06 修正】终点航道权限：
 *   · 进入终点格（u=57）：仅骰子行动牌（isDiceAction）可精准进入；
 *     数字手牌与各类工位效果均不能进入终点格（FINISH_NEEDS_DICE）。
 *   · 进入 / 移动终点航道（u=52..56）：骰子行动牌（isDiceAction）与数字手牌（allowLane）均可；
 *     各类工位效果仍不可（维持 5.4「工位不影响航道棋子」，见 station.js）。
 *   终点航道内的棋子仍不受吃子、绑定、工位效果影响；点数不足/超出属规则限制。
 *
 * 【裁定 5 · 已撤回】曾放行「一步精准跨入航道口」违反旧 5.4，已收紧；
 *   现按新规则数字手牌可进入航道（canEnterHome），仅终点格仍锁给骰子行动牌。
 */


/**
 * 计算一次精准移动的结果（纯函数，不修改任何状态）
 *
 * @param {object} p        玩家状态
 * @param {object} g        编队 {pos, size}
 * @param {number} steps    要求走完的步数
 * @param {object} opts
 * @param {boolean} opts.isDiceAction 本次行动是否来自骰子行动牌（仅此可进入终点格）
 * @param {boolean} opts.canEnterHome 是否允许「首次进入」终点航道
 * @param {boolean} opts.allowLane 是否为数字手牌（可进入并移动终点航道，但不能进终点格）
 * @returns {object} {ok, reason, from, to, jumped, captured}
 */
function computeMove(p, g, steps, { isDiceAction = false, canEnterHome = false, allowLane = false } = {}) {
  const from = g.pos;
  const fail = (reason) => ({ ok: false, reason, from, to: from, jumped: false, captured: [] });

  // 规则 1.3 唯一豁免：无可移动棋子时不视为走 0 步
  if (from < 0) return fail('PIECE_IN_BASE');
  if (from >= FINISH) return fail('PIECE_FINISHED');

  // 【核心铁则 · 修复 2026-10-06】步数必须为正：禁止走 0 步，也不允许负步数（倒退）。
  // 规则书 1.3：「所有回合、所有移动效果，均必须按规则要求的点数正好走完对应步数，
  //   <b>禁止少走、禁止多走、禁止主动选择走 0 步</b>」。
  // 此守卫此前缺失，computeMove(pl, g, 0) 会原样返回 {ok:true, to:from}，
  // 即「原地不动」被当成合法移动 —— 任何上游只要漏了步数下限校验，
  // 就会静默产生「棋子没动但回合已结算」的假动作。负数更危险：会真的让棋子倒退。
  if (!Number.isInteger(steps) || steps < 1) return fail('INVALID_STEPS');

  // 精准步数：必须刚好走完，不允许超出终点
  const raw = from + steps;
  if (raw > FINISH) return fail('OVERRUN_FINISH');

  // 【规则修正 2026-10-06 · 用户规则「非骰子不能用于进入终点，但是可以用于进入航道」】
  // 终点格（u === FINISH = 57）只有骰子行动牌（isDiceAction）能精准进入；
  // 数字手牌（allowLane）与各类工位效果（allowLane=false）均不能进终点格。
  if (raw === FINISH && !isDiceAction) return fail('FINISH_NEEDS_DICE');

  // 已在航道内的棋子：
  //   · 骰子行动牌（isDiceAction）可推进；
  //   · 数字手牌（allowLane）可推进（=「可以用于进入航道」）；
  //   · 各类工位效果（allowLane 未置）仍不可移动航道棋子，维持 5.4「工位不影响航道棋子」。
  if (inHomeLane(from) && !isDiceAction && !allowLane) return fail('LANE_NEEDS_DICE');

  // 首次进入航道（from < 52 且 raw >= 52）：仅 canEnterHome 为真时允许。
  // 数字手牌与骰子行动牌以 canEnterHome=true 进入；工位效果恒为 false，仍不可冲入航道。
  // 唯一例外是【规则 5.2 润色说明】的跳跃：落在己方末位同色格（u=48）时跳 4 格进入航道，
  // 属「跳跃落点照常进入」，不占用「进入航道」权限（该跳跃在下方按 canEnterHome 判定）。
  const entersHome = raw >= HOME_START && from < HOME_START;
  if (entersHome && !canEnterHome) return fail('CANNOT_ENTER_HOME');

  let to = raw;

  // 【规则 5.2】跳跃：移动结束精准落在己方同色格 → 沿前进方向跳到下一个同色格
  // 润色说明：只跳一次，不连锁
  let jumped = false;
  if (isOwnCell(to)) {
    const j = to + 4;
    // 跳跃落点进入终点航道时，须遵守「进入航道权限」（canEnterHome）：
    // 数字手牌 / 骰子行动牌可跳入；工位效果（canEnterHome=false）不跳，停在 u=48 同色格。
    if (j <= FINISH && (j < HOME_START || canEnterHome)) {
      to = j;
      jumped = true;
    }
  }

  // 【裁定 2】跳跃落入终点航道 → 正常入航道并停住，本回合不再移动

  return {
    ok: true,
    from,
    to,
    jumped,
    enteredHome: inHomeLane(to),
    landedCell: inHomeLane(to) ? null : cellNo(p.id, to),
    lanePos: inHomeLane(to) ? lanePos(to) : null,
  };
}

/**
 * 执行移动 + 吃子（会修改状态）
 * @param {object} state 需具备 players 数组（Game 实例或 {players:[...]} 均可）
 * @param {number} pIdx 玩家序号
 * @param {number} gIdx 编队索引
 * @param {object} mv computeMove 的返回值
 * @returns {object} 实际发生的事件，供 UI 播报
 */
function applyMove(state, pIdx, gIdx, mv) {
  const players = state.players || state;
  const player = players[pIdx];
  const g = player.groups[gIdx];
  // duels：落点触发的待决斗列表（吃子不再在这里完成，改由 game 推进决斗流程）
  const events = { type: 'move', from: mv.from, to: mv.to, jumped: mv.jumped, captured: [], bounced: false, duels: [] };

  g.pos = mv.to;
  g.home = false;

  // 抵达终点格
  if (mv.to === FINISH) {
    player.finished += g.size;
    events.finished = true;
  }

  // 【规则 5.4】已抵达终点格（u === FINISH）的棋子退出棋盘，不再是任何编队的一部分。
  // 【Bug 修复 · 2026-10-05 阶段二实测发现】
  //   原实现把已到终点的棋子留在 groups 里且 pos 仍为 FINISH，导致两个连锁错误：
  //   1) bindGroups 只检查 a.pos === b.pos，于是两枚「都在终点」的棋子能被绑定成编队，
  //      finished 计数与实际编队数脱钩（实测出现 finished=4 但 groups.length=3）。
  //   2) 这些僵尸编队让 checkWin 的分母判断失真，终局永远不触发（实测 1/200 局死锁）。
  //   规则依据：终点格是「完成」状态而非「棋盘上的位置」，规则书 5.4 规定
  //   终点航道与终点格内的棋子不受吃子、绑定、任何工位效果影响。
  //   修法：抵达终点即从 groups 移除，finished 成为唯一真相。
  if (mv.to === FINISH) {
    player.groups.splice(gIdx, 1);
  }

  // 【规则 5.3 / 5.5】吃子与无敌弹回：落点格结算交给 resolveLanding 统一处理。
  if (mv.landedCell !== null && mv.landedCell !== undefined) {
    const res = resolveLanding(players, pIdx, mv.landedCell);
    events.captured = res.captured;
    events.duels = res.duels || [];
    if (res.bounced) {
      // 【规则 5.5 无敌新作用 · 2026-10-06】落点蹲着无敌敌子 → 我方被弹回基地。
      // 无敌棋子变成「刺」：任何敌子踩到它，踩的人回老家（不触发吃子）。
      g.pos = -1;
      g.home = true;
      events.bounced = true;
    }
  }

  return events;
}

/**
 * 落点结算：决斗 / 无敌弹回（规则书 5.3 / 5.4 / 5.5）
 *
 * 给定「我方（moverIdx）棋子落到绝对格 cell」这一事实，结算后果：
 *  · 若落点蹲着【无敌】敌子 → 我方被弹回基地（bounced=true），不击退任何人。
 *    （规则 5.5 无敌新作用 · 2026-10-06：「别人踩上去别人回老家」——
 *     无敌棋子变成「刺」，任何敌子踩到它，踩的人回老家。
 *     【2026-10-09 裁定】无敌方**不进入决斗**：踩无敌直接被弹回，
 *     无敌保持「免战」语义 —— 引入决斗后无敌的相对价值本就上升，
 *     故牌数由 4 张减为 2 张，而机制强度不再叠加削弱。）
 *  · 否则 → 落点上的敌子**不再被直接吃掉**，而是触发一场「决斗」（规则 5.3 新增）：
 *     双方同时暗扣一张牌 → 揭示 → 比点数 → 平手攻击方胜、点数小的回家。
 *
 * 【为什么改成「返回待决斗列表」而不是直接击退】
 * 决斗需要双方出牌（真人要交互、AI 要决策），无法在纯几何结算里一步完成。
 * 故本函数只负责「判定谁要跟谁打」，把决斗本身交给 game/duel 模块推进。
 * 这样 UI（等待玩家出牌）与 AI 模拟（自动出牌）可以共用同一份判定。
 *
 * @param {Array} players   玩家数组（需含 id / groups / invincible）
 * @param {number} moverIdx 落子方序号
 * @param {number} cell     落点绝对格号（cellNo 产出）
 * @returns {{bounced:boolean, captured:Array, duels:Array<{player,size,groupIndex}>}}
 *   duels 为待决斗的敌子列表（逐一决斗，见 game.js）；
 *   captured 保留字段（当前恒为空，吃子结果由决斗产生），
 *   bounced=true 时调用方须把己方棋子弹回基地。
 */
function resolveLanding(players, moverIdx, cell) {
  const captured = [];
  const duels = [];
  // 第一遍：落点是否蹲着无敌敌子 → 弹回我方，整步作废（不吃任何人）。
  // 【口径 · 为什么是「踩的人回老家」而不是「该格变安全格」】
  // 无敌是「免于被吃」+「踩我者被弹回」，不是「该格不可进入」。
  // 若把整步判非法会凭空造安全格，与 1.3「本局无安全格」冲突（那是更强的 buff）。
  let bounced = false;
  for (const other of players) {
    if (other.id === moverIdx) continue;
    if (!isInvincible(other)) continue;
    for (const og of other.groups) {
      if (og.pos < 0) continue;              // 基地待命不触发
      if (inHomeLane(og.pos)) continue;      // 【规则 5.4】终点航道免疫
      if (cellNo(other.id, og.pos) === cell) { bounced = true; break; }
    }
    if (bounced) break;
  }
  if (bounced) return { bounced: true, captured, duels: [] };

  // 第二遍：登记待决斗的敌子（不再直接击退 —— 吃子改为由决斗决定）。
  // 【逐一决斗 · 2026-10-09 裁定】落点同时站着多名敌对玩家的棋子时，
  //   攻击方与每个敌对玩家各打一场（每场重新暗扣出牌）：
  //   全胜则全部吃掉；输任意一场则攻击方自己回家、后续场次取消。
  //   （若同一玩家在该格有多枚，它们同属一场决斗的后果，故按玩家去重登记。）
  const perPlayer = new Map();
  for (const other of players) {
    if (other.id === moverIdx) continue;
    if (isInvincible(other)) continue;       // 无敌玩家整家免疫（也不决斗）
    for (let i = other.groups.length - 1; i >= 0; i--) {
      const og = other.groups[i];
      if (og.pos < 0) continue;              // 基地待命不触发
      if (inHomeLane(og.pos)) continue;      // 【规则 5.4】终点航道免疫
      if (cellNo(other.id, og.pos) !== cell) continue;
      if (!perPlayer.has(other.id)) perPlayer.set(other.id, []);
      perPlayer.get(other.id).push({ index: i, size: og.size });
    }
  }
  for (const [pid, list] of perPlayer) {
    // 同一玩家的棋子合并为一场：整组后果一致（绑定编队整组退回，规则 6）
    duels.push({
      player: pid,
      size: list.reduce((a, b) => a + b.size, 0),
      groupIndex: list[0].index,
      groupIndexes: list.map((x) => x.index),
    });
  }
  return { bounced: false, captured: [], duels };
}

/**
 * 执行一次「决斗败方回家」的后果（把某玩家的指定编队退回基地）
 *
 * 【为什么抽成函数】决斗结算、以及未来可能的其它效果都要用到「退回基地」，
 * 而规则 6 的「绑定关系自动解除」必须被严格遵守 —— 若只置 pos=-1 而保留 size，
 * 会出现「整组退回基地后仍是 size=2 编队」，进而让「出场 1 枚」一次带出 2 枚。
 * 收敛到一处，避免重犯。
 *
 * @param {object} player 被击退的玩家状态
 * @param {number[]} groupIndexes 要退回的编队索引（从大到小处理以避免索引错位）
 * @returns {number} 实际退回的棋子总数
 */
function sendHome(player, groupIndexes) {
  let total = 0;
  const idxs = groupIndexes.slice().sort((a, b) => b - a);
  for (const i of idxs) {
    const og = player.groups[i];
    if (!og) continue;
    total += og.size;
    if (og.size > 1) {
      // 绑定编队整组退回，并按 size 拆成若干 size=1 的独立编队（规则 6）
      player.groups.splice(i, 1);
      for (let k = 0; k < og.size; k++) {
        player.groups.splice(i, 0, { pos: -1, size: 1, home: true });
      }
    } else {
      og.pos = -1;
      og.home = true;
    }
  }
  return total;
}

/**
 * 列出该玩家本次可执行的移动选项（供 UI 渲染可点击目标 / AI 决策）
 *
 * @param {object} p    玩家状态 {id, groups, ...}
 * @param {number} steps 步数
 * @param {object} opts
 * @param {boolean} opts.isDiceAction 本次是否来自骰子行动牌
 * @param {boolean} opts.canEnterHome 是否允许进入终点航道
 * @param {boolean} opts.allowLane 是否为数字手牌（可进入/移动航道，不能进终点格）
 * @param {boolean} opts.forSix       是否为 6 点二选一（额外提供「出场」选项）
 * @returns {Array} [{gIdx, sixKind, mv}]
 *   sixKind: 'deploy' | null（前进类）
 */
function legalMoves(p, steps, { isDiceAction = false, canEnterHome = false, allowLane = false, forSix = false } = {}) {
  const out = [];

  // 6 点选项①：从基地出场 1 枚至起点同色格（u = 0）
  if (forSix) {
    const idx = p.groups.findIndex((g) => g.pos === -1);
    if (idx >= 0) out.push({ gIdx: idx, sixKind: 'deploy', mv: null });
  }

  // 常规/选项②移动
  for (let i = 0; i < p.groups.length; i++) {
    const g = p.groups[i];
    if (g.pos < 0) continue;
    const mv = computeMove(p, g, steps, { isDiceAction, canEnterHome, allowLane });
    if (mv.ok) out.push({ gIdx: i, sixKind: null, mv });
  }
  return out;
}

/**
 * 【规则 6】绑定编队：将同格两枚己方棋子绑定为同步编队
 * @returns {boolean} 是否成功绑定
 */
function bindGroups(player, i, j) {
  const a = player.groups[i];
  const b = player.groups[j];
  if (!a || !b) return false;
  if (a.pos < 0 || a.pos !== b.pos) return false;   // 必须同格且都已出场
  if (a.size + b.size > 2) return false;           // 编队上限 2 枚
  a.size += b.size;
  a.home = false;                                  // 绑定后已出场，清除待命标记
  player.groups.splice(j, 1);
  return true;
}


/* ==================== core/hand.js ==================== */
/**
 * 手牌循环与升级置换 —— 规则书 4.2 / 4.3 / 4.5
 *
 * 【回收条件 · 规则书 4.3 原文】回收仅由「6 张数字手牌全部打光」触发，
 * 一次性收回全部数字弃牌、补满 1–6 全套，无任何提前回收途径。
 *
 * 【曾有的「裁定 3」已撤回】该裁定把条件放宽为「持有 ≤3 张即补满」。
 * 撤回理由（120 局对照，见 state.js 注释）：它让打出的牌刚进弃牌区就被回收清空，
 * 弃牌区名存实亡 → #3 手牌调整 / #6 回溯取回 / #11 回收 2 次 每局空转 10.32 次；
 * 回归规则书后降至 2.76 次，对局长度与死锁率不变。
 *
 * 升级硬约束（规则书 4.5，不可突破）：
 *   - 调整范围严格为 1–5，数字 6 既不可作为来源也不可作为结果
 *   - 1 只能升到 2（不可降到 0）；5 只能降到 4（不可升到 6）
 *   - 2 / 3 / 4 可升可降
 *   - 经升级的牌新点数本局永久有效
 */

// 回收阈值属于「手牌循环」语义，从 state.js 转出，便于测试直接引用

/** 升级牌堆：数字 1–5 各 10 张（规则书 1.2，不含 6） */
function newUpgradePile() {
  const pile = {};
  for (let v = 1; v <= 5; v++) pile[v] = 10;
  return pile;
}

/** 判断某张牌能否 ±1 调整，并返回可选的新点数 */
function tuneOptions(card) {
  const opts = [];
  if (card === 6) return opts;          // 6 不可调整
  if (card + 1 >= 1 && card + 1 <= 5) opts.push(card + 1);
  if (card - 1 >= 1 && card - 1 <= 5) opts.push(card - 1);
  return opts;
}

/**
 * 执行一次升级：把一张弃牌区的牌调整为新点数，永久生效
 * @returns {object|null} {from, to, pileDelta} 或 null（不可调整）
 */
function tuneCard(pile, card, to) {
  const opts = tuneOptions(card);
  if (!opts.includes(to)) return null;
  if (pile[to] === undefined || pile[to] <= 0) return null;  // 牌堆该点数已空
  pile[to] -= 1;         // 从升级牌堆取出新点数对应的牌
  pile[card] = (pile[card] || 0) + 1;  // 原牌放回升级牌堆
  return { from: card, to, pileDelta: { [to]: -1, [card]: +1 } };
}

/** 打出数字手牌（4.2）：进入个人数字弃牌区 */
function playCard(player, card) {
  const i = player.hand.indexOf(card);
  if (i < 0) return false;
  player.hand.splice(i, 1);
  player.discard.push(card);
  return true;
}

/**
 * 【规则书 4.3】手牌回收：6 张数字手牌全部打光（手牌为空）时，
 * 弃牌区全部收回并补齐 1–6 全套
 *
 * 【语义澄清 —— 关键】规则书 4.3 原文「当个人全部 6 张数字手牌均进入弃牌区后，
 * 可一次性收回全部数字弃牌，重新补满 1–6 全套」。
 * 「补满 1–6 全套」= 手中恰好各有一张 1、2、3、4、5、6。
 * 实现要点（踩过的坑）：
 *   - 若只从牌堆取「任意一张」，会反复取到同一点数 → 手牌变成 [1,1,1,3,4,5]，
 *     缺失的 2/6 永远补不上，且点数结构失衡。
 *   - 正确做法：先收回弃牌区全部牌，再按点数 1→6 顺序补齐「缺失且牌堆有货」的点数；
 *     若某点数牌堆已空，则从弃牌区回收的牌中挑选其他点数补上。
 *   - 6 不可调整也不可调整成 6，故牌堆无 6；但 6 牌不会进弃牌区参与补齐，
 *     因此只要保证 1–5 各补齐一张 + 手上原有的 6 牌，即构成完整 1–6。
 *
 * @param {object} player
 * @param {object} pile 升级牌堆（1–5 各 10 张，无 6）
 * @returns {object|null} {toHand, fromPile, missing} 或 null（未触发）
 */
function recycleIfNeeded(player, pile) {
  if (player.hand.length > RECYCLE_AT) return null;

  // 1) 收回全部：手上剩余的牌 + 弃牌区所有牌 = 玩家持有的全部数字牌
  //    【踩过的坑】早期实现只从弃牌区取牌，漏掉手上的牌 → toHand 总是少于真实持有量，
  //    手牌越打越少直至归零 → 死锁。总账必须是 hand ∪ discard。
  //
  //    【防御 · 2026-10-06】回收的目标是「重新补满 1–6 全套」，即补到 6 张。
  //    正常对局中 hand ∪ discard 恒为 6（工位 tune/retrieve 已按 HAND_CAP 裁剪），
  //    故两者之和必然 = 6。但若上游出现 bug 或存档被外部改写（实测：手牌 6 张 +
  //    弃牌区被塞 6 张 = 12 张），原实现会把 12 张全部塞回手牌 —— 手牌凭空翻倍，
  //    后续每轮都超过 6 张，牌面结构彻底崩坏。
  //    故此处按「补满」语义硬性截断：只保留 6 张进手牌，多余的留在弃牌区等下一轮。
  const all = [...player.hand, ...player.discard];
  const toHand = all.slice(0, 6);
  const leftover = all.slice(6);
  player.hand = [];
  player.discard = leftover;
  const fromPile = [];

  // 2) 补齐至 6 张
  //    【关键 —— 牌堆是有限存量】1–5 各 10 张共 50 张，而一局要打出 200+ 张牌。
  //    牌堆耗尽后必须靠「点数顶替」维持总数（手牌点数允许重复，只是不能有 6）。
  while (toHand.length < 6) {
    // 2a) 优先从牌堆补「当前缺失的点数」
    let filled = false;
    for (let v = 1; v <= 5; v++) {
      if (toHand.length >= 6) break;
      if (toHand.includes(v)) continue;
      if ((pile[v] || 0) > 0) {
        pile[v] -= 1;
        toHand.push(v);
        fromPile.push(v);
        filled = true;
      }
    }
    if (filled) continue;

    // 2b) 牌堆无货 → 用「重复点数」顶替一个缺失点数（总数不变，点数轮换）
    const counts = new Map();
    for (const c of toHand) counts.set(c, (counts.get(c) || 0) + 1);
    let donor = null;
    for (const [c, n] of counts) if (n >= 2) { donor = c; break; }
    let target = null;
    for (let v = 1; v <= 5; v++) if (!toHand.includes(v)) { target = v; break; }
    if (donor === null || target === null) break;   // 确实无牌可补（极端情况）
    const idx = toHand.indexOf(donor);
    toHand[idx] = target;
    pile[donor] = (pile[donor] || 0) + 1;            // 被牺牲的点数归回牌堆
  }

  player.hand = toHand;
  return { toHand, fromPile };
}

/** 该玩家手牌是否需要回收（供 UI 提示） */
function needsRecycle(player) {
  return player.hand.length <= RECYCLE_AT;
}
